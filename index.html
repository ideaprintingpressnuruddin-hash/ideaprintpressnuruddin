function workingDaysInMonth(month){
  if(!month) return 0;
  const [y,m]=month.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const now=new Date();
  let count=0;
  for(let d=1;d<=last;d++){
    const dt=new Date(y,m-1,d);
    if(dt>now) break;
    if(dt.getDay()!==5) count++;
  }
  return count;
}
function monthAttendance(month){
  const [y,m]=String(month).split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const today=new Date();
  const rows=vals(DATA.employees).filter(e=>e.active!==false).map(e=>{
    const days=DATA.attendance[e.id]||{};
    let present=0,late=0,hours=0,lastIn='';
    for(let d=1;d<=last;d++){
      const key=`${month}-${String(d).padStart(2,'0')}`;
      const dt=new Date(y,m-1,d);if(dt>today) break;
      const a=days[key];
      if(a?.in){present++;if(a.late)late++;lastIn=a.in;if(a.out)hours+=Math.max(0,timeMin(a.out)-timeMin(a.in));}
    }
    const wd=workingDaysInMonth(month);
    return {e,present,late,absent:Math.max(0,wd-present),hours,avgIn:lastIn,rate:wd?present/wd*100:0};
  });
  return rows;
}

/* লাইভ লোকেশন ম্যাপ মডাল (ক্লিক করলে) */
const F_MAP_DEF=[23.8,90.35];
/* ওপেন সোর্স, বিনামূল্যে ব্যবহারযোগ্য টাইল সার্ভার (API key লাগে না)।
   OSM-এর নিজস্ব সার্ভার অ্যাপ থেকে সরাসরি টাইল চাইলে ব্লক করে (403),
   তাই কার্টো/এসওএস-এর টাইল ব্যবহার করি — স্ট্রিট ম্যাপের মতোই দেখায়। */
const F_TILE_HOSTS=[
  (z,x,y)=>`https://a.tile.openstreetmap.fr/osmfr/${z}/${x}/${y}.png`,
  (z,x,y)=>`https://a.tile.opentopomap.org/${z}/${x}/${y}.png`,
  (z,x,y)=>`https://a.tile-cyclosm.openstreetmap.fr/cyclosm/${z}/${x}/${y}.png`,
  (z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${z}/${y}/${x}`
];
function fTileXY(la,lo,z){
  const n=2**z;
  return [Math.floor((lo+180)/360*n),
          Math.floor((1-Math.log(Math.tan(la*Math.PI/180)+1/Math.cos(la*Math.PI/180))/Math.PI)/2*n),n];
}
function fMapImgSet(la,lo,z=15){
  const img=$('#f-map-img'); if(!img) return;
  const [cx,cy,n]=fTileXY(la,lo,z);
  const W=768,H=768;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#e8eef3';ctx.fillRect(0,0,W,H);
  let loaded=0,ok=0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const X=((cx+dx)%n+n)%n,Y=Math.min(n-1,Math.max(0,cy+dy));
    const col=dx+1,row=dy+1;
    let host=0;
    const tryLoad=()=>{
      if(host>=F_TILE_HOSTS.length){
        if(++loaded===9&&!ok){ fMapCanvasFallback(ctx,W,H); img.src=cv.toDataURL('image/png'); }
        else if(++loaded===9){ img.src=cv.toDataURL('image/png'); }
        return;
      }
      const im=new Image();im.crossOrigin='anonymous';im.referrerPolicy='no-referrer';
      im.onload=()=>{ ok++; try{ctx.drawImage(im,col*256,row*256);}catch(e){}
        if(++loaded===9) img.src=cv.toDataURL('image/png'); };
      im.onerror=()=>{ host++; tryLoad(); };
      im.src=F_TILE_HOSTS[host](z,X,Y);
    };
    tryLoad();
  }
}

function fMapCanvasFallback(ctx,W,H){
  ctx.fillStyle='#e7efe9';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#c8dbcd';ctx.lineWidth=1;
  for(let i=0;i<=W;i+=48){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
  for(let j=0;j<=H;j+=48){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(W,j);ctx.stroke();}
  ctx.strokeStyle='#a9cdb6';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(0,H*0.62);ctx.lineTo(W,H*0.38);ctx.stroke();
  ctx.strokeStyle='#bcd9c6';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(W*0.3,0);ctx.lineTo(W*0.42,H);ctx.stroke();
}

function fLiveMapRefresh(empId){
  const a=DATA.attendance[empId]?.[todayISO()]||{};
  if(!a.lat||!a.lon) return;
  const la=Number(a.lat),lo=Number(a.lon);
  fMapImgSet(la,lo);
  const n=$('#f-map-name'); if(n) n.textContent=a.loc||'—';
  const t=$('#f-map-time'); if(t) t.textContent=a.locAt?fmtTime(a.locAt):'—';
  const l=$('#f-map-live'); if(l) l.textContent=a.in&&!a.out?'চেক-ইন · ট্র্যাকিং':'—';
  const co=$('#f-map-coord'); if(co) co.textContent=`${la.toFixed(5)}, ${lo.toFixed(5)}`;
  const ac=$('#f-map-acc'); if(ac&&S.geo?.acc) ac.textContent=`± ${S.geo.acc} মিটার`;
  const link=$('#f-map-link'); if(link) link.href=`https://www.google.com/maps?q=${la},${lo}`;
  const ol=$('#f-osm-link'); if(ol) ol.href=`https://www.openstreetmap.org/?mlat=${la}&mlon=${lo}#map=16/${la}/${lo}`;
}
async function fLocNow(empId){
  if(!navigator.geolocation){ toast('এই ব্রাউজারে লোকেশন সাপোর্ট নেই','bad'); return; }
  toast('লোকেশন নেওয়া হচ্ছে…','info');
  navigator.geolocation.getCurrentPosition(async pos=>{
    S.geo={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:Math.round(pos.coords.accuracy||0)};
    await fSaveLoc(empId,pos.coords.latitude,pos.coords.longitude,true);
    fLiveMapRefresh(empId);
    toast('লোকেশন আপডেট হয়েছে','good');
  },err=>{ toast(err.code===1?'লোকেশনের অনুমতি দিন':'লোকেশন পাওয়া যায়নি','bad'); },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
/* লাইভ লোকেশন সেল (আজকের হাজিরা টেবিলে) */
function fLiveLoc(e,a){
  const txt=a?.loc||'';
  const ts=a?.locAt?fmtTime(a.locAt):'';
  const live=a?.in&&!a?.out;
  const inner=txt
    ? `<i class="f-ll-dot ${live?'blink':''}"></i>${icon('pin','ic-sm')}<span>${esc(txt)}</span>${ts?`<em>${ts}</em>`:''}`
    : `${icon('pin','ic-sm')}<span>${live?'লোকেশন খোঁজা হচ্ছে…':'—'}</span>`;
  return `<button class="f-live-loc ${txt?'':'off'} ${live?'live':''}" type="button" data-act="f-geoloc" data-id="${esc(e.id)}" title="লাইভ লোকেশন দেখুন">${inner}</button>`;
}
/* পাঞ্চের সময় ব্রাউজারের লোকেশন নেওয়ার চেষ্টা (অনুমতি না দিলে চুপচাপ বাদ) */
function fGrabLocation(){
  return new Promise(resolve=>{
    try{
      if(!navigator.geolocation) return resolve(null);
      const done=v=>resolve(v);
      const t=setTimeout(()=>done(null),8000);
      navigator.geolocation.getCurrentPosition(async pos=>{
        clearTimeout(t);
        const la=pos.coords.latitude,lo=pos.coords.longitude;
        let name='';
        try{
          const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${la}&lon=${lo}`);
          const j=await r.json();
          name=j.display_name?String(j.display_name).split(',').slice(0,2).join(','):'';
        }catch(e){}
        done({lat:la,lon:lo,name:name||`${la.toFixed(5)}, ${lo.toFixed(5)}`});
      },()=>{clearTimeout(t);done(null);},{timeout:9000,maximumAge:0});
    }catch(e){resolve(null);}
  });
}

function ledgerRows(code,from,to){
  const all=buildJournal().filter(e=>e.code===code).sort((a,b)=>a.date.localeCompare(b.date));
  const before=all.filter(e=>e.date<from);
  let bal=round2(sum(before,e=>e.debit-e.credit));
  const rows=all.filter(e=>e.date>=from&&e.date<=to).map(e=>{
    bal=round2(bal+e.debit-e.credit);
    return {...e,balance:bal};
  });
  return {opening:round2(sum(before,e=>e.debit-e.credit)),rows,closing:bal,all};
}

  return `<div class="stack">${body}</div>`;

function renderApprovals(){
  const pe=pendingExpenses(),ps=pendingSales(),pc=pendingCounts(),pl=pendingLeaves();
  const recent=[
    ...vals(DATA.expenses).filter(x=>x.status!=='pending').map(x=>({date:x.approvedAt||x.date,type:'খরচ',title:x.description,amount:x.amount,status:x.status,by:x.approvedBy||''})),
    ...vals(DATA.sales).filter(x=>x.status!=='pending').map(x=>({date:x.decidedAt||x.date,type:'বিক্রয়',title:saleTitle(x),amount:x.variance,status:x.status,by:x.decidedBy||''})),
    ...vals(DATA.counts).filter(x=>x.status!=='pending').map(x=>({date:x.approvedAt||x.date,type:'স্টক',title:countRefName(x),amount:0,status:x.status,by:x.approvedBy||''})),
    ...vals(DATA.leaves).filter(x=>x.status!=='pending').map(x=>({date:x.decidedAt||x.from,type:'ছুটি',title:`${empName(x.employeeId)} — ${x.type||'ছুটি'}`,amount:0,status:x.status,by:x.decidedBy||''}))
  ].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,10);
  return `<div class="stack">
    <div class="grid g4">
      ${statCard('মোট অপেক্ষমাণ',fmtNum(pe.length+ps.length+pc.length+pl.length),'সিদ্ধান্ত প্রয়োজন','check','gold')}
      ${statCard('খরচ অনুমোদন',tk(sum(pe,'amount')),`${fmtNum(pe.length)}টি এন্ট্রি`,'wallet')}
      ${statCard('বিক্রয় ব্যবধান',tk(sum(ps,'variance')),`${fmtNum(ps.length)}টি লেনদেন`,'cart','red')}
      ${statCard('স্টক গরমিল',fmtNum(pc.length),'শারীরিক গণনা','box','blue')}

    ${!canApprove()?`<div class="alert">${icon('warn')}<div><b>আপনি ${esc(ROLE_NAMES[S.role]||S.role)} হিসেবে আছেন।</b> সিদ্ধান্ত নিতে অনুমোদনকারী বা অ্যাডমিন রোলে যান (উপরের রোল বাটন)। ডেমো পিন: ২২২২।</div></div>`:''}
    <div class="card">
      <div class="card-head"><div><h2>${icon('wallet')} খরচ অনুমোদন</h2><p>অনুমোদনের আগে খরচ হিসাবে যাবে না</p></div><span class="badge gold">${fmtNum(pe.length)} অপেক্ষমাণ</span></div>
      ${pe.length?`<div class="table-wrap"><table class="tbl">
        <thead><tr>${th('তারিখ')}${th('খরচ')}${th('লোকেশন')}${th('পরিমাণ','num')}${th('দাখিলকারী')}${th('','num')}</tr></thead>
        <tbody>${pe.map(x=>`<tr><td class="nowrap">${fmtDate(x.date)}</td><td><span class="t-main">${esc(x.description)}</span><span class="t-sub">${esc(expenseCatName(x.category))} ${x.note?'· '+esc(x.note):''}</span></td><td>${esc(locShort(x.locationId))}</td><td class="num b">${tk(x.amount)}</td><td>${esc(x.paidBy||'—')}</td><td class="num">${decisionButton('expense',x.id)}</td></tr>`).join('')}</tbody>
      </table></div>`:emptyState('খরচ অনুমোদন বাকি নেই','check')}
    </div>
    <div class="card">

function renderReports(){
  const from=S.ui.reportFrom||monthStart(),to=S.ui.reportTo||todayISO();
  const loc=S.loc;
  const sales=salesInRange(from,to,loc);
  const expected=sum(sales,'expected'),actual=sum(sales,'actual'),variance=round2(expected-actual),cost=sum(sales,'cost');
  const pnl=incomeStatement(from,to);
  const expenses=vals(DATA.expenses).filter(x=>x.status==='approved'&&x.date>=from&&x.date<=to&&(!loc||x.locationId===loc));
  const outputs=vals(DATA.outputs).filter(o=>o.date>=from&&o.date<=to&&(!loc||o.locationId===loc));
  const daily={};
  for(const s of sales){
    const d=daily[s.date]||(daily[s.date]={count:0,expected:0,actual:0,variance:0,cost:0});
    d.count++;d.expected+=n(s.expected);d.actual+=n(s.actual);d.variance+=n(s.variance);d.cost+=n(s.cost);
  }
  const byProduct={};
  for(const s of sales){
    const key=(s.type||'fg')+':'+(s.productId||s.itemId);
    const p=byProduct[key]||(byProduct[key]={title:saleTitle(s),unit:saleUnit(s),qty:0,expected:0,actual:0,cost:0});
    p.qty+=n(s.qtySold);p.expected+=n(s.expected);p.actual+=n(s.actual);p.cost+=n(s.cost);
  }
  const stockLocations=vals(DATA.locations).filter(l=>!loc||l.id===loc).map(l=>({l,raw:stockValueRaw(l.id),semi:stockValueSemi(l.id),wip:wipValue(l.id),fg:stockValueFG(l.id),retail:retailValueFG(l.id)}));
  const expCats={};
  for(const x of expenses) expCats[x.category]=(expCats[x.category]||0)+n(x.amount);
  const days=Object.keys(daily).sort();
  const chartDays=days.slice(-14);
  const chartMax=Math.max(...chartDays.map(d=>daily[d].actual),1);
  const totalStock=sum(stockLocations,x=>x.raw+x.semi+x.wip+x.fg);
  registerCSV('reportDaily',['তারিখ','বিক্রয় সংখ্যা','প্রত্যাশিত','আদায়','ব্যবধান','ব্যয়','গ্রস মার্জিন'],days.map(d=>[fmtDate(d),daily[d].count,daily[d].expected,daily[d].actual,daily[d].variance,daily[d].cost,round2(daily[d].expected-daily[d].cost)]));
  registerCSV('reportProducts',['পণ্য','একক','পরিমাণ','প্রত্যাশিত','আদায়','ব্যয়','গ্রস মার্জিন'],Object.values(byProduct).map(p=>[p.title,p.unit,p.qty,p.expected,p.actual,p.cost,round2(p.expected-p.cost)]));
  registerCSV('reportStock',['লোকেশন','কাঁচামাল','সেমি','WIP','ফিনিশড ব্যয়','ফিনিশড খুচরা'],stockLocations.map(x=>[x.l.name,x.raw,x.semi,x.wip,x.fg,x.retail]));
  registerCSV('reportExpenses',['খরচের ধরন','পরিমাণ','শতাংশ'],Object.entries(expCats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[expenseCatName(k),v,round2(v/Math.max(1,sum(Object.values(expCats)))*100)]));
  registerCSV('reportProduction',['তারিখ','ব্যাচ','পণ্য','পরিমাণ','কাঁচামাল ব্যয়','রূপান্তর','মোট ব্যয়'],outputs.map(o=>[fmtDate(o.date),o.batch||'',productName(o.productId),o.qty,o.rawCost,o.conversion,round2(n(o.rawCost)+n(o.conversion))]));
  return `<div class="stack">
    <div class="card no-print">
      <div class="filter-bar">
        <div class="field"><label>শুরুর তারিখ</label><input type="date" data-filter="reportFrom" value="${from}"></div>
        <div class="field"><label>শেষ তারিখ</label><input type="date" data-filter="reportTo" value="${to}"></div>
        <div class="field"><label>লোকেশন</label><select data-loc>${locOptions(S.loc)}</select></div>
        <div class="field"><label>দ্রুত সময়</label><div class="chips"><button class="chip" data-act="range" data-target="report" data-days="3">৩ দিন</button><button class="chip" data-act="range" data-target="report" data-days="7">৭ দিন</button><button class="chip" data-act="range" data-target="report" data-days="30">৩০ দিন</button><button class="chip" data-act="range" data-target="report" data-days="month">এই মাস</button><button class="chip" data-act="range" data-target="report" data-days="fiscal">অর্থবছর</button></div></div>
        <div class="grow"></div>
        <button class="btn btn-primary" data-act="print">${icon('print')}<span>প্রিন্ট</span></button>
        <button class="btn" data-act="backup">${icon('download')}<span>ব্যাকআপ</span></button>
      </div>
    </div>
    <div class="print-title"><h2>${esc(DATA.settings.company)}</h2><div class="small">ম্যানেজমেন্ট রিপোর্ট · ${fmtDate(from)} — ${fmtDate(to)}</div></div>
    <div class="grid g4">
      ${statCard('বিক্রয় আয়',tk(expected),`${fmtNum(sales.length)}টি লেনদেন`,'cart')}
      ${statCard('প্রকৃত আদায়',tk(actual),`আদায় ব্যবধান ${tk(variance)}`,'wallet','green','up')}
      ${statCard('গ্রস মুনাফা',tk(pnl.gross),`মার্জিন ${pnl.revenue?pct(pnl.gross/pnl.revenue*100):'—'}`,'chart','gold')}
      ${statCard('নিট মুনাফা',tk(pnl.net),`খরচ ${tk(pnl.expenseTotal)}`,'check',pnl.net>=0?'green':'red')}
    </div>
    <div class="grid g4">
      ${statCard('মোট স্টক মূল্য',tk(totalStock),'কাঁচামাল + সেমি + WIP + ফিনিশড','box','blue')}
      ${statCard('ফিনিশড খুচরা মূল্য',tk(sum(stockLocations,'retail')),'সম্ভাব্য বিক্রয়মূল্য','bag')}
      ${statCard('এই সময়ের উৎপাদন',fmtNum(sum(outputs,'qty')),`${fmtNum(outputs.length)}টি আউটপুট`,'factory','gold')}
      ${statCard('নগদ ব্যালেন্স',tk(cashBalance(to)),'হিসাব অনুযায়ী','wallet',cashBalance(to)<0?'red':'')}
    </div>
    <div class="grid g23">
      <div class="card">
        <div class="card-head"><div><h2>${icon('chart')} দৈনিক বিক্রয় ও আদায়</h2><p>সর্বশেষ ১৪ দিনের প্রবণতা</p></div>${csvBtn('reportDaily')}</div>
        ${chartDays.length?`<div class="bar-chart">
          ${chartDays.map(d=>`<div class="bar-col" title="${fmtDate(d)} — ${tk(daily[d].actual)}"><span class="bar-val">${daily[d].actual?fmtNum(daily[d].actual/1000,0)+'k':''}</span><div class="bar" style="height:${Math.max(3,Math.round(daily[d].actual/chartMax*110))}px"></div><span class="bar-x">${fmtDate(d,true)}</span></div>`).join('')}
        </div>`:emptyState('এই সময়ে বিক্রয় নেই','chart')}
      </div>
      <div class="card">
        <div class="card-head"><div><h2>${icon('warn')} ব্যবস্থাপনা পর্যবেক্ষণ</h2><p>যেসব বিষয়ে নজর দরকার</p></div></div>
        <div class="list">
          <div class="list-item"><div class="avatar ${variance>0?'gold':'green'}">${icon('cart','ic-sm')}</div><div class="list-main"><strong>আদায় ব্যবধান</strong><span>প্রত্যাশিত ${tk(expected)} · আদায় ${tk(actual)}</span></div><div class="list-val ${variance>0?'amount-neg':''}">${tk(variance)}</div></div>
          <div class="list-item"><div class="avatar ${pendingTotalCount()?'gold':'green'}">${icon('check','ic-sm')}</div><div class="list-main"><strong>অনুমোদন বাকি</strong><span>খরচ, বিক্রয় ও স্টক</span></div><div class="list-val">${fmtNum(pendingTotalCount())}টি</div></div>
          <div class="list-item"><div class="avatar ${lowStockItems().length?'red':'green'}">${icon('box','ic-sm')}</div><div class="list-main"><strong>লো-স্টক মাল</strong><span>${lowStockItems().length?lowStockItems().map(x=>esc(x.item.name)).slice(0,3).join(', '):'সব স্টক যথেষ্ট'}</span></div><div class="list-val">${fmtNum(lowStockItems().length)}</div></div>
          <div class="list-item"><div class="avatar ${pnl.net>=0?'green':'red'}">${icon('chart','ic-sm')}</div><div class="list-main"><strong>নিট ফলাফল</strong><span>আয় ${tk(pnl.revenue)} · ব্যয় ${tk(pnl.cogs+pnl.expenseTotal)}</span></div><div class="list-val ${pnl.net<0?'amount-neg':'amount-pos'}">${tk(pnl.net)}</div></div>
        </div>
      </div>
    </div>
    <div class="grid g2">
      <div class="card">
        <div class="card-head"><div><h2>${icon('cart')} পণ্য অনুযায়ী বিক্রয়</h2><p>পরিমাণ, আদায় ও গ্রস মার্জিন</p></div>${csvBtn('reportProducts')}</div>
        ${Object.keys(byProduct).length?`<div class="table-wrap"><table class="tbl compact">
          <thead><tr>${th('পণ্য')}${th('পরিমাণ','num')}${th('আদায়','num')}${th('মার্জিন','num')}</tr></thead>
          <tbody>${Object.values(byProduct).sort((a,b)=>b.actual-a.actual).map(p=>`<tr><td><span class="t-main">${esc(p.title)}</span><span class="t-sub">${fmtNum(p.qty)} ${esc(p.unit)}</span></td><td class="num">${fmtNum(p.qty)}</td><td class="num">${tk(p.actual)}</td><td class="num ${p.expected-p.cost<0?'amount-neg':'amount-pos'}">${tk(p.expected-p.cost)}</td></tr>`).join('')}</tbody>

      </div>

          <thead><tr>${th('খরচের ধরন')}${th('পরিমাণ','num')}${th('শতাংশ','num')}</tr></thead>
          <tbody>${Object.entries(expCats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td class="t-main">${esc(expenseCatName(k))}</td><td class="num">${tk(v)}</td><td class="num">${pct(v/Math.max(1,sum(Object.values(expCats)))*100)}</td></tr>`).join('')}</tbody>
          <tfoot><tr><td>মোট</td><td class="num">${tk(sum(Object.values(expCats)))}</td><td class="num">100%</td></tr></tfoot>
        </table></div>`:emptyState('অনুমোদিত খরচ নেই')}

/* ==================== PART 8 — MODAL ও ফর্ম ==================== */
function fld(label,html,span=''){return `<div class="field ${span}"><label>${esc(label)}</label>${html}</div>`;}
function dateIn(name,value,attrs=''){return `<input type="date" name="${esc(name)}" value="${esc(value||todayISO())}" ${attrs}>`;}
function textIn(name,value='',attrs=''){return `<input name="${esc(name)}" value="${esc(value)}" ${attrs}>`;}
function numIn(name,value='',attrs=''){return `<input type="number" name="${esc(name)}" value="${value===''?'':esc(value)}" step="any" min="0" inputmode="decimal" ${attrs}>`;}
function locPick(types,selected,name='locationId',required=true,id=''){
  const list=vals(DATA.locations).filter(l=>!types||types.includes(l.type)).sort((a,b)=>String(a.name).localeCompare(String(b.name),'bn'));
  let pick=selected||S.loc||'';
  if(!list.some(l=>l.id===pick)) pick=list[0]?.id||'';
  return `<select name="${esc(name)}" ${id?`id="${esc(id)}"`:''} ${required?'required':''}>${optionList(list.map(l=>[l.id,l.name]),pick)}</select>`;
}
function itemPick(kind,selected,name='itemId',locationId='',id=''){
  let list=vals(DATA.items);
  if(kind==='semi') list=list.filter(i=>semiQty(i.id,locationId)>0);
  if(kind==='raw') list=list.filter(i=>rawQty(i.id,locationId)>0);
  if(kind==='raw'&&!list.length) list=vals(DATA.items);
  if(kind==='semi'&&!list.length) list=vals(DATA.items);
  list=[...list].sort((a,b)=>String(a.name).localeCompare(String(b.name),'bn'));
  let pick=selected||'';
  if(!list.some(i=>i.id===pick)) pick=list[0]?.id||'';
  return `<select name="${esc(name)}" ${id?`id="${esc(id)}"`:''} required>${optionList(list.map(i=>[i.id,`${i.name} (${i.unit})`]),pick)}</select>`;
}
function productPick(locationId,selected,name='productId',id=''){
  let list=vals(DATA.products);
  if(locationId) list=list.filter(p=>fgQty(p.id,locationId)>0);
  if(!list.length) list=vals(DATA.products);
  list=[...list].sort((a,b)=>String(a.name).localeCompare(String(b.name),'bn'));
  let pick=selected||'';
  if(!list.some(p=>p.id===pick)) pick=list[0]?.id||'';
  return `<select name="${esc(name)}" ${id?`id="${esc(id)}"`:''} required>${optionList(list.map(p=>[p.id,`${p.name} (${p.unit})`]),pick)}</select>`;
}

function openCountModal({kind='raw',id='',item=''}={}){
  const dispatch=kind==='point'?byId('dispatches',id):null;
  const selKind=['raw','semi','fg','point'].includes(kind)?kind:'raw';
  const loc=dispatch?dispatch.toLocationId:(S.loc||'');
  const ref=dispatch?dispatch.id:(selKind==='fg'?item:item);
  let refField='';
  if(selKind==='raw'||selKind==='semi'){
    const list=[...vals(DATA.items)].sort((a,b)=>String(a.name).localeCompare(String(b.name),'bn'));
    const pick=list.some(i=>i.id===ref)?ref:list[0]?.id||'';
    refField=`<select name="refId" id="count-ref" data-live="count" required>${optionList(list.map(i=>[i.id,`${i.name} (${i.unit})`]),pick)}</select>`;
  }else if(selKind==='fg'){
    refField=productPick('',ref,'refId','count-ref');
  }else{
    const ds=vals(DATA.dispatches).filter(d=>dispatchBalance(d)>0).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    refField=`<select name="refId" id="count-ref" data-live="count" required>${optionList(ds.map(d=>[d.id,`${productName(d.productId)} — ${locShort(d.toLocationId)} · অবশিষ্ট ${fmtNum(dispatchBalance(d))}`]),dispatch?.id||ds[0]?.id||'')}</select>`;
  }
  openModal({title:'স্টক গণনা',sub:'সিস্টেম স্টক বনাম শারীরিক গণনা — পার্থক্য অনুমোদনের পর সমন্বয় হবে',form:'count',wide:true,body:`

      ${fld('ধরন',`<select id="count-kind" name="kind" data-act="count-kind">${optionList([['raw','কাঁচামাল'],['semi','সেমি-ফিনিশড'],['fg','ফিনিশড গুডস'],['point','ডেলিভারি পয়েন্ট']],selKind)}</select>`)}
      ${fld('তারিখ',dateIn('date'))}
      ${fld('লোকেশন',locPick(null,loc,'locationId',true,'count-loc'))}
      ${fld(selKind==='fg'?'পণ্য':selKind==='point'?'ডেলিভারি':'মাল',refField,'span2')}
      ${fld('সিস্টেম স্টক',`<div id="count-system" class="badge blue" style="height:38px;display:flex;align-items:center">—</div>`)}
      ${fld('শারীরিক গণনা',numIn('countedQty','','required'))}

function refreshCountSystem(){
  const out=$('#count-system');
  if(!out) return;
  const kind=$('#count-kind')?.value||'raw';
  const loc=$('#count-loc')?.value||'';
  const ref=$('#count-ref')?.value||'';
  let qty=0,unit='';
  if(kind==='raw'){qty=rawQty(ref,loc);unit=itemUnit(ref);}
  else if(kind==='semi'){qty=semiQty(ref,loc);unit=itemUnit(ref);}
  else if(kind==='fg'){qty=fgQty(ref,loc);unit=productUnit(ref);}
  else{const d=byId('dispatches',ref);qty=dispatchBalance(d);unit=d?productUnit(d.productId):'';}
  out.textContent=`${fmtNum(qty,1)} ${unit}`.trim();
}

function nearestLocation(lat,lng,fallback){
  let best=null;
  for(const l of vals(DATA.locations)){
    if(l.lat==null||l.lng==null) continue;
    const R=6371000,toRad=x=>x*Math.PI/180;
    const dLat=toRad(n(l.lat)-lat),dLng=toRad(n(l.lng)-lng);
    const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat))*Math.cos(toRad(n(l.lat)))*Math.sin(dLng/2)**2;
    const dist=2*R*Math.asin(Math.sqrt(a));
    if(!best||dist<best.dist) best={id:l.id,dist};
  }
  return best&&best.dist<=4000?best.id:fallback;
}

  if(id) return batch([planUpdate(coll,id,patch)]);
  return batch([planAdd(coll,patch)]);
}

async function handleAction(act,el){
  switch(act){
    case 'go': return go(el.dataset.page||'dashboard');
    case 'go-att-today': S.ui.attTab='today'; return go('attendance');
    case 'go-tab': S.ui[el.dataset.kind]=el.dataset.item; return render();
    case 'print': window.print(); return;
    case 'role':
      if(S.mode==='firebase'){toast('Firebase মোডে রোল আপনার প্রোফাইল থেকে নির্ধারিত হয়','info');return;}
      return openRoleModal();
    case 'menu': S.menu=true; return render();
    case 'menu-close': S.menu=false; return render();
    case 'modal-close': return closeModal();
    case 'csv': {
      const c=S.csv[el.dataset.csv];
      if(!c){toast('রিপোর্ট পাওয়া যায়নি','bad');return;}
      downloadFile(`${el.dataset.csv}-${todayISO()}.csv`,toCSV(c.headers,c.rows));
      return;
    }
    case 'tab': S.ui[el.dataset.tab]=el.dataset.value; return render();
    case 'range': {
      const target=el.dataset.target||'sales',days=el.dataset.days||'7';
      const to=todayISO();
      const from=days==='month'?monthStart(to):days==='fiscal'?fiscalStart(to):addDays(to,-(Math.max(1,n(days))-1));
      S.ui[target+'From']=from;S.ui[target+'To']=to;
      return render();
    }
    case 'fiscal-range': {
      const asOf=S.ui.accAsOf||todayISO();
      S.ui.accFrom=fiscalStart(asOf);S.ui.accTo=asOf;
      return render();
    }
    case 'add-raw': return openRawModal();
    case 'add-semi-transfer': return openSemiTransferModal();
    case 'add-semi-sale': return openSemiSaleModal();
    case 'add-sale': return openSaleModal(el.dataset.id||'');
    case 'add-issue': return openIssueModal();
    case 'add-output': return openOutputModal(el.dataset.id||'');
    case 'add-dispatch': return openDispatchModal({type:el.dataset.kind==='outlet'?'outlet':'sales'});
    case 'add-expense': return openExpenseModal();
    case 'add-leave': return openLeaveModal();
    case 'add-asset': return openAssetModal();
    case 'add-count': case 'count':
      return openCountModal({kind:el.dataset.kind||'raw',id:el.dataset.id||'',item:el.dataset.item||''});
    case 'del': {
      const coll=el.dataset.kind,id=el.dataset.id;
      if(!['rawLots','semiLots','assets'].includes(coll)){toast('এই এন্ট্রি মোছার অনুমতি নেই','bad');return;}
      if(!isAdmin()){toast('শুধু অ্যাডমিন মুছে ফেলতে পারেন','bad');return;}
      if(!confirm('এই এন্ট্রি মুছে ফেলবেন? এটি ফিরিয়ে আনা যাবে না।')) return;
      await batch([planRemove(coll,id)]);
      return toast('এন্ট্রি মুছে ফেলা হয়েছে','good');
    }
    case 'decision':
      if(!canApprove()){toast('শুধুমাত্র অনুমোদনকারী বা অ্যাডমিন সিদ্ধান্ত দিতে পারেন','bad');return;}
      return openDecisionModal(el.dataset.kind,el.dataset.id);
    case 'asset-detail': return openAssetDetail(el.dataset.id);
    case 'add-location': return openLocationModal('');
    case 'edit-location': return openLocationModal(el.dataset.id);
    case 'add-item': return openItemModal('');
    case 'edit-item': return openItemModal(el.dataset.id);
    case 'add-product': return openProductModal('');
    case 'edit-product': return openProductModal(el.dataset.id);
    case 'add-employee': return openEmployeeModal('');
    case 'edit-employee': return openEmployeeModal(el.dataset.id);
    case 'face-enroll': return openFaceEnroll(el.dataset.id);

    case 'logout': {
      if(!confirm('লগআউট করবেন?')) return;
      try{await FB.authMod.signOut(FB.auth);}catch(e){}
      return;
    }
    case 'forgot-pw': return openForgotModal();
    case 'bootstrap-admin': {
      if(!S.user||!FB.db){toast('আগে লগইন করুন','bad');return;}
      if(!confirm('এই অ্যাকাউন্টকে প্রথম সিস্টেম অ্যাডমিন হিসেবে চালু করবেন?')) return;
      try{
        await FB.mods.set(FB.mods.ref(FB.db,'users/'+S.user.uid),{email:S.user.email,role:'admin',active:true,name:(S.user.email||'admin').split('@')[0],createdAt:new Date().toISOString()});
        toast('অ্যাডমিন অ্যাকাউন্ট চালু হয়েছে','good');
        await handleAuthState(FB.auth.currentUser);

    case 'edit-user': return openUserModal(el.dataset.id);

    case 'org': return openOrgModal();
    case 'opening': return openOpeningModal();

      return toast('ডেমো ডেটা আপলোড হয়েছে','good');
    case 'seed':
      if(!confirm('ডেমো ডেটা দিয়ে বর্তমান ডেটা প্রতিস্থাপন করবেন?')) return;
      await replaceData(buildSeed());
      return toast('ডেমো ডেটা তৈরি হয়েছে','good');
    case 'reset':
      if(!confirm('সব তথ্য মুছে ফেলবেন? আগে ব্যাকআপ নিন।')) return;
      if(!isAdmin()){toast('শুধু অ্যাডমিন রিসেট করতে পারেন','bad');return;}
      await replaceData(emptyData());
      return toast('সব ডেটা রিসেট হয়েছে','good');
    case 'backup':
      downloadFile(`ips-backup-${todayISO()}.json`,JSON.stringify(DATA,null,2),'application/json');
      return toast('ব্যাকআপ ডাউনলোড হয়েছে','good');
    case 'import': {
      const input=$('#import-file');
      if(input) input.click();
      return;
    }
    case 'copy-rules': return copyText(FIREBASE_RULES);
    case 'copy-rules-simple': return copyText(FIREBASE_RULES_SIMPLE);
    case 'f-rules-guide': return openRulesGuide();
    case 'f-rules-paste': return pasteRulesFromClipboard();
    case 'cam-start':
      try{await startCamera('cam-video');}catch(err){toast(err.message,'bad');}
      return;
    case 'cam-stop': {
      stopCamera();
      const box=$('#cam-video')?.closest('.cam-box');
      box?.querySelector('.cam-empty')?.classList.remove('hide');
      return;
    }
    case 'cam-scan': return startAutoFaceAttendance();
    case 'punch-face':
      if(!S.faceMatch){toast('আগে ফেস স্ক্যান করুন','bad');return;}
      return punchEmployee(S.faceMatch.id,'face',S.lastSnap);
    case 'punch-manual': {
      const empId=$('#manual-emp')?.value;
      const pin=($('#manual-pin')?.value||'').trim();
      const emp=byId('employees',empId);
      if(!emp){toast('কর্মী নির্বাচন করুন','bad');return;}
      if(String(emp.pin||'')!==pin){toast('পিন মেলেনি','bad');return;}
      const field=$('#manual-pin');if(field) field.value='';
      return punchEmployee(empId,'pin');
    }
    case 'enroll-cam':
      try{await startCamera('enroll-video');}catch(err){toast(err.message,'bad');}
      return;
    case 'enroll-capture': {
      if(!S.enrollId){toast('কর্মী পাওয়া যায়নি','bad');return;}
      if(!S.cam) await startCamera('enroll-video');
      const res=await detectFace('enroll-video');
      if(!res) throw new Error('মুখ শনাক্ত হয়নি — আলো ও দূরত্ব ঠিক করুন');
      await batch([planUpdate('employees',S.enrollId,{faceDescriptor:Array.from(res.descriptor),faceAt:new Date().toISOString()})]);
      closeModal();toast('ফেস এনরোল সম্পন্ন','good');
      return;
    }
    case 'geo-start': {
      const empId=$('#geo-emp')?.value;
      const emp=byId('employees',empId);
      if(!emp){toast('কর্মী নির্বাচন করুন','bad');return;}
      if(!navigator.geolocation){toast('এই ব্রাউজারে লোকেশন সুবিধা নেই','bad');return;}
      if(S.watchId){try{navigator.geolocation.clearWatch(S.watchId);}catch(e){}S.watchId=null;}
      S.shareEmp=empId;S.lastGeo=0;
      S.watchId=navigator.geolocation.watchPosition(async pos=>{
        if(Date.now()-(S.lastGeo||0)<20000) return;
        S.lastGeo=Date.now();
        const lat=Math.round(pos.coords.latitude*1e6)/1e6;
        const lng=Math.round(pos.coords.longitude*1e6)/1e6;
        const locationId=nearestLocation(lat,lng,emp.locationId);
        try{
          await batch([{path:`geo/${empId}`,value:{lat,lng,accuracy:Math.round(pos.coords.accuracy||0),ts:Date.now(),at:new Date().toISOString(),locationId}}]);
        }catch(e){}
      },err=>{
        S.watchId=null;
        toast('লোকেশন পাওয়া যায়নি: '+err.message,'bad');
        render();
      },{enableHighAccuracy:true,timeout:25000,maximumAge:15000});
      render();toast('লোকেশন শেয়ার চালু হয়েছে','good');
      return;
    }
    case 'geo-stop':
      if(S.watchId){try{navigator.geolocation.clearWatch(S.watchId);}catch(e){}S.watchId=null;}
      render();toast('লোকেশন শেয়ার বন্ধ হয়েছে','info');
      return;
    case 'exp-all': S.ui.expMonth=''; return render();
    default: console.warn('অজানা অ্যাকশন:',act);
  }
}

document.addEventListener('click',async e=>{
  const nav=e.target.closest('[data-nav]');
  if(nav){e.preventDefault();go(nav.dataset.nav);return;}
  const el=e.target.closest('[data-act]');
  if(!el) return;
  try{await handleAction(el.dataset.act,el);}
  catch(err){console.error(err);toast(err?.message||'কাজটি সম্পন্ন হয়নি','bad');}
});

async function handleImport(input){
  const file=input.files?.[0];
  if(!file) return;
  if(!isAdmin()){toast('শুধু অ্যাডমিন ব্যাকআপ রিস্টোর করতে পারেন','bad');input.value='';return;}
  try{
    const text=await file.text();
    const raw=JSON.parse(text);
    if(!raw||typeof raw!=='object') throw new Error('ফাইলটি বৈধ ব্যাকআপ নয়');
    if(!confirm('রিস্টোর করলে বর্তমান ডেটা প্রতিস্থাপিত হবে। চালিয়ে যাবেন?')){input.value='';return;}
    await replaceData(normalizeData(raw));
    toast('ব্যাকআপ রিস্টোর হয়েছে','good');
  }catch(err){
    toast('রিস্টোর ব্যর্থ: '+err.message,'bad');
  }
  input.value='';
}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='theme-choice'){saveTheme(t.value);toast((THEME_NAMES[normalizeTheme(t.value)]||'')+' থিম চালু হয়েছে','good');return;}
  if(t.id==='import-file'){handleImport(t);return;}
  const locEl=t.closest('[data-loc]');
  if(locEl){S.loc=locEl.value;savePref();render();return;}
  const ck=t.closest('[data-act="count-kind"]');
  if(ck){openCountModal({kind:ck.value});return;}
  if(t.dataset.live==='count'||t.id==='count-ref'||t.id==='count-loc'){refreshCountSystem();return;}
  const filter=t.closest('[data-filter]');
  if(filter){S.ui[filter.dataset.filter]=filter.value;render();return;}
});

document.addEventListener('submit',async e=>{
  const form=e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const name=form.dataset.form;
  const fd=new FormData(form);
  const g=k=>String(fd.get(k)??'').trim();
  const val=k=>n(fd.get(k));
  try{
    if(name==='login'){
      const lb=form.querySelector('.f-login-btn');
      if(lb){lb.classList.add('loading');const sp=lb.querySelector('span');if(sp) sp.textContent='লগইন হচ্ছে…';}
      if(!FB.auth||!FB.authMod) throw new Error('Firebase সংযুক্ত নয়');
      const email=g('email').toLowerCase(),pw=String(fd.get('password')||'');
      if(!email||!pw) throw new Error('ইমেইল ও পাসওয়ার্ড দিন');
      try{await FB.authMod.signInWithEmailAndPassword(FB.auth,email,pw);}
      catch(err){throw new Error(authErrorText(err));}
      toast('লগইন সফল হয়েছে','good');
    }
    else if(name==='forgot'){
      if(!FB.auth||!FB.authMod) throw new Error('Firebase সংযুক্ত নয়');
      const email=g('email').toLowerCase();
      if(!email) throw new Error('ইমেইল দিন');
      try{await FB.authMod.sendPasswordResetEmail(FB.auth,email);}
      catch(err){throw new Error(authErrorText(err));}
      closeModal();toast('পাসওয়ার্ড রিসেট লিংক ইমেইলে পাঠানো হয়েছে','good');
    }
    else if(name==='user'){
      if(S.mode!=='firebase'||!S.userProfile||S.userProfile.role!=='admin') throw new Error('শুধু অ্যাডমিন ব্যবহারকারী পরিচালনা করতে পারেন');
      const uid=g('uid'),email=g('email').toLowerCase(),pw=String(fd.get('password')||'');
      if(!email) throw new Error('ইমেইল দিন');
      const role=g('role')||'operator',active=g('active')!=='false';
      if(!ROLE_NAMES[role]) throw new Error('সঠিক রোল নির্বাচন করুন');
      if(uid){
        const existing=(S.users||{})[uid]||{};
        if(uid===S.user?.uid&&(role!=='admin'||!active)) throw new Error('নিজের অ্যাডমিন/সক্রিয় অনুমতি বন্ধ করা যাবে না');
        const patch={...existing,uid,email:existing.email||email,name:g('name')||existing.name||'',role,active};
        try{await FB.mods.update(FB.mods.ref(FB.db,'users/'+uid),patch);}
        catch(err){throw new Error(authErrorText(err));}
        if(S.users) S.users[uid]=patch;
        closeModal();
        if(uid===S.user?.uid) await handleAuthState(FB.auth.currentUser);
        else await loadUsers(true);
        toast('ব্যবহারকারীর অনুমতি সংরক্ষিত হয়েছে','good');
      }else{
        if(pw.length<6) throw new Error('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন');
        const newUid=await provisionAuthUser(email,pw);
        const prof={email,role,active:true,name:g('name')||'',createdAt:new Date().toISOString(),createdBy:S.user.email||S.user.uid};
        try{await FB.mods.set(FB.mods.ref(FB.db,'users/'+newUid),prof);}
        catch(err){throw new Error('Auth অ্যাকাউন্ট তৈরি হয়েছে, কিন্তু প্রোফাইল লেখা যায়নি: '+authErrorText(err));}
        if(S.users) S.users[newUid]={...prof,uid:newUid};
        closeModal();toast('ব্যবহারকারী তৈরি হয়েছে — '+email,'good');
        await loadUsers(true);
      }
    }
    else if(name==='raw'){
      const itemId=g('itemId'),loc=g('locationId'),qty=val('qty');
      if(!itemId||!loc||qty<=0) throw new Error('মাল, লোকেশন ও সঠিক পরিমাণ দিন');
      const lot=planAddLot('raw',{itemId,qty,remaining:qty,rate:val('rate'),transport:val('transport'),loading:val('loading'),locationId:loc,date:g('date')||todayISO(),supplier:g('supplier'),note:g('note')});
      await batch([lot]);
      closeModal();toast('মাল ক্রয় সংরক্ষিত — '+itemName(itemId),'good');
    }
    else if(name==='semiTransfer'){
      const itemId=g('itemId'),loc=g('locationId'),qty=val('qty');
      if(qty<=0) throw new Error('সঠিক পরিমাণ দিন');
      const con=planConsume('raw',itemId,loc,qty);
      if(con.short>0.0001) throw new Error(`স্টকে যথেষ্ট নেই — আছে ${fmtNum(rawQty(itemId,loc),1)} ${itemUnit(itemId)}`);
      const unitCost=round2(con.cost/Math.max(qty,0.0001));
      const lot=planAddLot('semi',{itemId,qty,remaining:qty,unitCost,locationId:loc,date:g('date')||todayISO(),note:g('note')||'সেমি-ফিনিশডে স্থানান্তর'});
      await batch([...con.updates,lot]);
      closeModal();toast('সেমি-ফিনিশড স্টকে স্থানান্তর হয়েছে','good');
    }
    else if(name==='semiSale'){
      const itemId=g('itemId'),loc=g('locationId'),qty=val('qtySold');
      if(qty<=0) throw new Error('সঠিক পরিমাণ দিন');
      const price=val('unitPrice')||n(byId('items',itemId)?.semiPrice);
      if(price<=0) throw new Error('বিক্রয় দর দিন');
      const con=planConsume('semi',itemId,loc,qty);
      if(con.short>0.0001) throw new Error(`সেমি স্টকে যথেষ্ট নেই — আছে ${fmtNum(semiQty(itemId,loc),1)} ${itemUnit(itemId)}`);
      const expected=round2(qty*price);
      const actual=fd.get('actual')===''?expected:val('actual');
      const variance=round2(expected-actual);
      const rec=planAdd('sales',{type:'semi',date:g('date')||todayISO(),itemId,qtySold:qty,qtyReturned:0,unitPrice:price,expected,actual,variance,cost:con.cost,locationId:loc,repId:g('repId'),note:g('note'),status:variance?'pending':'approved'});
      await batch([...con.updates,rec]);
      closeModal();
      toast(variance?'সেমি বিক্রয় সংরক্ষিত — ব্যবধান অনুমোদনের অপেক্ষায়':'সেমি বিক্রয় সম্পন্ন','good');
    }
    else if(name==='dispatch'){
      const type=g('type')==='outlet'?'outlet':'sales';
      const productId=g('productId'),from=g('locationId'),to=g('toLocationId'),qty=val('qty');
      if(!productId||!from||!to) throw new Error('পণ্য, উৎস ও গন্তব্য নির্বাচন করুন');
      if(from===to) throw new Error('উৎস ও গন্তব্য একই হতে পারে না');
      if(qty<=0) throw new Error('সঠিক পরিমাণ দিন');
      const con=planConsume('fg',productId,from,qty);
      if(con.short>0.0001) throw new Error(`উৎস স্টোরে যথেষ্ট পণ্য নেই — আছে ${fmtNum(fgQty(productId,from),1)} ${productUnit(productId)}`);
      const unitCost=round2(con.cost/Math.max(qty,0.0001));
      const dp=planAdd('dispatches',{date:g('date')||todayISO(),productId,qty,unitCost,cost:con.cost,price:n(byId('products',productId)?.price),fromLocationId:from,toLocationId:to,type,note:g('note')});
      const lot=planAddLot('fg',{productId,qty,remaining:qty,unitCost,locationId:to,date:g('date')||todayISO(),note:g('note')||'ডেলিভারি স্টক'});
      await batch([...con.updates,dp,lot]);
      closeModal();toast(type==='outlet'?'আউটলেটে পাঠানো হয়েছে':'ডেলিভারি পাঠানো হয়েছে','good');
    }
    else if(name==='sale'){
      const d=byId('dispatches',g('dispatchId'));
      if(!d) throw new Error('ডেলিভারি নির্বাচন করুন');
      const bal=dispatchBalance(d);
      const qty=val('qtySold'),returned=val('qtyReturned');
      if(qty<=0) throw new Error('সঠিক বিক্রীত পরিমাণ দিন');
      if(qty+returned>bal+0.001) throw new Error(`ডেলিভারি ব্যালেন্স ${fmtNum(bal)} — এর বেশি বিক্রয় সম্ভব নয়`);
      const price=val('unitPrice')||n(byId('products',d.productId)?.price);
      if(price<=0) throw new Error('বিক্রয় দর দিন');
      const expected=round2(qty*price);
      const actual=fd.get('actual')===''?expected:val('actual');
      const variance=round2(expected-actual);
      const con=planConsume('fg',d.productId,d.toLocationId,qty);
      let cost=con.cost;
      if(con.short>0.0001) cost=round2(cost+con.short*n(d.unitCost));
      const rec=planAdd('sales',{type:'fg',date:g('date')||todayISO(),dispatchId:d.id,productId:d.productId,qtySold:qty,qtyReturned:returned,unitPrice:price,expected,actual,variance,cost,locationId:d.toLocationId,repId:g('repId'),note:g('note'),status:variance?'pending':'approved'});
      await batch([...con.updates,rec]);
      closeModal();
      toast(variance?'বিক্রয় সংরক্ষিত — আদায় ব্যবধান অনুমোদনের অপেক্ষায়':'বিক্রয় সম্পন্ন','good');
    }
    else if(name==='issue'){
      const itemId=g('itemId'),loc=g('locationId'),qty=val('qty');
      if(qty<=0) throw new Error('সঠিক পরিমাণ দিন');
      const con=planConsume('raw',itemId,loc,qty);
      if(con.short>0.0001) throw new Error(`স্টকে যথেষ্ট নেই — আছে ${fmtNum(rawQty(itemId,loc),1)} ${itemUnit(itemId)}`);
      const rec=planAdd('issues',{date:g('date')||todayISO(),itemId,qty,locationId:loc,cost:con.cost,status:'open',note:g('note')});
      await batch([...con.updates,rec]);
      closeModal();toast('প্রোডাকশনে ইস্যু হয়েছে','good');
    }
    else if(name==='output'){
      const issue=byId('issues',g('issueId'));
      if(!issue) throw new Error('চলমান ব্যাচ নির্বাচন করুন');
      if(issue.status==='done') throw new Error('এই ব্যাচ ইতিমধ্যে সম্পন্ন');
      const productId=g('productId'),qty=val('qty'),conv=val('conversion');
      if(!productId||qty<=0) throw new Error('পণ্য ও সঠিক পরিমাণ দিন');
      const loc=g('locationId');
      const unitCost=round2((n(issue.cost)+conv)/qty);
      const out=planAdd('outputs',{date:g('date')||todayISO(),issueId:issue.id,itemId:issue.itemId,productId,qty,conversion:conv,rawCost:n(issue.cost),unitCost,locationId:loc,batch:g('batch'),note:g('note')});
      const lot=planAddLot('fg',{productId,qty,remaining:qty,unitCost,locationId:loc,date:g('date')||todayISO(),note:g('batch')||'উৎপাদন আউটপুট'});
      const upd=planUpdate('issues',issue.id,{status:'done',outputId:out.id});
      await batch([out,lot,upd]);
      closeModal();toast('উৎপাদন আউটপুট সংরক্ষিত — '+productName(productId),'good');
    }
    else if(name==='count'){
      const kind=g('kind'),loc=g('locationId'),ref=g('refId'),counted=val('countedQty');
      if(!ref) throw new Error('আইটেম নির্বাচন করুন');
      let systemQty=0,itemId='',productId='';
      if(kind==='raw'){systemQty=rawQty(ref,loc);itemId=ref;}
      else if(kind==='semi'){systemQty=semiQty(ref,loc);itemId=ref;}
      else if(kind==='fg'){systemQty=fgQty(ref,loc);productId=ref;}
      else{
        const d=byId('dispatches',ref);
        if(!d) throw new Error('ডেলিভারি নির্বাচন করুন');
        systemQty=dispatchBalance(d);productId=d.productId;
      }
      const diff=round2(counted-systemQty);
      const rec=planAdd('counts',{date:g('date')||todayISO(),kind,refId:ref,itemId,productId,locationId:kind==='point'?byId('dispatches',ref)?.toLocationId:loc,systemQty,countedQty:counted,diff,status:'pending',note:g('note'),createdBy:ROLE_NAMES[S.role]||S.role});
      await batch([rec]);
      closeModal();toast(diff?'গণনা সংরক্ষিত — গরমিল অনুমোদনের অপেক্ষায়':'গণনা সংরক্ষিত — কোনো গরমিল নেই','good');
    }
    else if(name==='leave'){
      const emp=byId('employees',g('employeeId'));
      if(!emp) throw new Error('কর্মী নির্বাচন করুন');
      const from=g('from'),to=g('to');
      if(!from||!to||to<from) throw new Error('সঠিক তারিখ দিন');
      if(!g('reason')) throw new Error('ছুটির কারণ লিখুন');
      const rec=planAdd('leaves',{employeeId:emp.id,locationId:emp.locationId,from,to,days:leaveDays({from,to}),type:g('type'),reason:g('reason'),status:'pending',createdBy:ROLE_NAMES[S.role]||S.role});
      await batch([rec]);
      closeModal();toast('ছুটির আবেদন জমা হয়েছে — অনুমোদনের অপেক্ষায়','good');
    }
    else if(name==='expense'){
      if(!g('description')||val('amount')<=0) throw new Error('বিবরণ ও সঠিক পরিমাণ দিন');
      const rec=planAdd('expenses',{date:g('date')||todayISO(),category:g('category'),description:g('description'),amount:val('amount'),paidBy:g('paidBy'),locationId:g('locationId'),status:'pending',note:g('note')});
      await batch([rec]);
      closeModal();toast('খরচ জমা হয়েছে — অনুমোদনের অপেক্ষায়','good');
    }
    else if(name==='asset'){
      if(!g('name')||val('cost')<=0) throw new Error('সম্পদের নাম ও ক্রয় মূল্য দিন');
      const rec=planAdd('assets',{name:g('name'),category:g('category'),locationId:g('locationId'),purchaseDate:g('purchaseDate')||todayISO(),cost:val('cost'),salvage:val('salvage'),lifeYears:Math.max(1,val('lifeYears')||5),method:g('method')==='declining'?'declining':'slm',rate:val('rate'),note:g('note')});
      await batch([rec]);
      closeModal();toast('সম্পদ যোগ হয়েছে','good');
    }
    else if(name==='location'){
      const id=g('id');
      const patch={name:g('name'),short:g('short'),type:g('type'),address:g('address')};
      if(g('lat')!=='') patch.lat=val('lat');
      if(g('lng')!=='') patch.lng=val('lng');
      if(!patch.name) throw new Error('লোকেশনের নাম দিন');
      await saveEntity('locations',id,patch);
      closeModal();toast('লোকেশন সংরক্ষিত হয়েছে','good');
    }
    else if(name==='item'){
      const id=g('id');
      const patch={name:g('name'),unit:g('unit')||'রিম',semiPrice:val('semiPrice'),minQty:val('minQty')};
      if(!patch.name) throw new Error('মালের নাম দিন');
      await saveEntity('items',id,patch);
      closeModal();toast('কাঁচামাল সংরক্ষিত হয়েছে','good');
    }
    else if(name==='product'){
      const id=g('id');
      const patch={name:g('name'),category:g('category'),unit:g('unit')||'পিস',price:val('price'),minQty:val('minQty')};
      if(!patch.name||patch.price<=0) throw new Error('পণ্যের নাম ও বিক্রয় মূল্য দিন');
      await saveEntity('products',id,patch);
      closeModal();toast('পণ্য সংরক্ষিত হয়েছে','good');
    }
    else if(name==='employee'){
      const id=g('id');
      const patch={name:g('name'),role:g('role'),phone:g('phone'),locationId:g('locationId'),active:g('active')==='true'};
      if(!patch.name) throw new Error('কর্মীর নাম দিন');
      let pin=g('pin');
      if(!pin) pin=id?byId('employees',id)?.pin||'':String(1000+Math.floor(Math.random()*9000));
      patch.pin=pin;
      await saveEntity('employees',id,patch);
      closeModal();toast(id?'কর্মী তথ্য সংরক্ষিত':'নতুন কর্মী যোগ হয়েছে — এখন ফেস এনরোল করুন','good');
    }
    else if(name==='org'){
      await batch([
        {path:'settings/company',value:g('company')},
        {path:'settings/address',value:g('address')},
        {path:'settings/workStart',value:g('workStart')||'09:30'},
        {path:'settings/lateAfter',value:g('lateAfter')||'09:30'},
        {path:'settings/fiscalStart',value:g('fiscalStart')||'07-01'},
        {path:'settings/varianceLimit',value:val('varianceLimit')}
      ]);
      closeModal();toast('প্রতিষ্ঠানের সেটিংস সংরক্ষিত','good');
    }
    else if(name==='opening'){
      await batch([
        {path:'settings/openingDate',value:g('openingDate')||'2000-01-01'},
        {path:'settings/opening/cash',value:val('cash')},
        {path:'settings/opening/bank',value:val('bank')},
        {path:'settings/opening/inventory',value:val('inventory')},
        {path:'settings/opening/fixedAssets',value:val('fixedAssets')},
        {path:'settings/opening/liabilities',value:val('liabilities')},
        {path:'settings/opening/capital',value:val('capital')}
      ]);
      closeModal();toast('প্রারম্ভিক ব্যালেন্স সংরক্ষিত','good');
    }
    else if(name==='decision'){
      if(!canApprove()) throw new Error('শুধুমাত্র অনুমোদনকারী বা অ্যাডমিন সিদ্ধান্ত দিতে পারেন');
      const kind=g('kind'),id=g('id'),action=g('action'),comment=g('comment');
      const by=ROLE_NAMES[S.role]||S.role;
      const at=new Date().toISOString();
      const approve=action==='approve';
      if(!approve&&!comment) throw new Error('বাতিলের কারণ লিখুন');
      if(kind==='expense'){
        if(!byId('expenses',id)) throw new Error('খরচ পাওয়া যায়নি');
        await batch([planUpdate('expenses',id,{status:approve?'approved':'rejected',approvedBy:by,approvedAt:at,decisionNote:comment})]);
      }else if(kind==='sale'){
        const s=byId('sales',id);
        if(!s) throw new Error('বিক্রয় পাওয়া যায়নি');
        const updates=[planUpdate('sales',id,{status:approve?'approved':'rejected',decidedBy:by,decidedAt:at,decisionNote:comment})];
        if(!approve&&n(s.qtySold)>0){
          const unit=round2(n(s.cost)/Math.max(1,n(s.qtySold)));
          const qty=n(s.qtySold);
          updates.push(s.type==='semi'
            ? planAddLot('semi',{itemId:s.itemId,qty,remaining:qty,unitCost:unit,locationId:s.locationId,date:todayISO(),note:'বিক্রয় বাতিল — স্টক ফেরত'})
            : planAddLot('fg',{productId:s.productId,qty,remaining:qty,unitCost:unit,locationId:s.locationId,date:todayISO(),note:'বিক্রয় বাতিল — স্টক ফেরত'}));
        }
        await batch(updates);
      }else if(kind==='leave'){
        if(!byId('leaves',id)) throw new Error('ছুটির আবেদন পাওয়া যায়নি');
        await batch([planUpdate('leaves',id,{status:approve?'approved':'rejected',decidedBy:by,decidedAt:at,decisionNote:comment})]);
      }else if(kind==='count'){
        const c=byId('counts',id);
        if(!c) throw new Error('গণনা পাওয়া যায়নি');
        const unit=countUnitCost(c);
        const diff=round2(n(c.countedQty)-n(c.systemQty));
        const updates=[planUpdate('counts',id,{status:approve?'approved':'rejected',approvedBy:by,approvedAt:at,adjustQty:approve?diff:0,unitCost:unit,decisionNote:comment})];
        if(approve&&diff!==0){
          const ck=c.kind==='point'?'fg':c.kind;
          const key=ck==='fg'?(c.productId||c.refId):(c.itemId||c.refId);
          if(diff>0){
            updates.push(planAddLot(ck,{...(ck==='fg'?{productId:key}:{itemId:key}),qty:diff,remaining:diff,unitCost:unit,locationId:c.locationId,date:todayISO(),note:'স্টক গণনা সমন্বয়'}));
          }else{
            const con=planConsume(ck,key,c.locationId,Math.abs(diff));
            updates.push(...con.updates);
          }
        }
        await batch(updates);
      }else throw new Error('সিদ্ধান্তের ধরন অজানা');
      closeModal();toast(approve?'অনুমোদিত হয়েছে':'বাতিল হয়েছে',approve?'good':'bad');
    }
    else if(name==='role'){
      const role=g('role'),pin=g('pin');
      if(role==='admin'||role==='authority'){
        const expected=DATA.settings.pins?.[role];
        if(expected&&pin!==expected) throw new Error('পিন মেলেনি');
      }
      S.role=role;savePref();closeModal();render();
      toast('রোল পরিবর্তিত: '+(ROLE_NAMES[role]||role),'good');
    }
    else if(name==='firebase'){
      const cfg={};
      for(const k of ['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId']){
        const v=g(k);if(v) cfg[k]=v;
      }
      if(!cfg.databaseURL) throw new Error('Database URL আবশ্যক');
      closeModal();toast('Firebase-এ সংযোগ হচ্ছে…','info');
      try{await connectFirebase(cfg);}
      catch(err){S.mode='firebase';S.conn='auth-error';S.authError='সংযোগ ব্যর্থ: '+err.message;toast('সংযোগ ব্যর্থ: '+err.message,'bad');render();}
    }
    else{
      console.warn('অজানা ফর্ম:',name);
    }
  }catch(err){
    console.error(err);
    toast(err?.message||'সংরক্ষণ করা যায়নি','bad');
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal-root')?.innerHTML) closeModal();
});

window.addEventListener('hashchange',()=>{
  const p=location.hash.slice(1);
  if(PAGE_TITLES[p]&&p!==S.page){S.page=p;S.menu=false;render();}
});

function boot(){
  loadPref();
  S.lastGeo=0;
  const cfg=loadConfig();
  if(cfg){
    connectFirebase(cfg).catch(err=>{
      console.error(err);
      S.mode='firebase';S.conn='auth-error';
      S.authError='Firebase সংযোগ ব্যর্থ: '+err.message;
      DATA=loadDemo();render();
      toast('Firebase সংযোগ ব্যর্থ — কনফিগ বা ইন্টারনেট যাচাই করুন','bad');
    });
  }else{
    DATA=loadDemo();S.mode='demo';S.conn='demo';
  }
  const h=location.hash.slice(1);
  if(PAGE_TITLES[h]) S.page=h;
  applyTheme(getTheme());
render();
}

boot();

/* ================= ফিচার প্যাক (নতুন যোগ) ================= */
/* ============================================================
   EKhisaB ফিচার প্যাক — নতুন যোগ করা অপশনসমূহ
   (সেটিংস টগল, খরচ ক্যাটাগরি, একক ব্যবস্থাপনা, অর্ডার, MFS,
    নতুন পণ্য ফর্ম, ইনভয়েস কাস্টমাইজেশন)

/* ---------- নতুন ক্যাটাগরি গ্রুপ ---------- */
const F_CAT_SEED = {
  expense:[['কর্মচারীর খরচ','users'],['কর্মচারীর বেতন','users'],['দৈনিক খরচ','clock'],['দোকান ভাড়া','asset'],['Uttility বিল','check']],
  item:[['কাগজ','box'],['ইঙ্ক','wallet'],['বাইন্ডিং','toggle'],['অন্যান্য','box']],
  product:[['খাতা','bag'],['ডায়েরি','book'],['ক্যালেন্ডার','chart'],['কপি','bag']],
  income:[['নগদ বিক্রয়','cart'],['বাকি আদায়','wallet'],['অন্যান্য আয়','plus']],
  customer:[['খুচরা','user'],['পাইকারি','users'],['ডিলার','truck']],

};
const F_CAT_GROUPS = {
  expense:'খরচের ক্যাটাগরি', item:'কাঁচামালের শ্রেণি', product:'পণ্যের ক্যাটাগরি',
  income:'আয়ের ধরন', customer:'কাস্টমার গ্রুপ', supplier:'সাপ্লায়ার গ্রুপ'
};
/* ---------- ৫টি ফিক্সড খরচের ক্যাটাগরি (মুছা যায় না) ---------- */
const F_EXP_FIXED_CATS = ['কর্মচারীর খরচ','কর্মচারীর বেতন','দৈনিক খরচ','দোকান ভাড়া','Uttility বিল'];
function fIsFixedCat(name){return F_EXP_FIXED_CATS.includes(String(name||''));}
function fFixedCatIndex(name){return F_EXP_FIXED_CATS.indexOf(String(name||''));}
/* টাইলের আইকন সেট (প্রতিটি ক্যাটাগরির নিজস্ব) */
const F_CAT_ICON = {'কর্মচারীর খরচ':'users','কর্মচারীর বেতন':'wallet','দৈনিক খরচ':'clock','দোকান ভাড়া':'asset','Uttility বিল':'check'};
/* ক্যাটাগরি → হিসাব কোড (খরচের রিপোর্টে ব্যবহার) */
const F_CAT_CODE = {'কর্মচারীর খরচ':'6160','কর্মচারীর বেতন':'6120','দৈনিক খরচ':'6180','দোকান ভাড়া':'6110','Uttility বিল':'6130'};
function fCatCode(name){return F_CAT_CODE[name]||'6180';}
/* ফিক্সড ক্যাটাগরি সবসময় আগে ও নির্দিষ্ট ক্রমে, তারপর কাস্টম ক্যাটাগরি */
function fSortCats(list){
  return list.slice().sort((a,b)=>{
    const ia=fFixedCatIndex(a.name),ib=fFixedCatIndex(b.name);
    if(ia>=0&&ib>=0) return ia-ib;
    if(ia>=0) return -1;
    if(ib>=0) return 1;
    return String(a.name).localeCompare(String(b.name),'bn');
  });
}

/* ---------- হেল্পার ---------- */
function fSetGet(path,def){
  let cur=DATA.settings&&DATA.settings.set;
  for(const k of String(path).split('/')){
    if(!cur||typeof cur!=='object') return def;
    cur=cur[k];
  }
  return cur===undefined||cur===null?'':cur;
}
function fBool(path,def=false){
  const v=fSetGet(path,null);
  if(v===null||v==='') return def;
  return v===true||v==='1'||v===1||v==='true';
}
function fNum(path,def=0){const v=fSetGet(path,'');return v===''?def:n(v);}
async function fSetSave(path,value){
  setPath(DATA,'settings/set/'+path,value);
  if(S.mode==='firebase'&&FB.db){
    const parts=String(path).split('/');const obj={};let cur=obj;
    for(let i=0;i<parts.length-1;i++){cur[parts[i]]=cur[parts[i]]||{};cur=cur[parts[i]];}
    cur[parts[parts.length-1]]=value;
    try{await FB.mods.update(FB.mods.ref(FB.db,'ips/settings/set'),obj);toast('সংরক্ষিত হয়েছে','good');}
    catch(e){toast('সংরক্ষণ ব্যর্থ: '+(e?.message||''),'bad');}
  }else{
    try{localStorage.setItem(LS_DEMO,JSON.stringify(DATA));}catch(e){}
    toast('সংরক্ষিত হয়েছে','good');
  }
}
function fCats(group){
  const all=(DATA.settings?.cats||{})[group]||{};
  return Object.entries(all).map(([id,v])=>typeof v==='string'?{id,name:v,icon:'box'}:{id,...v})
    .sort((a,b)=>String(a.name).localeCompare(String(b.name),'bn'));
}
function fUnits(kind){
  const all=(DATA.settings?.units||{})[kind]||{};
  const list=Object.entries(all).map(([id,v])=>typeof v==='string'?{id,label:v}:{id,...v}).filter(x=>x&&x.id);
  return list.length?list:null;
}
function fUnitList(kind){
  const saved=fUnits(kind);
  const def=F_UNIT_DEFAULT[kind]||[];
  return saved?saved:def.map(([id,label])=>({id,label}));
}
function fToggle(path,label,hint,def){
  const on=fBool(path,def);
  return `<label class="tgl ${on?'on':''}"><span class="tgl-txt"><b>${esc(label)}</b><span>${esc(hint||'')}</span></span>`
    +`<input type="checkbox" data-fset="${esc(path)}" ${on?'checked':''}><i></i></label>`;
}
function fTile(label,sub,ic,tone,act,id,delAct){
  return `<button type="button" class="hub-card" data-act="${esc(act)}" data-id="${esc(id||'')}">
    <span class="hub-ic ${esc(tone||'')}">${icon(ic||'box')}</span>
    <span class="hub-txt"><b>${esc(label)}</b>${sub?`<span>${esc(sub)}</span>`:''}</span>
  </button>${delAct?`<span></span>`:''}`;
}

/* ---------- সেটিংস স্ক্রিন ---------- */
function openSettingsScreen(key){
  const cfg=F_TOGGLE_SCREENS[key];
  if(!cfg){toast('সেটিংস স্ক্রিন পাওয়া যায়নি','bad');return;}
  if(key==='expense'){
    const month=todayISO().slice(0,7);
    const _ac=fSortCats(fCats('expense'));
    const _miss=F_EXP_FIXED_CATS.filter(nm=>!_ac.some(c=>c.name===nm));
    const cats=_miss.length?fSortCats(_ac.concat(_miss.map(nm=>({id:'',name:nm,icon:F_CAT_ICON[nm]||'wallet',fixed:true})))):_ac;
    const counts={};
    for(const x of vals(DATA.expenses)) if(monthKey(x.date)===month){const k=x.catName||'অন্যান্য';counts[k]=(counts[k]||0)+1;}
    const body=`<div class="sec"><div class="sec-head amber">${icon('wallet')}<div><b>খরচের এন্ট্রি</b><span>ক্যাটাগরি বেছে নিয়ে সরাসরি খরচ যোগ করুন</span></div></div>
      <div class="sec-body">
        <div class="cat-grid">
          ${cats.map(c=>`<button type="button" class="cat-tile ${fIsFixedCat(c.name)?'cat-fixed':''}" data-act="f-new-expense" data-item="${esc(c.name)}">
            <span class="cat-ic">${icon(fIsFixedCat(c.name)?(F_CAT_ICON[c.name]||'wallet'):(c.icon||'wallet'))}</span>
            <b>${esc(c.name)}</b><small>${fmtNum(counts[c.name]||0)} এন্ট্রি এই মাসে</small>
            ${fIsFixedCat(c.name)?`<span class="cat-lock" title="ফিক্সড ক্যাটাগরি — মুছা যাবে না">${icon('check','ic-sm')}</span>`
              :`<span class="cat-x" role="button" data-act="f-cat-del" data-item="expense" data-id="${esc(c.id)}" title="মুছুন">×</span>`}
          </button>`).join('')}
          <button type="button" class="cat-tile" data-act="f-cat-add" data-item="expense">
            <span class="cat-ic">${icon('plus')}</span><b>নতুন ক্যাটাগরি</b><small>যোগ করুন</small>
          </button>
        </div>
      </div></div>
      <div class="sec"><div class="sec-head green">${icon('check')}<div><b>খরচের নিয়ম</b><span>এন্ট্রি ও অনুমোদন</span></div></div>
      <div class="sec-body">${cfg.groups[1].items.map(t=>fToggle(t[0],t[1],t[2],t[3])).join('')}</div></div>`;
    openModal({title:'খরচ',sub:'ক্যাটাগরি অনুযায়ী গ্রুপ করা',body,wide:true,submit:'বন্ধ করুন'});
    return;
  }
  if(key==='stock'){
    const body=`<div class="sec"><div class="sec-head green">${icon('box')}<div><b>একক ব্যবস্থাপনা</b><span>ক্যাটাগরি অনুযায়ী গ্রুপ করা — ওজন, সংখ্যা, আয়তন ও দৈর্ঘ্য</span></div></div>
      <div class="sec-body"><button type="button" class="btn btn-primary" data-act="f-units">${icon('toggle')}<span>একক দেখুন</span></button>
      <div class="small muted">মোট ${fmtNum(Object.keys(F_UNIT_DEFAULT).reduce((a,k)=>a+fUnitList(k).length,0))} একক</div></div></div>
      <div class="sec"><div class="sec-head amber">${icon('warn')}<div><b>সতর্কতা</b><span>স্টক কম হলে জানান</span></div></div>
      <div class="sec-body">${cfg.groups[1].items.map(t=>fToggle(t[0],t[1],t[2],t[3])).join('')}</div></div>`;
    openModal({title:'স্টক সেটিংস',sub:'একক, সতর্কতা ও গণনা',body,wide:true,submit:'বন্ধ করুন'});
    return;
  }
  const groups=cfg.groups.map(g=>{
    let inner='';
    if(g.items) inner=g.items.map(t=>{
      if(t[0]==='invoice/layout'){
        const cur=fSetGet('invoice/layout','thermal');
        return `<div class="field"><label>${esc(t[1])}</label>
          <select data-fset-val="invoice/layout">
            ${optionList([['thermal','থার্মাল রিসিট (৮০মিমি)'],['a4','এক্সিস A4'],['a5','এক্সিস A5'],['letter','Letter']],cur)}
          </select><span class="hint">${esc(t[2])}</span></div>`;
      }
      if(t[0]==='sale/defaultDiscount'){
        const cur=Math.min(100,Math.max(0,fNum('sale/discountPct',0)));
        return fToggle(t[0],t[1],t[2],t[3])+`<div class="field"><label>ডিফল্ট ছাড়ের হার (%)</label>
          <input type="number" step="any" min="0" max="100" data-fset-num="sale/discountPct" value="${cur||''}" placeholder="যেমন: ৫">
          <span class="hint">এই হার প্রতিটি নতুন বিক্রয় লাইনে স্বয়ংক্রিয়ভাবে বসবে${cur?` — এখন ${esc(pct(cur))}`:''}।</span></div>`;
      }
      if(t[0]==='stock/lowAlert'){
        const cur=fNum('stock/alertQty',0);
        return fToggle(t[0],t[1],t[2],t[3])+`<div class="field"><label>সতর্কতার সীমা (ঐচ্ছিক)</label>
          <input type="number" step="any" min="0" data-fset-num="stock/alertQty" value="${cur||''}" placeholder="ফাঁকা হলে প্রতিটি পণ্যের নিজের সর্বনিম্ন স্টক">
          <span class="hint">বেল আইকন ও ড্যাশবোর্ডে এই সীমার নিচে নামলেই সতর্কতা দেখাবে।</span></div>`;
      }
      if(t[0]==='invoice/showBalance'){
        return fToggle(t[0],t[1],t[2],t[3])+`<div class="field"><label>যোগাযোগ ব্যালেন্সের ধরন</label>
          <select data-fset-val="invoice/balanceMode">
            ${optionList([['customer','কাস্টমার (প্রাপ্য)'],['supplier','সাপ্লায়ার (প্রদেয়)'],['both','দুটোই']],fSetGet('invoice/balanceMode','customer')||'customer')}
          </select></div>`;
      }
      return fToggle(t[0],t[1],t[2],t[3]);
    }).join('');
    if(g.action==='f-extra') inner=`${fExtraSummary()}<button type="button" class="btn" data-act="f-extra">${icon('plus')}<span>${esc(g.actionLabel||'এন্ট্রি দেখুন')}</span></button>`;
    if(g.action==='f-color-open') inner=fColorPicker();
    if(g.action==='f-new-expense') inner=`<button type="button" class="btn btn-primary" data-act="f-new-expense">${icon('plus')}<span>নতুন খরচ এন্ট্রি</span></button>`;
    return `<div class="sec"><div class="sec-head ${esc(g.tone||'')}">${icon(g.tone==='amber'?'warn':g.tone==='blue'?'truck':g.tone==='violet'?'toggle':g.tone==='teal'?'book':'check')}
      <div><b>${esc(g.name)}</b>${g.sub?`<span>${esc(g.sub)}</span>`:''}</div></div>
      <div class="sec-body">${inner}</div></div>`;
  }).join('');
  openModal({title:cfg.title,sub:cfg.sub,body:groups,wide:true,submit:'বন্ধ করুন'});
}

/* ---------- অতিরিক্ত চার্জ ---------- */
function fExtraCharges(){
  return Object.entries(DATA.settings?.set?.extraCharges||{}).map(([id,v])=>({id,...v}));
}
function fExtraSummary(){
  const list=fExtraCharges();
  if(!list.length) return `<div class="small muted">এখনো কোনো ডিফল্ট অতিরিক্ত চার্জ নেই।</div>`;
  return `<div class="unit-chips">${list.map(e=>`<span class="unit-chip">${esc(e.name)} · ${tk(e.amount)}</span>`).join('')}</div>`;
}
function openExtraCharges(){
  const list=fExtraCharges();
  const body=`<div class="sec"><div class="sec-head amber">${icon('wallet')}<div><b>ডিফল্ট অতিরিক্ত চার্জ</b><span>প্রতি নতুন বিক্রয় ও ক্রয়ে স্বয়ংক্রিয় যোগ হবে</span></div></div>
    <div class="sec-body">
      ${list.length?list.map(e=>`<div class="tgl on"><span class="tgl-txt"><b>${esc(e.name)}</b><span>${e.kind==='purchase'?'ক্রয়':'বিক্রয়'} · ${tk(e.amount)}</span></span>
        <button class="btn btn-xs btn-danger" type="button" data-act="f-extra-del" data-id="${esc(e.id)}">${icon('trash','ic-sm')}</button></div>`).join(''):`<div class="small muted">কোনো এন্ট্রি নেই।</div>`}
      <div class="form-grid mt12">
        ${fld('চার্জের নাম',`<input name="name" placeholder="যেমন: মোটর খরচ / কুরিয়ার">`)}
        ${fld('পরিমাণ (৳)',`<input type="number" name="amount" step="any" min="0" placeholder="0">`)}
        ${fld('কোথায় যোগ হবে',`<select name="kind">${optionList([['sale','বিক্রয়'],['purchase','ক্রয়']],'sale')}</select>`,'span2')}
      </div>
    </div></div>`;
  openModal({title:'অতিরিক্ত চার্জ',sub:'কুরিয়ার, মোটর খরচ ইত্যাদি',body,form:'fextra',wide:true,submit:'যোগ করুন'});
}

    <div style="background:#fff;padding:12px 13px;border-radius:14px 14px 0 0;border-bottom:1px solid #e3ece6">
      <div class="row between"><b style="font-size:12.5px;color:#12301f">ইনভয়েস কালার</b><span class="badge gray">${esc(cur)}</span></div>
      <div style="margin-top:9px;border:1px solid ${strong};border-radius:9px;overflow:hidden">
        <div style="background:${strong};color:#fff;font-size:10.5px;font-weight:700;display:flex;gap:8px;padding:7px 10px">
          <span style="flex:0 0 22px">Sl</span><span style="flex:1">Product</span><span>Price</span><span>Qty</span><span>Amount</span>
        </div>
        <div style="background:#f7faf8;height:16px"></div>
      </div>
    </div>
    <div style="padding:10px 12px 12px;background:#fff;border-radius:0 0 14px 14px">
      <button type="button" class="btn btn-sm btn-primary" data-act="f-color" data-id="default">Default</button>
      <div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;margin-top:10px">
        ${F_COLORS.map(c=>`<button type="button" data-act="f-color" data-id="${c}" title="${c}"
          style="height:34px;border-radius:9px;background:${c};border:2px solid ${c===cur?'#0f172a':'rgba(0,0,0,.12)'};cursor:pointer"></button>`).join('')}
      </div>
    </div></div>`;
}

/* ---------- একক ব্যবস্থাপনা ---------- */
function openUnitsModal(){
  const body=Object.keys(F_UNIT_DEFAULT).map(kind=>{
    const list=fUnitList(kind);
    const custom=fUnits(kind)?' <span class="badge green">কাস্টম</span>':'';
    return `<div class="unit-group"><div class="unit-group-h"><b>${esc(F_UNIT_GROUP_NAME[kind])} ${custom}</b>
      <span class="badge gray">${fmtNum(list.length)}</span></div>
      <div class="unit-chips">
        ${list.map(u=>`<span class="unit-chip ${kind==='count'&&u.id==='pcs'?'sel':''}">${esc(u.id)}<small>${esc(u.label||'')}</small>
          ${fUnits(kind)?`<button type="button" data-act="f-unit-del" data-item="${esc(kind)}" data-id="${esc(u.id)}" title="মুছুন">×</button>`:''}</span>`).join('')}
      </div></div>`;
  }).join('');
  const addForm=`<div class="sec"><div class="sec-head green">${icon('plus')}<div><b>নতুন একক</b><span>নাম ও সংক্ষিপ্ত রূপ দিন</span></div></div>
    <div class="sec-body"><div class="form-grid">
      ${fld('গ্রুপ',`<select name="kind">${optionList(Object.keys(F_UNIT_DEFAULT).map(k=>[k,F_UNIT_GROUP_NAME[k]]),'count')}</select>`)}
      ${fld('একক',`<input name="unit" placeholder="যেমন: pcs" required>`)}
      ${fld('পূর্ণ নাম',`<input name="label" placeholder="যেমন: Pieces">`,'span2')}
    </div></div></div>`;
  const search=`<div class="field" style="margin-bottom:4px"><label style="position:relative;display:block">
      <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#6b8577">${icon('search','ic-sm')}</span>
      <input data-fsearch placeholder="এককের নাম বা সিম্বল খুঁজুন" style="padding-left:34px">
    </label></div>`;
  const total=Object.keys(F_UNIT_DEFAULT).reduce((a,k)=>a+fUnitList(k).length,0);
  openModal({title:'একক',sub:'এককগুলো ক্যাটাগরি অনুযায়ী গ্রুপ করা',body:`<div class="stack">${search}${body}${addForm}</div>`,form:'funit',wide:true,submit:'নতুন একক যোগ করুন',left:`<span class="small muted">${fmtNum(total)} একক</span>`});
}

/* ---------- খরচ ক্যাটাগরি যোগ ---------- */
function openCatAdd(group){
  openModal({title:'নতুন ক্যাটাগরি',sub:F_CAT_GROUPS[group]||group,form:'fcat',submit:'যোগ করুন',body:`
    <input type="hidden" name="group" value="${esc(group)}">
    <div class="form-grid">
      ${fld('নাম',`<input name="name" required placeholder="যেমন: বেতন">`,'span2')}
      ${fld('আইকন',`<select name="icon">${optionList([['wallet','ওয়ালেট'],['users','কর্মী'],['asset','দোকান'],['check','বিল'],['clock','সময়'],['box','বক্স'],['cart','কার্ট'],['truck','পরিবহন'],['plus','অন্যান্য']],'wallet')}</select>`,'span2')}
    </div>`});
}
async function fCatSave(group,name,ic){
  const id='c_'+Date.now().toString(36);
  if(S.mode==='firebase'&&FB.db){
    await FB.mods.set(FB.mods.ref(FB.db,`ips/settings/cats/${group}/${id}`),{id,name,icon:ic||'wallet',createdAt:new Date().toISOString(),createdBy:ROLE_NAMES[S.role]||S.role});
  }else{
    setPath(DATA,`settings/cats/${group}/${id}`,{id,name,icon:ic||'wallet',createdAt:new Date().toISOString()});
    persistDemo();
  }
}

/* ---------- নতুন পণ্য / কাঁচামাল ফর্ম ---------- */
function openEntityForm(kind,id=''){

    <input type="hidden" name="kind" value="${esc(kind)}"><input type="hidden" name="id" value="${esc(id)}">
    <div class="ftabs"><button type="button" class="active">বেসিক</button><button type="button" disabled title="শীঘ্রই">অ্যাডভান্স</button></div>
    <div class="sec"><div class="sec-head green">${icon('bag')}<div><b>মূল তথ্য</b></div></div>
      <div class="sec-body">
        <label class="img-up" data-act="f-img">
          <span class="up-ic">${icon('camera')}</span>
          <b>আপলোড</b><span>ক্যামেরা বা গ্যালারি — ছোট সাইজে সংরক্ষণ হবে</span>

        ${fld('পণ্যের নাম *',`<input name="name" required value="${esc(e.name||'')}" placeholder="যেমন: বাসমতি চাল ৫ কেজি">`,'')}
        <div style="margin-top:10px" class="field"><label>বারকোড</label>

          <button class="bc-btn" type="button" data-act="f-scan" title="স্ক্যান">${icon('toggle')}</button></div>
          <span class="hint">0/64</span></div>
      </div></div>
    <div class="sec"><div class="sec-head teal">${icon('box')}<div><b>মূল ও স্টক</b><span>মূল্য ইংরেজি সংখ্যায় লিখুন (0–9); বাংলা সংখ্যা (০–৯) ব্যবহার করবেন না।</span></div></div>
      <div class="sec-body">
        ${fToggle('entity/service','সেবা আইটেম','স্টক নেই — মেরামত, প্রিন্ট ইত্যাদি অ-ইনভেন্টরি আইটেমের জন্য',false)}

          ${fld('বিক্রয় মার্জিন %',`<input type="number" step="any" name="marginPct" placeholder="ক্রয়ের উপর মার্জিন">`)}

const F_MFS_PROVIDERS = [
  ['bkash','বিকাশ (bKash)','#e2136e','018XX-XXXXXX'],
  ['nagad','নগদ (Nagad)','#f47c20','016XX-XXXXXX'],
  ['rocket','রকেট (Rocket)','#8c3494','017XX-XXXXXXX'],
  ['upay','উপায় (Upay)','#00a651','019XX-XXXXXX'],
  ['cellfin','সেলফিন (CellFin)','#1a73e8','018XX-XXXXXX'],
  ['other','অন্যান্য MFS','#0f766e','01XXXXXXXXX']
];
function fMfsProviderName(code){const f=F_MFS_PROVIDERS.find(p=>p[0]===code);return f?f[1]:'MFS';}
function fMfsProviderColor(code){const f=F_MFS_PROVIDERS.find(p=>p[0]===code);return f?f[2]:'#0f766e';}
function fMfsProviderOption(sel){
  return optionList(F_MFS_PROVIDERS.map(p=>[p[0],p[1]]),sel||'bkash');
}
function fMfsAccounts(){
  const saved=(DATA.settings?.mfsAccounts||{});
  return Object.entries(saved).map(([id,v])=>({id,...v})).filter(x=>x&&x.number);
}
function fMfsAcctOptions(sel,provider=''){
  const all=fMfsAccounts();
  const list=provider?all.filter(a=>a.provider===provider):all;
  if(!list.length) return optionList([],[],provider?`${fMfsProviderName(provider)} নম্বর যোগ করুন`:'অ্যাকাউন্ট যোগ করুন');
  return optionList(list.map(a=>[a.id,`${fMfsProviderName(a.provider)} — ${a.number}${a.holder?' · '+a.holder:''}`]),sel||list[0].id);
}
function fMfsBalances(){
  const map={};
  for(const a of fMfsAccounts()) map[a.id]={in:0,out:0,recharge:0,commission:0,net:0,count:0,acct:a};
  for(const m of vals(DATA.mfs)){
    const b=map[m.accountId]; if(!b) continue;
    b.count++;
    b.commission+=n(m.commission);
    if(m.kind==='in') b.in+=n(m.amount);
    else if(m.kind==='out') b.out+=n(m.amount);
    else b.recharge+=n(m.amount);
  }
  for(const k of Object.keys(map)){
    const b=map[k];
    b.net=round2(b.in-b.out-b.recharge+(b.commission||0));
  }
  return map;
}
function fMfsProviderBalance(accountId){
  const b=fMfsBalances();
  if(accountId&&b[accountId]) return b[accountId].net;
  return round2(Object.values(b).reduce((a,x)=>a+n(x.net),0));
}

    return {no:'INV-'+String(id).slice(-6).toUpperCase(),date:s.date,color:c,
      head:'বিক্রয় ইনভয়েস',party:s.party||empName(s.repId)||'ক্রেতা',phone:s.phone||'',addr:locName(s.locationId),
      lines:[[saleTitle(s),s.qtySold,s.unitPrice,s.expected,s.type==='semi'?n(byId('items',s.itemId)?.mrp):n(byId('products',s.productId)?.mrp)]],
      total:round2(s.expected),paid:round2(s.actual),due:round2(n(s.expected)-n(s.actual)),
      words:showWords,showMRP,showFooter,co,addr,barcode:fBool('invoice/showBarcode',true)};
  }
  if(kind==='order'||kind==='purchase'){
    const o=byId('orders',id);if(!o) return null;
    return {no:o.no||String(id).slice(-6),date:o.date,color:c,

      lines:[[o.title||fRefName(o.refId),o.qty,o.rate,o.total]],
      total:round2(o.total),paid:round2(o.advance),due:round2(n(o.total)-n(o.advance)),
      words:showWords,showMRP,showFooter,co,addr,barcode:fBool('invoice/showBarcode',true)};
  }
  return null;
}
function fNumWords(v){
  const ones=['','এক','দুই','তিন','চার','পাঁচ','ছয়','সাত','আট','নয়','দশ','এগারো','বারো','তেরো','চৌদ্দ','পনেরো','ষোল','সতেরো','আঠারো','উনিশ'];
  const tens=['','','বিশ','ত্রিশ','চল্লিশ','পঞ্চাশ','ষাট','সত্তর','আশি','নব্বই'];
  const two=x=>x<20?ones[x]:tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'');
  const three=x=>{const h=Math.floor(x/100),r=x%100;return (h?ones[h]+' শত':'')+(r?(h?' ':'')+two(r):'');};
  let x=Math.floor(Math.abs(n(v)));if(!x) return 'শূন্য টাকা';
  const cr=Math.floor(x/10000000);x%=10000000;const la=Math.floor(x/100000);x%=100000;const th=Math.floor(x/1000);x%=1000;
  let out='';if(cr) out+=three(cr)+' কোটি ';if(la) out+=three(la)+' লক্ষ ';if(th) out+=three(th)+' হাজার ';if(x) out+=three(x);
  return out.trim()+' টাকা মাত্র';
}

/* ---------- নোটিফিকেশন কেন্দ্র (বেল) ---------- */
function fPendingList(){
  const out=[];
  for(const x of vals(DATA.expenses).filter(x=>x.status==='pending')) out.push({t:'খরচ অনুমোদন বাকি',s:`${x.description} · ${tk(x.amount)}`,ic:'wallet',act:'go',page:'approvals'});
  for(const s of vals(DATA.sales).filter(s=>s.status==='pending')) out.push({t:'বিক্রয় ব্যবধান',s:`${saleTitle(s)} · ব্যবধান ${tk(s.variance)}`,ic:'cart',act:'go',page:'approvals'});
  if(fBool('stock/lowAlert',true)) for(const l of lowStockItems().slice(0,6)) out.push({t:'স্টক কম',s:`${l.item.name} — আছে ${fmtNum(l.qty,1)} ${l.item.unit}`,ic:'box',act:'go',page:'stock'});
  for(const o of vals(DATA.orders).filter(o=>!o.delivered&&n(o.total)>n(o.advance))) out.push({t:'অর্ডার বাকি',s:`${o.no||''} · ${o.party||''} · ${tk(n(o.total)-n(o.advance))}`,ic:'book',act:'f-order-view',id:o.id});
  /* unseen event notices: today's sales/check-ins and monthly expense reminders */
  const date=todayISO(),month=date.slice(0,7);
  let seen={};try{seen=JSON.parse(localStorage.getItem('ideaprint_seen_event_notices')||'{}')||{};}catch(e){}
  const addEvent=(id,item)=>{if(!seen[id])out.push({...item,eventNoticeId:id});};
  for(const sale of vals(DATA.sales).filter(x=>String(x.date||'').slice(0,10)===date)) addEvent(`sale:${sale.id||sale.no||sale.createdAt}`,{t:'নতুন পণ্য বিক্রয়',s:`${saleTitle(sale)} · ${tk(sale.actual||sale.total||0)}`,ic:'cart',act:'go',page:'sales'});
  for(const emp of vals(DATA.employees).filter(e=>e.active!==false)){
    const att=DATA.attendance[emp.id]?.[date];
    const punches=Array.isArray(att?.sessions)&&att.sessions.length?att.sessions.map(x=>x.in).filter(Boolean):(att?.in?[att.in]:[]);
    punches.forEach((inTime,i)=>addEvent(`checkin:${emp.id}:${date}:${inTime}`,{t:'কর্মীর চেক-ইন',s:`${emp.name} · ${ROLE_NAMES[emp.role]||emp.role} · ${locShort(emp.locationId)} · ${fmtTime(inTime)}`,ic:'users',act:'go-att-today',page:'attendance'}));
  }
  if(date.slice(-2)>='01'){
    addEvent(`monthly-payroll:${month}`,{t:'মাসিক বেতন মনে করিয়ে দিচ্ছে',s:'কর্মচারীদের বেতন পরিশোধ/এন্ট্রি যাচাই করুন',ic:'wallet',act:'f-bell-goto',page:'expenses'});
    addEvent(`monthly-rent:${month}`,{t:'দোকান ভাড়া মনে করিয়ে দিচ্ছে',s:'এই মাসের দোকান ভাড়ার বিল পরিশোধ/এন্ট্রি যাচাই করুন',ic:'wallet',act:'f-bell-goto',page:'expenses'});
    addEvent(`monthly-utility:${month}`,{t:'ইউটিলিটি বিল মনে করিয়ে দিচ্ছে',s:'বিদ্যুৎ, গ্যাস ও পানির বিল পরিশোধ/এন্ট্রি যাচাই করুন',ic:'wallet',act:'f-bell-goto',page:'expenses'});
  }
  return out;
}

function fPendingTotal(){try{return fPendingList().length;}catch(e){return 0;}}
/* নোটিফিকেশন আইকনটি টপবারে সরাসরি বসিয়ে দিই (মার্ক করা সব বাটন বেলের ভিতরে) */
function fEnsureBellBar(){
  try{
    const bar=$('#topbar-bar');
    /* মার্কআপে আগে থেকেই বেল আইকন আছে — ডুপ্লিকেট বানানো যাবে না */
    let bell=document.querySelector('#f-bell-btn');
    if(!bell&&bar){
      bell=document.createElement('button');
      bell.type='button';
      bell.className='icon-btn f-bell-inline bell-wrap';
      bell.id='f-bell-btn';
      bell.setAttribute('data-act','f-bell');
      bell.title='নোটিফিকেশন ও দ্রুত কাজ';
      bell.setAttribute('aria-label','নোটিফিকেশন');
      bell.innerHTML=icon('clock');
      bar.appendChild(bell);
    }
    if(!bell) return;
    const n=fPendingTotal();
    let badge=bell.querySelector('.f-bell-count');
    if(n>0){
      if(!badge){badge=document.createElement('i');badge.className='bell-badge f-bell-count';bell.appendChild(badge);}
      badge.textContent=n>99?'99+':n;
    }else if(badge){badge.remove();}
    fBellPulse(n);
  }catch(e){}
}
function fBellPulse(n){
  const b=$('#f-bell-btn'); if(!b) return;
  const prev=S._bellSeen;
  S._bellSeen=n;
  if(n>0&&(prev===undefined||prev===null||n>prev)){
    b.classList.remove('bell-alert');void b.offsetWidth;
    b.classList.add('bell-alert');
    clearTimeout(window.__fBellT); /* সতর্কতা দেখা না হওয়া পর্যন্ত অ্যানিমেশন চলবে */
  }else if(n===0){ b.classList.remove('bell-alert'); }
}
function fMarkBellSeen(){
  const current=fPendingList(), b=$('#f-bell-btn');
  try{const seen=JSON.parse(localStorage.getItem('ideaprint_seen_event_notices')||'{}')||{};for(const x of current)if(x.eventNoticeId)seen[x.eventNoticeId]=Date.now();localStorage.setItem('ideaprint_seen_event_notices',JSON.stringify(seen));}catch(e){}
  if(b){b.classList.remove('bell-alert');const badge=b.querySelector('.f-bell-count');const n=fPendingTotal();if(badge){if(n)badge.textContent=n>99?'99+':n;else badge.remove();}}
  S._bellSeen=fPendingTotal();
}

    <div class="ftabs">

      </div>

    `});
