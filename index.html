document.addEventListener('submit',async e=>{
  const form=e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const name=form.dataset.form;
  const fd=new FormData(form);
  const g=k=>String(fd.get(k)??'').trim();
  const val=k=>n(fd.get(k));
  try{
    if(name==='login'){
      if(!FB.auth||!FB.authMod) throw new Error('Firebase সংযুক্ত নয়');
      const email=g('email').toLowerCase(),pw=String(fd.get('password')||'');
      if(!email||!pw) throw new Error('ইমেইল ও পাসওয়ার্ড দিন');
      try{await FB.authMod.signInWithEmailAndPassword(FB.auth,email,pw);}
      catch(err){throw new Error(authErrorText(err));}
      toast('লগইন সফল হয়েছে','good');
    }
    else if(name==='forgot'){
      if(!FB.auth||!FB.authMod) throw new Error('Firebase সংযুক্ত নয়');
      const email=g('email').toLowerCase();
      if(!email) throw new Error('ইমেইল দিন');
      try{await FB.authMod.sendPasswordResetEmail(FB.auth,email);}
      catch(err){throw new Error(authErrorText(err));}
      closeModal();toast('পাসওয়ার্ড রিসেট লিংক ইমেইলে পাঠানো হয়েছে','good');
    }
    else if(name==='user'){
      if(S.mode!=='firebase'||!S.userProfile||S.userProfile.role!=='admin') throw new Error('শুধু অ্যাডমিন ব্যবহারকারী পরিচালনা করতে পারেন');
      const uid=g('uid'),email=g('email').toLowerCase(),pw=String(fd.get('password')||'');
      if(!email) throw new Error('ইমেইল দিন');
      const role=g('role')||'operator',active=g('active')!=='false';
      if(!ROLE_NAMES[role]) throw new Error('সঠিক রোল নির্বাচন করুন');
      if(uid){
        const existing=(S.users||{})[uid]||{};
        if(uid===S.user?.uid&&(role!=='admin'||!active)) throw new Error('নিজের অ্যাডমিন/সক্রিয় অনুমতি বন্ধ করা যাবে না');
        const patch={...existing,uid,email:existing.email||email,name:g('name')||existing.name||'',role,active};
        try{await FB.mods.update(FB.mods.ref(FB.db,'users/'+uid),patch);}
        catch(err){throw new Error(authErrorText(err));}
        if(S.users) S.users[uid]=patch;
        closeModal();
        if(uid===S.user?.uid) await handleAuthState(FB.auth.currentUser);
        else await loadUsers(true);
        toast('ব্যবহারকারীর অনুমতি সংরক্ষিত হয়েছে','good');
      }else{
        if(pw.length<6) throw new Error('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন');
        const newUid=await provisionAuthUser(email,pw);
        const prof={email,role,active:true,name:g('name')||'',createdAt:new Date().toISOString(),createdBy:S.user.email||S.user.uid};
        try{await FB.mods.set(FB.mods.ref(FB.db,'users/'+newUid),prof);}
        catch(err){throw new Error('Auth অ্যাকাউন্ট তৈরি হয়েছে, কিন্তু প্রোফাইল লেখা যায়নি: '+authErrorText(err));}
        if(S.users) S.users[newUid]={...prof,uid:newUid};
        closeModal();toast('ব্যবহারকারী তৈরি হয়েছে — '+email,'good');
        await loadUsers(true);
      }
    }
    else if(name==='raw'){
      const itemId=g('itemId'),loc=g('locationId'),qty=val('qty');
      if(!itemId||!loc||qty<=0) throw new Error('মাল, লোকেশন ও সঠিক পরিমাণ দিন');
      const lot=planAddLot('raw',{itemId,qty,remaining:qty,rate:val('rate'),transport:val('transport'),loading:val('loading'),locationId:loc,date:g('date')||todayISO(),supplier:g('supplier'),note:g('note')});
      await batch([lot]);
      closeModal();toast('মাল ক্রয় সংরক্ষিত — '+itemName(itemId),'good');
    }
    else if(name==='semiTransfer'){
      const itemId=g('itemId'),loc=g('locationId'),qty=val('qty');
      if(qty<=0) throw new Error('সঠিক পরিমাণ দিন');
      const con=planConsume('raw',itemId,loc,qty);
      if(con.short>0.0001) throw new Error(`স্টকে যথেষ্ট নেই — আছে ${fmtNum(rawQty(itemId,loc),1)} ${itemUnit(itemId)}`);
      const unitCost=round2(con.cost/Math.max(qty,0.0001));
      const lot=planAddLot('semi',{itemId,qty,remaining:qty,unitCost,locationId:loc,date:g('date')||todayISO(),note:g('note')||'সেমি-ফিনিশডে স্থানান্তর'});
      await batch([...con.updates,lot]);
      closeModal();toast('সেমি-ফিনিশড স্টকে স্থানান্তর হয়েছে','good');
    }
    else if(name==='semiSale'){
      const itemId=g('itemId'),loc=g('locationId'),qty=val('qtySold');
      if(qty<=0) throw new Error('সঠিক পরিমাণ দিন');
      const price=val('unitPrice')||n(byId('items',itemId)?.semiPrice);
      if(price<=0) throw new Error('বিক্রয় দর দিন');
      const con=planConsume('semi',itemId,loc,qty);
      if(con.short>0.0001) throw new Error(`সেমি স্টকে যথেষ্ট নেই — আছে ${fmtNum(semiQty(itemId,loc),1)} ${itemUnit(itemId)}`);
      const expected=round2(qty*price);
      const actual=fd.get('actual')===''?expected:val('actual');
      const variance=round2(expected-actual);
      const rec=planAdd('sales',{type:'semi',date:g('date')||todayISO(),itemId,qtySold:qty,qtyReturned:0,unitPrice:price,expected,actual,variance,cost:con.cost,locationId:loc,repId:g('repId'),note:g('note'),status:variance?'pending':'approved'});
      await batch([...con.updates,rec]);
      closeModal();
      toast(variance?'সেমি বিক্রয় সংরক্ষিত — ব্যবধান অনুমোদনের অপেক্ষায়':'সেমি বিক্রয় সম্পন্ন','good');
    }
    else if(name==='dispatch'){
      const type=g('type')==='outlet'?'outlet':'sales';
      const productId=g('productId'),from=g('locationId'),to=g('toLocationId'),qty=val('qty');
      if(!productId||!from||!to) throw new Error('পণ্য, উৎস ও গন্তব্য নির্বাচন করুন');
      if(from===to) throw new Error('উৎস ও গন্তব্য একই হতে পারে না');
      if(qty<=0) throw new Error('সঠিক পরিমাণ দিন');
      const con=planConsume('fg',productId,from,qty);
      if(con.short>0.0001) throw new Error(`উৎস স্টোরে যথেষ্ট পণ্য নেই — আছে ${fmtNum(fgQty(productId,from),1)} ${productUnit(productId)}`);
      const unitCost=round2(con.cost/Math.max(qty,0.0001));
      const dp=planAdd('dispatches',{date:g('date')||todayISO(),productId,qty,unitCost,cost:con.cost,price:n(byId('products',productId)?.price),fromLocationId:from,toLocationId:to,type,note:g('note')});
      const lot=planAddLot('fg',{productId,qty,remaining:qty,unitCost,locationId:to,date:g('date')||todayISO(),note:g('note')||'ডেলিভারি স্টক'});
      await batch([...con.updates,dp,lot]);
      closeModal();toast(type==='outlet'?'আউটলেটে পাঠানো হয়েছে':'ডেলিভারি পাঠানো হয়েছে','good');
    }
    else if(name==='sale'){
      const d=byId('dispatches',g('dispatchId'));
      if(!d) throw new Error('ডেলিভারি নির্বাচন করুন');
      const bal=dispatchBalance(d);
      const qty=val('qtySold'),returned=val('qtyReturned');
      if(qty<=0) throw new Error('সঠিক বিক্রীত পরিমাণ দিন');
      if(qty+returned>bal+0.001) throw new Error(`ডেলিভারি ব্যালেন্স ${fmtNum(bal)} — এর বেশি বিক্রয় সম্ভব নয়`);
      const price=val('unitPrice')||n(byId('products',d.productId)?.price);
      if(price<=0) throw new Error('বিক্রয় দর দিন');
      const expected=round2(qty*price);
      const actual=fd.get('actual')===''?expected:val('actual');
      const variance=round2(expected-actual);
      const con=planConsume('fg',d.productId,d.toLocationId,qty);
      let cost=con.cost;
      if(con.short>0.0001) cost=round2(cost+con.short*n(d.unitCost));
      const rec=planAdd('sales',{type:'fg',date:g('date')||todayISO(),dispatchId:d.id,productId:d.productId,qtySold:qty,qtyReturned:returned,unitPrice:price,expected,actual,variance,cost,locationId:d.toLocationId,repId:g('repId'),note:g('note'),status:variance?'pending':'approved'});
      await batch([...con.updates,rec]);
      closeModal();
      toast(variance?'বিক্রয় সংরক্ষিত — আদায় ব্যবধান অনুমোদনের অপেক্ষায়':'বিক্রয় সম্পন্ন','good');
    }
    else if(name==='issue'){
      const itemId=g('itemId'),loc=g('locationId'),qty=val('qty');
      if(qty<=0) throw new Error('সঠিক পরিমাণ দিন');
      const con=planConsume('raw',itemId,loc,qty);
      if(con.short>0.0001) throw new Error(`স্টকে যথেষ্ট নেই — আছে ${fmtNum(rawQty(itemId,loc),1)} ${itemUnit(itemId)}`);
      const rec=planAdd('issues',{date:g('date')||todayISO(),itemId,qty,locationId:loc,cost:con.cost,status:'open',note:g('note')});
      await batch([...con.updates,rec]);
      closeModal();toast('প্রোডাকশনে ইস্যু হয়েছে','good');
    }
    else if(name==='output'){
      const issue=byId('issues',g('issueId'));
      if(!issue) throw new Error('চলমান ব্যাচ নির্বাচন করুন');
      if(issue.status==='done') throw new Error('এই ব্যাচ ইতিমধ্যে সম্পন্ন');
      const productId=g('productId'),qty=val('qty'),conv=val('conversion');
      if(!productId||qty<=0) throw new Error('পণ্য ও সঠিক পরিমাণ দিন');
      const loc=g('locationId');
      const unitCost=round2((n(issue.cost)+conv)/qty);
      const out=planAdd('outputs',{date:g('date')||todayISO(),issueId:issue.id,itemId:issue.itemId,productId,qty,conversion:conv,rawCost:n(issue.cost),unitCost,locationId:loc,batch:g('batch'),note:g('note')});
      const lot=planAddLot('fg',{productId,qty,remaining:qty,unitCost,locationId:loc,date:g('date')||todayISO(),note:g('batch')||'উৎপাদন আউটপুট'});
      const upd=planUpdate('issues',issue.id,{status:'done',outputId:out.id});
      await batch([out,lot,upd]);
      closeModal();toast('উৎপাদন আউটপুট সংরক্ষিত — '+productName(productId),'good');
    }
    else if(name==='count'){
      const kind=g('kind'),loc=g('locationId'),ref=g('refId'),counted=val('countedQty');
      if(!ref) throw new Error('আইটেম নির্বাচন করুন');
      let systemQty=0,itemId='',productId='';
      if(kind==='raw'){systemQty=rawQty(ref,loc);itemId=ref;}
      else if(kind==='semi'){systemQty=semiQty(ref,loc);itemId=ref;}
      else if(kind==='fg'){systemQty=fgQty(ref,loc);productId=ref;}
      else{
        const d=byId('dispatches',ref);
        if(!d) throw new Error('ডেলিভারি নির্বাচন করুন');
        systemQty=dispatchBalance(d);productId=d.productId;
      }
      const diff=round2(counted-systemQty);
      const rec=planAdd('counts',{date:g('date')||todayISO(),kind,refId:ref,itemId,productId,locationId:kind==='point'?byId('dispatches',ref)?.toLocationId:loc,systemQty,countedQty:counted,diff,status:'pending',note:g('note'),createdBy:ROLE_NAMES[S.role]||S.role});
      await batch([rec]);
      closeModal();toast(diff?'গণনা সংরক্ষিত — গরমিল অনুমোদনের অপেক্ষায়':'গণনা সংরক্ষিত — কোনো গরমিল নেই','good');
    }
    else if(name==='leave'){
      const emp=byId('employees',g('employeeId'));
      if(!emp) throw new Error('কর্মী নির্বাচন করুন');
      const from=g('from'),to=g('to');
      if(!from||!to||to<from) throw new Error('সঠিক তারিখ দিন');
      if(!g('reason')) throw new Error('ছুটির কারণ লিখুন');
      const rec=planAdd('leaves',{employeeId:emp.id,locationId:emp.locationId,from,to,days:leaveDays({from,to}),type:g('type'),reason:g('reason'),status:'pending',createdBy:ROLE_NAMES[S.role]||S.role});
      await batch([rec]);
      closeModal();toast('ছুটির আবেদন জমা হয়েছে — অনুমোদনের অপেক্ষায়','good');
    }
    else if(name==='expense'){
      if(!g('description')||val('amount')<=0) throw new Error('বিবরণ ও সঠিক পরিমাণ দিন');
      const rec=planAdd('expenses',{date:g('date')||todayISO(),category:g('category'),description:g('description'),amount:val('amount'),paidBy:g('paidBy'),locationId:g('locationId'),status:'pending',note:g('note')});
      await batch([rec]);
      closeModal();toast('খরচ জমা হয়েছে — অনুমোদনের অপেক্ষায়','good');
    }
    else if(name==='asset'){
      if(!g('name')||val('cost')<=0) throw new Error('সম্পদের নাম ও ক্রয় মূল্য দিন');
      const rec=planAdd('assets',{name:g('name'),category:g('category'),locationId:g('locationId'),purchaseDate:g('purchaseDate')||todayISO(),cost:val('cost'),salvage:val('salvage'),lifeYears:Math.max(1,val('lifeYears')||5),method:g('method')==='declining'?'declining':'slm',rate:val('rate'),note:g('note')});
      await batch([rec]);
      closeModal();toast('সম্পদ যোগ হয়েছে','good');
    }
    else if(name==='location'){
      const id=g('id');
      const patch={name:g('name'),short:g('short'),type:g('type'),address:g('address')};
      if(g('lat')!=='') patch.lat=val('lat');
      if(g('lng')!=='') patch.lng=val('lng');
      if(!patch.name) throw new Error('লোকেশনের নাম দিন');
      await saveEntity('locations',id,patch);
      closeModal();toast('লোকেশন সংরক্ষিত হয়েছে','good');
    }
    else if(name==='item'){
      const id=g('id');
      const patch={name:g('name'),unit:g('unit')||'রিম',semiPrice:val('semiPrice'),minQty:val('minQty')};
      if(!patch.name) throw new Error('মালের নাম দিন');
      await saveEntity('items',id,patch);
      closeModal();toast('কাঁচামাল সংরক্ষিত হয়েছে','good');
    }
    else if(name==='product'){
      const id=g('id');
      const patch={name:g('name'),category:g('category'),unit:g('unit')||'পিস',price:val('price'),minQty:val('minQty')};
      if(!patch.name||patch.price<=0) throw new Error('পণ্যের নাম ও বিক্রয় মূল্য দিন');
      await saveEntity('products',id,patch);
      closeModal();toast('পণ্য সংরক্ষিত হয়েছে','good');
    }
    else if(name==='employee'){
      const id=g('id');
      const patch={name:g('name'),role:g('role'),phone:g('phone'),locationId:g('locationId'),active:g('active')==='true'};
      if(!patch.name) throw new Error('কর্মীর নাম দিন');
      let pin=g('pin');
      if(!pin) pin=id?byId('employees',id)?.pin||'':String(1000+Math.floor(Math.random()*9000));
      patch.pin=pin;
      await saveEntity('employees',id,patch);
      closeModal();toast(id?'কর্মী তথ্য সংরক্ষিত':'নতুন কর্মী যোগ হয়েছে — এখন ফেস এনরোল করুন','good');
    }
    else if(name==='org'){
      await batch([
        {path:'settings/company',value:g('company')},
        {path:'settings/address',value:g('address')},
        {path:'settings/workStart',value:g('workStart')||'09:30'},
        {path:'settings/lateAfter',value:g('lateAfter')||'09:30'},
        {path:'settings/fiscalStart',value:g('fiscalStart')||'07-01'},
        {path:'settings/varianceLimit',value:val('varianceLimit')}
      ]);
      closeModal();toast('প্রতিষ্ঠানের সেটিংস সংরক্ষিত','good');
    }
    else if(name==='opening'){
      await batch([
        {path:'settings/openingDate',value:g('openingDate')||'2000-01-01'},
        {path:'settings/opening/cash',value:val('cash')},
        {path:'settings/opening/bank',value:val('bank')},
        {path:'settings/opening/inventory',value:val('inventory')},
        {path:'settings/opening/fixedAssets',value:val('fixedAssets')},
        {path:'settings/opening/liabilities',value:val('liabilities')},
        {path:'settings/opening/capital',value:val('capital')}
      ]);
      closeModal();toast('প্রারম্ভিক ব্যালেন্স সংরক্ষিত','good');
    }
    else if(name==='decision'){
      if(!canApprove()) throw new Error('শুধুমাত্র অনুমোদনকারী বা অ্যাডমিন সিদ্ধান্ত দিতে পারেন');
      const kind=g('kind'),id=g('id'),action=g('action'),comment=g('comment');
      const by=ROLE_NAMES[S.role]||S.role;
      const at=new Date().toISOString();
      const approve=action==='approve';
      if(!approve&&!comment) throw new Error('বাতিলের কারণ লিখুন');
      if(kind==='expense'){
        if(!byId('expenses',id)) throw new Error('খরচ পাওয়া যায়নি');
        await batch([planUpdate('expenses',id,{status:approve?'approved':'rejected',approvedBy:by,approvedAt:at,decisionNote:comment})]);
      }else if(kind==='sale'){
        const s=byId('sales',id);
        if(!s) throw new Error('বিক্রয় পাওয়া যায়নি');
        const updates=[planUpdate('sales',id,{status:approve?'approved':'rejected',decidedBy:by,decidedAt:at,decisionNote:comment})];
        if(!approve&&n(s.qtySold)>0){
          const unit=round2(n(s.cost)/Math.max(1,n(s.qtySold)));
          const qty=n(s.qtySold);
          updates.push(s.type==='semi'
            ? planAddLot('semi',{itemId:s.itemId,qty,remaining:qty,unitCost:unit,locationId:s.locationId,date:todayISO(),note:'বিক্রয় বাতিল — স্টক ফেরত'})
            : planAddLot('fg',{productId:s.productId,qty,remaining:qty,unitCost:unit,locationId:s.locationId,date:todayISO(),note:'বিক্রয় বাতিল — স্টক ফেরত'}));
        }
        await batch(updates);
      }else if(kind==='leave'){
        if(!byId('leaves',id)) throw new Error('ছুটির আবেদন পাওয়া যায়নি');
        await batch([planUpdate('leaves',id,{status:approve?'approved':'rejected',decidedBy:by,decidedAt:at,decisionNote:comment})]);
      }else if(kind==='count'){
        const c=byId('counts',id);
        if(!c) throw new Error('গণনা পাওয়া যায়নি');
        const unit=countUnitCost(c);
        const diff=round2(n(c.countedQty)-n(c.systemQty));
        const updates=[planUpdate('counts',id,{status:approve?'approved':'rejected',approvedBy:by,approvedAt:at,adjustQty:approve?diff:0,unitCost:unit,decisionNote:comment})];
        if(approve&&diff!==0){
          const ck=c.kind==='point'?'fg':c.kind;
          const key=ck==='fg'?(c.productId||c.refId):(c.itemId||c.refId);
          if(diff>0){
            updates.push(planAddLot(ck,{...(ck==='fg'?{productId:key}:{itemId:key}),qty:diff,remaining:diff,unitCost:unit,locationId:c.locationId,date:todayISO(),note:'স্টক গণনা সমন্বয়'}));
          }else{
            const con=planConsume(ck,key,c.locationId,Math.abs(diff));
            updates.push(...con.updates);
          }
        }
        await batch(updates);
      }else throw new Error('সিদ্ধান্তের ধরন অজানা');
      closeModal();toast(approve?'অনুমোদিত হয়েছে':'বাতিল হয়েছে',approve?'good':'bad');
    }
    else if(name==='role'){
      const role=g('role'),pin=g('pin');
      if(role==='admin'||role==='authority'){
        const expected=DATA.settings.pins?.[role];
        if(expected&&pin!==expected) throw new Error('পিন মেলেনি');
      }
      S.role=role;savePref();closeModal();render();
      toast('রোল পরিবর্তিত: '+(ROLE_NAMES[role]||role),'good');
    }
    else if(name==='firebase'){
      const cfg={};
      for(const k of ['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId']){
        const v=g(k);if(v) cfg[k]=v;
      }
      if(!cfg.databaseURL) throw new Error('Database URL আবশ্যক');
      closeModal();toast('Firebase-এ সংযোগ হচ্ছে…','info');
      try{await connectFirebase(cfg);}
      catch(err){S.mode='firebase';S.conn='auth-error';S.authError='সংযোগ ব্যর্থ: '+err.message;toast('সংযোগ ব্যর্থ: '+err.message,'bad');render();}
    }
    else{
      console.warn('অজানা ফর্ম:',name);
    }
  }catch(err){
    console.error(err);
    toast(err?.message||'সংরক্ষণ করা যায়নি','bad');
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal-root')?.innerHTML) closeModal();
});

window.addEventListener('hashchange',()=>{
  const p=location.hash.slice(1);
  if(PAGE_TITLES[p]&&p!==S.page){S.page=p;S.menu=false;render();}
});

function boot(){
  loadPref();
  S.lastGeo=0;
  const cfg=loadConfig();
  if(cfg){
    connectFirebase(cfg).catch(err=>{
      console.error(err);
      S.mode='firebase';S.conn='auth-error';
      S.authError='Firebase সংযোগ ব্যর্থ: '+err.message;
      DATA=loadDemo();render();
      toast('Firebase সংযোগ ব্যর্থ — কনফিগ বা ইন্টারনেট যাচাই করুন','bad');
    });
  }else{
    DATA=loadDemo();S.mode='demo';S.conn='demo';
  }
  const h=location.hash.slice(1);
  if(PAGE_TITLES[h]) S.page=h;
  render();
}
