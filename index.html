function fSaleLive(){
  const root=$('#modal-root');if(!root) return;
  const form=root.querySelector('form[data-form="sale"]');if(!form) return;
  const showCost=fBool('sale/showCost',false);
  const hideProfit=fBool('sale/hideProfit',false);
  const mode=form.querySelector('input[name=mode]')?.value||'fg';
  const qty=n(form.querySelector('[name=qtySold]')?.value);
  const disc=Math.min(100,Math.max(0,n(form.querySelector('[name=discountPct]')?.value)));
  let unitCost=0,label='',autoPrice=0,stock=0,deliv=0,unit='পিস',locName='';
  if(mode==='fg'){
    const d=byId('dispatches',form.querySelector('[name=dispatchId]')?.value);
    if(d){unitCost=n(d.unitCost);label=productName(d.productId);autoPrice=n(byId('products',d.productId)?.price)||n(d.price);
      stock=fgQty(d.productId,d.toLocationId);deliv=dispatchBalance(d);unit=productUnit(d.productId);locName=locShort(d.toLocationId);}
  }else{
    const it=form.querySelector('[name=semiItemId]')?.value;
    if(it){unitCost=avgCost('semi',it,form.querySelector('[name=locationId]')?.value||S.loc);label=itemName(it);
      autoPrice=n(byId('items',it)?.semiPrice);stock=semiQty(it,form.querySelector('[name=locationId]')?.value||S.loc);
      unit=itemUnit(it);locName=locShort(form.querySelector('[name=locationId]')?.value||S.loc);}
  }
  /* দর অটো বসবে — ব্যবহারকারী নিজে বদলালে আর অটো হবে না */
  const priceInp=form.querySelector('input[name=unitPrice]');
  if(priceInp&&form.dataset.priceDirty!=='1'&&autoPrice>0) priceInp.value=autoPrice;
  const price=n(priceInp?.value);
  /* মজুদ চিপ */
  const stk=root.querySelector('[data-fs-stock]');
  if(stk) stk.innerHTML=`<b>মজুদ আছে :</b> ${label?`${esc(label)} · <span class="v">${fmtNum(stock,2)}</span> ${esc(unit)}${deliv>0?` · ডেলিভারি ${fmtNum(deliv,2)}`:''}${locName?` · ${esc(locName)}`:''}`:'—'}`;
  /* Total টাকা চিপ */
  const tot=root.querySelector('[data-fs-total]');
  const gross=round2(qty*price);
  if(tot) tot.textContent=(qty&&price)?tk(gross):'—';
  /* ক্রয় ও মুনাফা চিপ */
  const cst=root.querySelector('[data-fs-cost]');
  if(cst){
    if(!qty||!price){
      cst.innerHTML=`<b>ক্রয় / মুনাফা :</b> পরিমাণ ও দর লিখলে${hideProfit?'':' মুনাফাসহ'} দেখা যাবে`;
    }else{
      const cost=round2(qty*unitCost),profit=round2(gross*(1-disc/100)-cost);
      cst.className='mh-chip mh-cost'+(profit<0?' neg':'');
      cst.innerHTML=`<b>ক্রয় / মুনাফা :</b>${showCost?` ${tk(cost)} ·`:''} <span class="v">${tk(profit)}</span>`;
    }
  }
}

/* নতুন খরচ — খরচ সেটিংস মানে */
function fIsSalaryCat(name){
  const s=String(name||'');
  if(fIsFixedCat(s)) return s==='কর্মচারীর বেতন';
  return /বেতন|বোনাস|অগ্রিম|কর্মচারী|staff|salary|বিল|ভাড়া|দৈনিক|রক্ষণাবেক্ষণ/i.test(s);
}
/* কোন ধরনের ক্যাটাগরিতে কোন ফিল্ড দেখাবে */
function fCatMode(name){
  const s=String(name||'');
  if(fIsFixedCat(s)) return ({'কর্মচারীর খরচ':'staff','কর্মচারীর বেতন':'salary','দৈনিক খরচ':'daily','দোকান ভাড়া':'rent','Uttility বিল':'bill'})[s]||'daily';
  if(/বেতন|বোনাস|salary/i.test(s)) return 'salary';
  if(/কর্মচারী|staff/i.test(s)) return 'staff';
  if(/বিদ্যুৎ|গ্যাস|পানি|ইন্টারনেট|bill|utility/i.test(s)) return 'bill';
  if(/ভাড়া|rent/i.test(s)) return 'rent';
  if(/পরিবহন|যানবাহন|ট্রান্সপোর্ট/i.test(s)) return 'transport';
  return 'daily';
}
function fCatTitle(name,mode){
  if(!String(name||'').trim()) return 'নতুন খরচ';
  if(fIsFixedCat(name)) return name;
  return ({salary:'কর্মচারীর বেতন',staff:'কর্মচারীর খরচ',daily:'দৈনিক খরচ',rent:'দোকান ভাড়া',bill:'Uttility বিল',transport:'পরিবহন খরচ'})[mode]||'নতুন খরচ';
}
function fCatSub(mode){
  return ({salary:'বেতনের হিসাব দিন — কর্মচারী, মাস ও টাকা',staff:'কর্মচারীর খরচের তথ্য দিন',daily:'দৈনিক খরচের তথ্য দিন',rent:'দোকান ভাড়ার তথ্য দিন — মাস ও বাড়িওয়ালা',bill:'বিলের তথ্য দিন — টাকা, মাস ও মিটার নম্বর',transport:'পরিবহন খরচের তথ্য দিন'})[mode]||'খরচের ধরন, পরিমাণ ও পেমেন্ট মাধ্যম';
}
function fCatModeLabel(mode){return ({salary:'বেতন',staff:'কর্মচারী',daily:'দৈনিক খরচ',rent:'দোকান ভাড়া',bill:'বিদ্যুৎ/বিল',transport:'পরিবহন'})[mode]||'খরচ';}
function fMonthsOption(sel){
  const out=[];
  const base=new Date();
  for(let i=-1;i<12;i++){
    const d=new Date(base.getFullYear(),base.getMonth()-i,1);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    out.push([key,monthLabel(key)]);
  }
  return optionList(out,sel||todayISO().slice(0,7));
}

}

    };
    const updSum=()=>{
      if(!sumBox) return;

      const base=n(q('input[name=salaryBase]')?.value||0);

      show('[data-frent]',m==='rent'); show('[data-fbill]',m==='bill'); show('[data-fdaily]',m==='daily');
      const h=root.querySelector('.modal-head h3'); if(h) h.textContent=fCatTitle(name,m);
      const sub=root.querySelector('.modal-head p'); if(sub) sub.textContent=fCatSub(m);
      const sbtn=root.querySelector('.modal-foot .btn-primary'); if(sbtn) sbtn.textContent=sal?'বেতন জমা দিন':'খরচ জমা দিন';
      const lbl=empSel?empSel.closest('.field')?.querySelector('label'):null;
      if(lbl) lbl.textContent=sal?'কর্মচারীর নাম *':'কর্মচারী';
      if(empSel){ if(sal) empSel.setAttribute('required',''); else empSel.removeAttribute('required'); }
      if(!keepAmount&&sal){ /* বেতন হলে পরিমাণ স্বয়ংক্রিয় হিসাবে বসবে */ }
      updEmp(); updSum();
    };
    if(catSel) catSel.addEventListener('change',()=>applyMode(catSel.value));
    if(empSel) empSel.addEventListener('change',()=>{updEmp();updSum();});
    /* বেতনের হিসাব → পরিমাণ স্বয়ংক্রিয় */
    ['salaryBase','bonusAmt','deductAmt','amount'].forEach(nm=>{
      const el=q(`input[name=${nm}]`);
      if(el) el.addEventListener('input',()=>{
        if(nm!=='amount'&&fCatMode(catSel?.value||'')==='salary'){
          const net=round2(n(q('input[name=salaryBase]')?.value||0)+n(q('input[name=bonusAmt]')?.value||0)-n(q('input[name=deductAmt]')?.value||0));
          const amtEl=q('input[name=amount]');
          if(amtEl&&net>0) amtEl.value=net;
        }
        updSum();
      });
    });
    applyMode(cat||'',true);
  },60);
}

/* ---------- “আগে পার্টি নির্বাচন” গেট ---------- */
function fKnownParties(kind){
  const set=new Set();
  if(kind==='sale'){ vals(DATA.sales).forEach(s=>{const n1=empName(s.repId);if(n1&&n1!=='—') set.add(n1);}); }
  vals(DATA.orders).forEach(o=>{if(o.party) set.add(o.party);});
  vals(DATA.rawLots).forEach(l=>{if(l.supplier) set.add(l.supplier);});
  return [...set].slice(0,120);
}
function fPartyBalance(name,kind){
  if(!name) return 0;
  if(kind==='purchase') return round2(sum(vals(DATA.orders).filter(o=>o.party===name&&o.kind==='purchase'),o=>round2(n(o.total)-n(o.advance))));
  return round2(sum(vals(DATA.orders).filter(o=>o.party===name&&o.kind!=='purchase'),o=>round2(n(o.total)-n(o.advance))));
}
function fPartyGate(kind,next){
  const title=kind==='purchase'?'সাপ্লায়ার নির্বাচন':kind==='order'?'কাস্টমার নির্বাচন':'কাস্টমার / পার্টি নির্বাচন';

  openModal({title,sub:'শেষ ব্যালেন্স দেখে কনফার্ম করুন — তারপর ফর্ম খুলবে',form:'fparty',wide:true,submit:'কনফার্ম করে এগিয়ে যান',body:`

  setTimeout(()=>{
    const f=$('#modal-root form[data-form=""]');

      box.innerHTML=`${icon('wallet')}<div><b>${esc(p||'—')}</b><br>পুরোনো বাকি: <b>${tk(bal)}</b>${bal>0?'':' — কোনো বাকি নেই'}</div>`;
    });
    const form=$('#modal-root form');
    if(form){

/* ইনভয়েস — সব টগলের প্রভাবসহ রসিদ ডেটা */
function fReceiptData2(kind,id){
  const d=fReceiptData(kind,id);
  if(!d) return null;
  let c=fSetGet('invoice/color','#15803d')||'#15803d';
  if(c==='#ffffff') c='#111827';
  d.color=c;
  d.showLogo=fBool('invoice/showLogo',true);
  d.showMRP=fBool('invoice/showMRP',true);
  d.showWords=fBool('invoice/showWords',true);
  d.showFooter=fBool('invoice/showFooter',true);
  d.showBarcode=fBool('invoice/showBarcode',true);
  d.showBalance=fBool('invoice/showBalance',true);
  d.showSignature=fBool('invoice/showSignature',false);
  d.signature=fSetGet('invoice/signature','');
  d.logo=fSetGet('invoice/logo','');
  d.layout=fSetGet('invoice/layout','thermal')||'thermal';
  d.balance=0;
  if(d.showBalance){
    const mode=fSetGet('invoice/balanceMode','customer')||'customer';
    const party=d.party||'';
    if(party){
      if(mode!=='supplier'){
        d.balance=round2(sum(vals(DATA.sales).filter(s=>empName(s.repId)===party&&s.status!=='rejected'),s=>round2(n(s.expected)-n(s.actual))));
      }else{
        d.balance=round2(sum(vals(DATA.orders).filter(o=>o.party===party),o=>round2(n(o.total)-n(o.advance))));
      }
    }
  }
  return d;
}

  const d=fReceiptData2(kind,id);

function fShareReceipt(kind,id){
  const d=fReceiptData2(kind,id);
  if(!d){toast('তথ্য পাওয়া যায়নি','bad');return;}
  const text=[`${d.co}`,`${d.head} — ${d.no}`,`তারিখ: ${fmtDate(d.date)}`,`পার্টি: ${d.party}`]
    .concat(d.lines.map(l=>`• ${l[0]} × ${fmtNum(l[1],2)} = ${tk(l[3])}`))
    .concat([`মোট: ${tk(d.total)}`,`পরিশোধ: ${tk(d.paid)}`,`বাকি: ${tk(d.due)}`])
    .concat(d.showBalance?[`পূর্বের ব্যালেন্স: ${tk(d.balance)}`]:[])
    .concat(d.showWords?[`কথায়: ${fNumWords(d.total)}`]:[])
    .join('\n');
  if(navigator.share){navigator.share({title:d.no,text}).catch(()=>{});}
  else{copyText(text);}
}

/* ---------- নতুন টাইটেল / ন্যাভ / কলেকশন ---------- */
PAGE_TITLES.orders=['অর্ডার','বিক্রয় ও ক্রয় অর্ডার, অগ্রিম ও ডেলিভারি'];
PAGE_TITLES.mfs=['MFS ও ক্যাশ','ক্যাশ ইন, ক্যাশ আউট, রিচার্জ ও কমিশন'];

/* ---------- মূল অ্যাপে প্যাচ ---------- */
const F_ORIG = {};
function fInstall(){
  /* ১) ন্যাভ + কলেকশন */
  const ops=NAV.find(g=>g[0]==='ইনভেন্টরি ও অপারেশন');
  if(ops&&!ops[1].some(x=>x[0]==='orders')) ops[1].splice(3,0,['orders','অর্ডার','i-book']);
  const org=NAV.find(g=>g[0]==='প্রতিষ্ঠান');
  if(org&&!org[1].some(x=>x[0]==='mfs')) org[1].push(['mfs','MFS ও ক্যাশ','i-wallet']);
  for(const c of ['orders','mfs','itemCategories','expenseCategories']) if(!COLLECTIONS.includes(c)) COLLECTIONS.push(c);

  /* ২) ফাংশন র‍্যাপার */
  F_ORIG.handleAction=handleAction;
  handleAction=fHandleWrapper;
  F_ORIG.renderCurrentPage=renderCurrentPage;
  renderCurrentPage=fRenderCurrentPage;
  F_ORIG.renderExpenses=renderExpenses;
  renderExpenses=fRenderExpenses;
  F_ORIG.renderSetup=renderSetup;
  renderSetup=fRenderSetup;
  /* ৩) হেডারে বেল আইকন */
  F_ORIG.renderShell=renderShell;
  renderShell=function(content){
    let html=F_ORIG.renderShell(content);
    const pending=pendingTotalCount()+vals(DATA.orders).filter(o=>!o.delivered&&n(o.total)>n(o.advance)).length;
    html=html.replace('<button class="icon-btn" data-act="print" title="প্রিন্ট">',
      `<button class="icon-btn bell-wrap" id="f-bell-btn" data-act="f-bell" title="নোটিফিকেশন ও দ্রুত কাজ" aria-label="নোটিফিকেশন">${icon('clock')}${pending?`<i class="bell-badge f-bell-count">${pending>99?'99+':pending}</i>`:''}</button><button class="icon-btn" data-act="print" title="প্রিন্ট">`);
    return html;
  };

  /* ৪) সেটআপ পেজে সেটিংস হাব + নতুন পণ্য বাটন */
  /* ৫) ডিফল্ট ক্যাটাগরি সিড */
  if(!DATA.settings.cats||!Object.keys(DATA.settings.cats||{}).length){
    const cats={};
    for(const [g,list] of Object.entries(F_CAT_SEED)){
      cats[g]={};
      list.forEach(([name,ic],i)=>{cats[g][`${g}${i+1}`]={id:`${g}${i+1}`,name,icon:ic||'box'};});
    }
    DATA.settings.cats=cats;
  }
  if(!S.ui.fMfs) S.ui.fMfs='in';
  /* ডিফল্ট MFS অ্যাকাউন্ট (একবারই) */
  if(!DATA.settings.mfsAccounts||!Object.keys(DATA.settings.mfsAccounts).length){
    DATA.settings.mfsAccounts={
      mfs_bkash:{id:'mfs_bkash',provider:'bkash',number:'01700000000',holder:'আইডিয়া প্রিন্টিং',type:'merchant',opening:0,createdAt:new Date().toISOString()},
      mfs_nagad:{id:'mfs_nagad',provider:'nagad',number:'01600000000',holder:'আইডিয়া প্রিন্টিং',type:'personal',opening:0,createdAt:new Date().toISOString()}
    };
  }
  /* পুরোনো ডিফল্ট নাম → নতুন ফিক্সড নাম (একবারই) */
  try{
    const RENAME={'বেতন':'কর্মচারীর বেতন','কর্মচারী খরচ':'কর্মচারীর খরচ','দোকান ভাড়া':'দোকান ভাড়া','বিদ্যুৎ বিল':'Uttility বিল','দৈনিক খরচ':'দৈনিক খরচ','বেতন ও মজুরি':'কর্মচারীর বেতন','বিদ্যুৎ, গ্যাস ও পানি':'Uttility বিল'};
    const ex=(DATA.settings.cats||{}).expense||{};
    for(const k of Object.keys(ex)){
      const v=ex[k]; const nm=typeof v==='string'?v:(v&&v.name);
      if(nm&&RENAME[nm]&&RENAME[nm]!==nm){
        if(typeof v==='string') ex[k]=RENAME[nm]; else v.name=RENAME[nm];
      }
    }
    /* পুরোনো খরচের এন্ট্রিতেও নাম আপডেট */
    try{
      for(const e of vals(DATA.expenses)){
        if(e.catName&&RENAME[e.catName]) e.catName=RENAME[e.catName];
      }
    }catch(e2){}
  }catch(e){}

  /* ৬) রেন্ডারের পরে DOM পোস্ট-প্রসেস (রসিদ বাটন ইত্যাদি) */
  F_ORIG.render=render;
  render=function(){F_ORIG.render();fPostRender();setTimeout(()=>{try{fEnsureBellBar();}catch(e){}},0);};

  /* ৭) ইনপুট ইভেন্ট — ছবি প্রিভিউ ও একক সার্চ */
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.closest&&t.closest('form[data-form="sale"]')&&t.matches('input[name=qtySold],input[name=unitPrice],input[name=discountPct]')){
      if(t.matches('input[name=unitPrice]')) t.form.dataset.priceDirty='1';
      try{fSaleLive();}catch(err){}
    }
    if(t.matches('[data-fexp-search]')){
      S.ui.expCatSearch=t.value;
      document.querySelectorAll('.content .cat-tile').forEach(tile=>{
        const name=(tile.dataset.item||'').toLowerCase();
        tile.style.display=(!t.value.trim()||name.includes(t.value.trim().toLowerCase())||!tile.dataset.item)?'':'none';
      });
      return;
    }
    if(t.matches('[data-fsearch]')){
      const q=t.value.trim().toLowerCase();
      document.querySelectorAll('#modal-root .unit-group').forEach(gr=>{
        let shown=0;
        gr.querySelectorAll('.unit-chip').forEach(ch=>{
          const ok=!q||ch.textContent.toLowerCase().includes(q);
          ch.style.display=ok?'':'none';if(ok) shown++;
        });
        gr.style.display=shown?'':'none';
      });
    }
  });

  /* ৭) টগল / ফাইল / ন্যাভ ট্যাব */
  document.addEventListener('change',async e=>{
    const t=e.target;
    if(t.matches('[data-fset]')){
      t.closest('.tgl')?.classList.toggle('on',t.checked);
      await fSetSave(t.dataset.fset,t.checked?'1':'');
      return;
    }
    if(t.matches('[data-fset-val]')){await fSetSave(t.dataset.fsetVal,t.value);return;}
    if(t.matches('[data-fset-num]')){await fSetSave(t.dataset.fsetNum,t.value===''?'':n(t.value));return;}
    if(t.closest&&t.closest('form[data-form="sale"]')&&t.matches('select[name=dispatchId],select[name=semiItemId],select[name=locationId]')){
      t.form.dataset.priceDirty='';
      try{fSaleLive();}catch(err){} return;
    }
    if(t.matches('[data-fimg]')){
      const file=t.files?.[0];if(!file) return;
      const box=t.closest('.img-up');const prev=box?.querySelector('.img-prev');
      const reader=new FileReader();
      reader.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const max=320,sc=Math.min(1,max/Math.max(img.width,img.height));
          const cv=document.createElement('canvas');
          cv.width=Math.max(1,Math.round(img.width*sc));cv.height=Math.max(1,Math.round(img.height*sc));
          cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
          const data=cv.toDataURL('image/jpeg',0.72);
          S._tmp=S._tmp||{};S._tmp.img=data;
          if(prev){prev.src=data;prev.classList.remove('hide');}
          toast('ছবি যোগ হয়েছে','good');
        };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
      return;
    }
  },false);

  /* ৮) ফর্ম সাবমিট (নতুন ফর্মগুলো) */
  document.addEventListener('submit',async e=>{
    const form=e.target.closest('form[data-form]');
    if(!form) return;
    const name=form.dataset.form;
    if(!['fcat','funit','fentity','fexpense','forder','fextra','fsign','fmfs','fmfsacct','sale'].includes(name)) return;
    e.preventDefault();e.stopPropagation();
    const fd=new FormData(form);const g=k=>String(fd.get(k)??'').trim();const v=k=>n(fd.get(k));
    try{
      if(name==='fcat'){
        if(!g('name')) throw new Error('ক্যাটাগরির নাম দিন');
        const grp=g('group')||'expense';
        const nm=g('name');const fixedWarn=fIsFixedCat(nm);
        await fCatSave(grp,nm,g('icon'));
        closeModal();
        toast(fixedWarn?'যোগ হয়েছে — এই নামটি ফিক্সড তালিকায়ও আছে':'ক্যাটাগরি যোগ হয়েছে','good');
        if(grp==='expense'){render();return;}
        return openSettingsScreen(grp);
      }
      if(name==='funit'){
        const kind=g('kind')||'count',id=g('unit').trim();
        if(!id) throw new Error('এককের নাম দিন');
        const cur=fUnits(kind)||F_UNIT_DEFAULT[kind].map(([i,l])=>({id:i,label:l}));
        if(cur.some(u=>u.id===id)) throw new Error('এই একক আগে থেকেই আছে');
        const obj={};for(const u of cur) obj[u.id]=u.label||u.id;
        obj[id]=g('label')||id;
        if(S.mode==='firebase'&&FB.db) await FB.mods.set(FB.mods.ref(FB.db,`ips/settings/units/${kind}`),obj);
        else {setPath(DATA,`settings/units/${kind}`,obj);persistDemo();}
        closeModal();toast('একক যোগ হয়েছে','good');return openUnitsModal();
      }
      if(name==='sale'){
        const mode=g('mode')||'fg';
        const qty=v('qtySold'),ret=v('qtyReturned'),discPct=Math.min(100,Math.max(0,n(fd.get('discountPct'))));
        if(qty<=0) throw new Error('সঠিক বিক্রীত পরিমাণ দিন');
        const loc=g('locationId')||S.loc||vals(DATA.locations)[0]?.id||'';
        let price=v('unitPrice');
        let productId='',itemId='',title='',con,cost=0,targetLoc=loc;
        if(mode==='fg'){
          const d=byId('dispatches',g('dispatchId'));
          if(!d) throw new Error('ডেলিভারি নির্বাচন করুন');
          const bal=dispatchBalance(d);
          if(qty+ret>bal+0.001) throw new Error(`ডেলিভারি ব্যালেন্স ${fmtNum(bal)} — এর বেশি বিক্রয় সম্ভব নয়`);
          productId=d.productId;title=productName(productId);targetLoc=d.toLocationId;
          if(!price) price=n(byId('products',productId)?.price);
          con=planConsume('fg',productId,targetLoc,qty);
          cost=con.cost;
          if(con.short>0.0001) cost=round2(cost+con.short*n(d.unitCost));
        }else{
          itemId=g('semiItemId');
          if(!itemId) throw new Error('সেমি-ফিনিশড মাল নির্বাচন করুন');
          title=itemName(itemId);
          if(!price) price=n(byId('items',itemId)?.semiPrice);
          con=planConsume('semi',itemId,loc,qty);
          if(con.short>0.0001) throw new Error(`সেমি স্টকে যথেষ্ট নেই — আছে ${fmtNum(semiQty(itemId,loc),1)}`);
          cost=con.cost;
        }
        if(!price||price<=0) throw new Error('বিক্রয় দর দিন');
        const unitCost=round2(cost/Math.max(qty,0.0001));
        if(fBool('sale/noBelowCost',false)&&price<unitCost-0.01)
          throw new Error(`ক্রয় মূল্যের (${tk(unitCost)}) নিচে বিক্রি বন্ধ আছে — দর বাড়ান`);
        const extrasOn=fd.get('applyExtra')!==null&&fExtraCharges().some(e=>e.kind!=='purchase');
        const extraTotal=extrasOn?round2(sum(fExtraCharges().filter(e=>e.kind!=='purchase'),'amount')):0;
        const deduct=fBool('sale/deductExtra',false);
        let expected=round2(qty*price*(1-discPct/100));
        if(extraTotal) expected=deduct?round2(expected-extraTotal):round2(expected+extraTotal);
        const actual=fd.get('actual')===''?expected:v('actual');
        const variance=round2(expected-actual);
        const rec=planAdd('sales',{type:mode==='semi'?'semi':'fg',date:g('date')||todayISO(),
          dispatchId:mode==='fg'?g('dispatchId'):'',
          productId,itemId:mode==='semi'?itemId:'',
          qtySold:qty,qtyReturned:ret,unitPrice:price,discountPct:discPct,extraCharge:extraTotal,
          expected,actual,variance,cost,locationId:targetLoc,repId:g('repId'),note:g('note'),
          party:(S._party&&S._party.name)||'',phone:(S._party&&S._party.phone)||'',
          status:variance?'pending':'approved'});
        await batch([...con.updates,rec]);
        closeModal();
        toast(variance?'বিক্রয় সংরক্ষিত — ব্যবধান অনুমোদনের অপেক্ষায়':'বিক্রয় সম্পন্ন','good');
        if(fBool('sale/autoPrint',false)||fBool('invoice/printAfterSale',false)) setTimeout(()=>fPrintReceipt('sale',rec.id),400);
        return;
      }
      if(name==='fmfsacct'){
        if(!g('number')) throw new Error('মোবাইল নম্বর দিন');
        const id='ma_'+Date.now().toString(36);
        const rec={id,provider:g('provider')||'bkash',number:g('number'),holder:g('holder'),
          type:g('type')||'personal',opening:v('opening'),locationId:g('location')||S.loc||'',
          createdAt:new Date().toISOString(),createdBy:ROLE_NAMES[S.role]||S.role};
        setPath(DATA,'settings/mfsAccounts/'+id,rec);
        if(v('opening')>0){
          const op=planAdd('mfs',{kind:'in',date:todayISO(),provider:rec.provider,accountId:id,amount:v('opening'),
            commission:0,phone:rec.number,note:'প্রারম্ভিক ব্যালেন্স',payment:'cash',status:'approved',
            createdBy:ROLE_NAMES[S.role]||S.role});
          setPath(DATA,'mfs/'+op.id,op.value);
          if(S.mode==='firebase'&&FB.db&&FB.mods){try{await FB.mods.set(FB.mods.ref(FB.db,'ips/mfs/'+op.id),op.value);}catch(e){fQueueWrite({['mfs/'+op.id]:op.value});}}
        }
        if(S.mode==='firebase'&&FB.db&&FB.mods){
          try{ await FB.mods.set(FB.mods.ref(FB.db,'ips/settings/mfsAccounts/'+id),rec); }
          catch(e){
            fQueueWrite({['settings/mfsAccounts/'+id]:rec});
            toast('Firebase-এ সেভ হয়নি — অ্যাপে যোগ হয়েছে, পরে সিঙ্ক হবে','bad');
          }
        }else{persistDemo();}
        form.reset();toast('MFS অ্যাকাউন্ট যোগ হয়েছে','good');
        if(S.page==='mfs') render();
        return;
      }
      if(name==='fmfs'){
        if(v('amount')<=0) throw new Error('সঠিক অ্যামাউন্ট দিন');
        const kind=g('kind')||'in';
        if(!g('account')) throw new Error('আগে একটি MFS অ্যাকাউন্ট যোগ করুন');
        const st=S.mode==='firebase'?'pending':'approved';
        const rec=planAdd('mfs',{kind,date:todayISO(),provider:g('provider')||'bkash',accountId:g('account'),amount:v('amount'),
          commission:v('commission'),phone:g('phone'),note:g('note'),contact:g('contact'),
          payment:g('payment')||'cash',status:st,createdBy:ROLE_NAMES[S.role]||S.role});
        await batch([rec]);
        toast(fMfsKindLabel(kind)+' সংরক্ষিত হয়েছে','good');
        form.reset();
        fMfsSyncProvider(form.closest('.card')||form);
        if(S.page==='mfs') render();
        return;
      }
      if(name==='fsign'){
        if(!S._tmp?.img) throw new Error('স্বাক্ষরের ছবি আপলোড করুন');
        await fSetSave('invoice/signature',S._tmp.img);
        S._tmp={};closeModal();toast('স্বাক্ষর সংরক্ষিত হয়েছে','good');return;
      }
      if(name==='fentity'){
        const kind=g('kind')==='item'?'item':'product',id=g('id');
        if(!g('name')) throw new Error('নাম দিন');
        const coll=kind==='item'?'items':'products';
        const patch={name:g('name'),barcode:g('barcode'),brand:g('brand'),category:g('category'),
          unit:g('unit')||(kind==='item'?'kg':'pcs'),mrp:v('mrp'),wholesale:v('wholesale'),
          cost:v('cost'),marginPct:v('marginPct'),minQty:v('minQty'),note:g('note')};
        if(S._tmp?.img) patch.img=S._tmp.img;
        if(kind==='item') patch.semiPrice=v('price'); else patch.price=v('price');
        if(id){
          await saveEntity(coll,id,patch);
        }else{
          const rec=planAdd(coll,patch);
          patch.id=rec.id;
          const opening=v('opening');
          const loc=S.loc||vals(DATA.locations)[0]?.id||'';
          const extra=[];
          if(opening>0&&loc){
            extra.push(kind==='item'
              ? planAddLot('raw',{itemId:rec.id,qty:opening,remaining:opening,rate:v('cost'),transport:0,loading:0,locationId:loc,date:todayISO(),note:'প্রারম্ভিক স্টক'})
              : planAddLot('fg',{productId:rec.id,qty:opening,remaining:opening,unitCost:v('cost'),locationId:loc,date:todayISO(),note:'প্রারম্ভিক স্টক'}));
          }
          await batch([rec,...extra]);
        }
        S._tmp={};S._party=null;closeModal();toast('সংরক্ষিত হয়েছে','good');return;
      }
      if(name==='fexpense'){
        const catName=g('catName')||'অন্যান্য';
        const mode=fCatMode(catName);
        if(v('amount')<=0) throw new Error('সঠিক পরিমাণ দিন');
        if(fBool('expense/requireReceipt',false)&&!S._tmp?.img) throw new Error('রসিদের ছবি আপলোড করুন');
        const emp=byId('employees',g('employeeId'));
        if(mode==='salary'&&!emp) throw new Error('কর্মচারী বেছে নিন');
        const methodMap={cash:'নগদ',bkash:'বিকাশ',nagad:'নগদ (Nagad)',rocket:'রকেট',bank:'ব্যাংক অ্যাকাউন্ট',due:'বাকি'};
        /* স্বয়ংক্রিয় বিবরণ — ক্যাটাগরি অনুযায়ী */
        const mo=g('salaryMonth')||g('rentMonth')||g('billMonth')||monthKey(g('date')||todayISO());
        let autoDesc='';
        if(mode==='salary'&&emp) autoDesc=`${emp.name} — ${monthLabel(mo)} বেতন`;
        else if(mode==='rent') autoDesc=`দোকান ভাড়া (${F_RENT_MODE[g('rentMode')]||'মাসিক'}) — ${monthLabel(mo)}`;
        else if(mode==='bill'){
          const bn=/uttility|utility/i.test(catName)?catName:`${F_BILL_TYPE[g('billType')]||'বিদ্যুৎ'} বিল`;
          autoDesc=`${bn} — ${monthLabel(mo)}${g('meterNo')?' · মিটার '+g('meterNo'):''}`;
        }
        else if(mode==='staff'&&emp) autoDesc=`${emp.name} — ${F_STAFF_KIND[g('staffKind')]||'কর্মচারী খরচ'}`;
        else if(mode==='daily') autoDesc=`${F_DAILY_KIND[g('dailyKind')]||'দৈনিক খরচ'}${g('spentBy')?' — '+g('spentBy'):''}`;
        else autoDesc=`${catName}`;
        const rec=planAdd('expenses',{date:g('date')||todayISO(),category:fCatCode(catName),catName,
          description:g('description')||autoDesc,
          amount:v('amount'),paidBy:emp?emp.name:(g('spentBy')||ROLE_NAMES[S.role]||S.role),
          salaryMonth:(mode==='salary')?(g('salaryMonth')||''):(g('staffMonth')||''),
          salaryBase:mode==='salary'?v('salaryBase'):0,presentDays:mode==='salary'?v('presentDays'):0,
          bonusAmt:mode==='salary'?v('bonusAmt'):0,deductAmt:mode==='salary'?v('deductAmt'):0,
          staffKind:mode==='staff'?g('staffKind'):'',rentMode:mode==='rent'?g('rentMode'):'',
          landlord:mode==='rent'?g('landlord'):'',shopLocId:mode==='rent'?g('shopLoc'):'',
          billType:mode==='bill'?g('billType'):'',meterNo:mode==='bill'?g('meterNo'):'',
          billUnits:mode==='bill'?g('units'):'',dailyKind:mode==='daily'?g('dailyKind'):'',
          payMethod:g('method')||'cash',
          payMethodName:methodMap[g('method')||'cash']||'নগদ',payRef:g('payRef')||'',
          locationId:mode==='rent'&&g('shopLoc')?g('shopLoc'):(S.loc||vals(DATA.locations)[0]?.id||''),status:'pending',
          note:g('method')==='bank'?'ব্যাংক অ্যাকাউন্ট':'নগদ',employeeId:g('employeeId')||'',img:S._tmp?.img||''});
        const autoOk=fBool('expense/autoApprove',false)&&(fNum('expense/autoLimit',0)<=0||v('amount')<=fNum('expense/autoLimit',0));
        if(autoOk){
          rec.value.status='approved';rec.value.approvedBy='স্বয়ংক্রিয়';rec.value.approvedAt=new Date().toISOString();
        }
        await batch([rec]);S._tmp={};closeModal();
        toast(autoOk?'খরচ স্বয়ংক্রিয়ভাবে অনুমোদিত হয়েছে':'খরচ জমা হয়েছে — অনুমোদনের অপেক্ষায়','good');return;
      }
      if(name==='fextra'){
        if(!g('name')||v('amount')<=0) throw new Error('নাম ও পরিমাণ দিন');
        const id='x_'+Date.now().toString(36);
        const rec={id,name:g('name'),amount:v('amount'),kind:g('kind')||'sale',active:true};
        if(S.mode==='firebase'&&FB.db) await FB.mods.set(FB.mods.ref(FB.db,'ips/settings/set/extraCharges/'+id),rec);
        else {setPath(DATA,`settings/set/extraCharges/${id}`,rec);persistDemo();}
        closeModal();toast('অতিরিক্ত চার্জ যোগ হয়েছে','good');return openExtraCharges();
      }
      if(name==='forder'){
        const qty=v('qty'),rate=v('rate'),disc=v('discount');
        if(!g('party')) throw new Error('পার্টির নাম দিন');
        if(!g('refId')||qty<=0) throw new Error('পণ্য ও পরিমাণ দিন');
        const rec=planAdd('orders',{no:g('no')||fOrderNo(),kind:g('kind')||'sale',date:g('date')||todayISO(),
          party:g('party'),phone:g('phone'),refId:g('refId'),title:fRefName(g('refId')),qty,rate,discount:disc,
          total:round2(qty*rate-disc),advance:v('advance'),deliverDate:g('deliverDate'),note:g('note'),
          delivered:false,createdBy:ROLE_NAMES[S.role]||S.role});
        await batch([rec]);closeModal();toast('অর্ডার সংরক্ষিত হয়েছে','good');return;
      }
    }catch(err){toast(err?.message||'সংরক্ষণ ব্যর্থ','bad');}
  },true);

  /* ৯) ফিক্সড বেল আইকন — রেন্ডারের পরে একবার */
  setTimeout(()=>{try{fEnsureBellBar();}catch(e){}},0);
  setTimeout(()=>{try{fResumeTrack();}catch(e){}},1500);
  window.addEventListener('resize',()=>{try{fEnsureBellBar();}catch(e){}},{passive:true});
  /* নতুন নোটিফিকেশন এলে বেল আবার বাউন্স করবে (প্রতি ৩০ সেকেন্ডে চেক) */
  setInterval(()=>{try{fEnsureBellBar()}catch(e){}},30000);
}

/* ---------- র‍্যাপারগুলো ---------- */
function fHandleWrapper(act,el){
  switch(act){
    case 'f-screen': return openSettingsScreen(el.dataset.item);
    case 'f-geoloc': return fOpenLiveLoc(el.dataset.id);
    case 'f-geo-now': return fLocNow(el.dataset.id);
    case 'f-geo-track': {
      const id=el.dataset.id;
      if(F_GEO.watchId!=null&&F_GEO.empId===id){ fStopTrack(id); toast('ট্র্যাকিং বন্ধ হয়েছে','info'); }
      else { fStartTrack(id,false); }
      return;
    }
    case 'add-raw':
      if(fBool('purchase/partyFirst',false)&&S._partyGate!==true){
        return fPartyGate('purchase',(p)=>{S._partyGate=true;fRenderRawModal(p);S._partyGate=false;});
      }
      return fRenderRawModal();
    case 'add-sale':
      if(fBool('sale/partyFirst',false)&&S._partyGate!==true){
        return fPartyGate('sale',()=>{S._partyGate=true;fRenderSaleModal(el.dataset.id||'');S._partyGate=false;});
      }
      return fRenderSaleModal(el.dataset.id||'');
    case 'f-sale-mode': {
      const mode=el.dataset.item==='semi'?'semi':'fg';
      const root=$('#modal-root');if(!root) return;
      root.querySelectorAll('.ftabs button').forEach(b=>b.classList.toggle('active',b.dataset.item===mode));
      const fg=root.querySelector('[data-fsale-fg]'),se=root.querySelector('[data-fsale-semi]');
      if(fg) fg.classList.toggle('hide',mode!=='fg');
      if(se) se.classList.toggle('hide',mode==='fg');
      const m=root.querySelector('input[name=mode]');if(m) m.value=mode;
      const f=root.querySelector('form[data-form="sale"]'); if(f){f.dataset.priceDirty=''; try{fSaleLive();}catch(err){}}
      return;
    }
    case 'f-units': return openUnitsModal();
    case 'f-extra': return openExtraCharges();
    case 'f-extra-del': {
      if(!confirm('এই ডিফল্ট চার্জ মুছবেন?')) return;
      const id=el.dataset.id;
      if(S.mode==='firebase'&&FB.db) FB.mods.remove(FB.mods.ref(FB.db,'ips/settings/set/extraCharges/'+id));
      delPath(DATA,`settings/set/extraCharges/${id}`);persistDemo();
      toast('মুছে ফেলা হয়েছে','good');return openExtraCharges();
    }
    case 'f-color': {
      const v=el.dataset.id==='default'?'#15803d':el.dataset.id;
      return fSetSave('invoice/color',v);
    }
    case 'f-color-open': return openModal({title:'ইনভয়েস কালার',sub:'প্রতি প্রিন্টে এক কালার — বিক্রয়, ক্রয়, অর্ডার ও বাকি রসিদে',wide:true,submit:'বন্ধ করুন',body:fColorPicker()});
    case 'f-sign': return openSignatureModal();
    case 'f-cat-add': return openCatAdd(el.dataset.item||'expense');
    case 'f-cat-del': {
      const g=el.dataset.item,id=el.dataset.id;
      if(g==='expense'){
        const rec=(DATA.settings?.cats?.expense||{})[id];
        const nm=rec?(typeof rec==='string'?rec:rec.name):'';
        if(fIsFixedCat(nm)||!id){toast('এই ৫টি ক্যাটাগরি ফিক্সড — মুছা যাবে না','bad');return;}
      }
      if(!confirm('ক্যাটাগরি মুছবেন?')) return;
      if(S.mode==='firebase'&&FB.db) FB.mods.remove(FB.mods.ref(FB.db,`ips/settings/cats/${g}/${id}`));
      delPath(DATA,`settings/cats/${g}/${id}`);persistDemo();
      toast('ক্যাটাগরি মুছে ফেলা হয়েছে','good');return openSettingsScreen(g);
    }
    case 'f-new-expense': return fRenderNewExpense(el.dataset.item||'');
    case 'add-expense': return fRenderNewExpense('');
    case 'f-expense-book': return fOpenExpenseBook();
    case 'f-exp-book-month': {
      const cur=S.ui.expMonth||todayISO().slice(0,7);
      const [y,m]=cur.split('-').map(Number);
      const d=new Date(y,m-1+(el.dataset.item==='next'?1:-1),1);
      S.ui.expMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      return fOpenExpenseBook();
    }
    case 'f-exp-cat': S.ui.expCatFilter=el.dataset.item||'';return render();
    case 'f-new-item': return openEntityForm('item','');
    case 'f-edit-item': return openEntityForm('item',el.dataset.id||'');
    case 'f-new-product': return openEntityForm('product','');
    case 'f-edit-product': return openEntityForm('product',el.dataset.id||'');
    case 'f-unit-del': {
      const kind=el.dataset.item,id=el.dataset.id;
      if(!fUnits(kind)){toast('ডিফল্ট একক মুছতে হলে আগে একটি কাস্টম একক যোগ করুন','bad');return;}
      if(S.mode==='firebase'&&FB.db) FB.mods.remove(FB.mods.ref(FB.db,`ips/settings/units/${kind}/${id}`));
      delPath(DATA,`settings/units/${kind}/${id}`);persistDemo();return openUnitsModal();
    }
    case 'f-order-new': {
      const kind=el.dataset.kind==='purchase'?'purchase':'sale';
      if(fBool('order/customerFirst',false)&&S._partyGate!==true){
        return fPartyGate('order',(p)=>{S._partyGate=true;openOrderModal(kind,p);S._partyGate=false;});
      }
      return openOrderModal(kind);
    }
    case 'f-order-view': return openOrderView(el.dataset.id);
    case 'f-order-deliver': {
      batch([planUpdate('orders',el.dataset.id,{delivered:true,deliveredAt:new Date().toISOString()})]);
      closeModal();toast('ডেলিভারি সম্পন্ন হিসেবে চিহ্নিত','good');return;
    }
    case 'f-mfs': return openMfsModal(el.dataset.item||'in');
    case 'f-mfs-tab': S.ui.fMfsKindPage=el.dataset.item;S.ui.fMfs=el.dataset.item;return render();
    case 'f-mfs-range': S.ui.fMfsRange=el.dataset.item;return openMfsModal(S.ui.fMfs||'in');
    case 'f-mfs-sync': return fSyncMfsPending();
    case 'f-mfs-quick': {
      const id=el.dataset.id, kind=el.dataset.kind||'in';
      const a=(DATA.settings?.mfsAccounts||{})[id];
      S.ui.fMfsKindPage=kind;
      S._mfsPrefill={accountId:id,provider:a?a.provider:'bkash',kind};
      render();
      setTimeout(()=>{
        const card=$('.content [data-form="fmfs"]');
        if(!card) return;
        const p=card.querySelector('select[name=provider]');
        if(p&&a){p.value=a.provider;fMfsSyncProvider(card);}
        const ac=card.querySelector('select[name=account]');
        if(ac&&a){ac.value=id;}
        const ph=card.querySelector('input[name=phone]');
        if(ph&&a&&!ph.value) ph.value=a.number;
        const am=card.querySelector('input[name=amount]');
        if(am) am.focus({preventScroll:false});
        card.scrollIntoView({behavior:'smooth',block:'center'});
      },80);
      return;
    }
    case 'f-mfs-acct-del': {
      const id=el.dataset.id;
      if(!confirm('এই MFS অ্যাকাউন্ট মুছবেন? পুরোনো লেনদেনের হিসাব থাকবে।')) return;
      if(S.mode==='firebase'&&FB.db) FB.mods.remove(FB.mods.ref(FB.db,'ips/settings/mfsAccounts/'+id));
      delPath(DATA,'settings/mfsAccounts/'+id);persistDemo();
      toast('অ্যাকাউন্ট মুছে ফেলা হয়েছে','good');return render();
    }
    case 'f-print': return fPrintReceipt(el.dataset.kind||'sale',el.dataset.id);
    case 'f-share': return fShareReceipt(el.dataset.kind||'sale',el.dataset.id);
    case 'f-bell': return fNotifications();
    case 'f-bell-newwork': { closeModal(); return fHandleWrapper('add-sale',{dataset:{}}); }
    case 'f-bell-goto': { closeModal(); return go(el.dataset.page||'dashboard'); }
    case 'f-setup-hub': return go('setup');
    default: return F_ORIG.handleAction(act,el);
  }
}

const F_CAT_ART = {
  'কর্মচারীর খরচ':{bg:'#eef7f1',accent:'#0f766e',label:'STAFF'},
  'কর্মচারীর বেতন':{bg:'#e8f8ee',accent:'#16a34a',label:'বেতন'},
  'দৈনিক খরচ':{bg:'#eef6ff',accent:'#0ea5e9',label:'DAILY'},
  'দোকান ভাড়া':{bg:'#fdf3e6',accent:'#d97706',label:'RENT'},
  'Uttility বিল':{bg:'#eef3ff',accent:'#2563eb',label:'BILL'},
  'বেতন':{bg:'#e8f8ee',accent:'#16a34a',label:'বেতন'},
  'বিদ্যুৎ বিল':{bg:'#eef3ff',accent:'#2563eb',label:'BILL'},
  'কর্মচারী খরচ':{bg:'#eef7f1',accent:'#0f766e',label:'STAFF'}
};
function fCatArt(name){
  /* আগে ফিক্সড/পুরো মিল, তারপর আংশিক */
  const nm=String(name||'');
  let key=F_CAT_ART[nm]?nm:Object.keys(F_CAT_ART).find(k=>nm&&nm.includes(k.slice(0,4)));
  if(!key&&/বিদ্যুৎ|বিল|utility/i.test(nm)) key='Uttility বিল';
  if(!key&&/ভাড়া/.test(nm)) key='দোকান ভাড়া';
  if(!key&&/বেতন/.test(nm)) key='কর্মচারীর বেতন';
  if(!key&&/কর্মচারী/.test(nm)) key='কর্মচারীর খরচ';
  const cfg=F_CAT_ART[key]||{bg:'#f1f6f2',accent:'#14603a',label:'খরচ'};
  const a=cfg.accent,b=cfg.bg;
  const label=esc(cfg.label);
  return `<svg viewBox="0 0 64 64" width="54" height="54" aria-hidden="true">
    <rect x="6" y="10" width="52" height="44" rx="9" fill="${b}"/>
    <rect x="10" y="14" width="44" height="36" rx="7" fill="#fff" stroke="${a}" stroke-width="1.6" opacity=".95"/>
    <rect x="10" y="14" width="44" height="9" rx="4" fill="${a}" opacity=".18"/>
    <text x="32" y="40" text-anchor="middle" font-size="9.5" font-weight="700" fill="${a}" font-family="Inter,Arial" letter-spacing=".5">${label}</text>
    <circle cx="46" cy="18" r="4.4" fill="${a}"/>
    <path d="M44 18h4M46 16v4" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="16" cy="44" r="3.4" fill="${a}" opacity=".75"/>
    <path d="M14.6 44l1 1 2-2.2" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </svg>`;
}
const fCatMoney = {};
function fRenderExpenses(){
  const month=todayISO().slice(0,7);
  const statusFilter=S.ui.expStatus||'all';
  const search=(S.ui.expCatSearch||'').trim().toLowerCase();
  const allCats=fSortCats(fCats('expense'));

  const present=allCats.map(c=>c.name);
  const missing=F_EXP_FIXED_CATS.filter(nm=>!present.includes(nm));
  const cats=missing.length?fSortCats(allCats.concat(missing.map(nm=>({id:'',name:nm,icon:F_CAT_ICON[nm]||'wallet',fixed:true})))):allCats;
  const all=vals(DATA.expenses).filter(x=>!S.loc||x.locationId===S.loc);
  const monthList=all.filter(x=>!month||monthKey(x.date)===month);
  const count={},amount={};
  for(const x of monthList){
    const k=x.catName||expenseCatName(x.category)||'অন্যান্য';
    count[k]=(count[k]||0)+1;amount[k]=(amount[k]||0)+n(x.amount);
  }
  fCatMoney.expense=amount;
  /* ম্যাপিং: ক্যাটাগরি নাম → খরচের কোড */
  const codeOf=name=>{
    const m=EXPENSE_CATS.find(([,nm])=>nm===name||nm.includes(name)||name.includes(nm.slice(0,3)));
    return m?m[0]:'6180';
  };
  /* ---- ১) মোবাইল অ্যাপের মতো ক্যাটাগরি স্ক্রিন ---- */
  const shown=cats.filter(c=>!search||String(c.name).toLowerCase().includes(search));
  const catScreen=`<div class="card">
    <div class="card-head" style="margin-bottom:10px">
      <div><h2>${icon('wallet')} খরচ</h2><p>খরচের এন্ট্রি জন্য ক্যাটাগরি</p></div>

      <button class="btn btn-primary" type="button" data-act="f-expense-book" style="flex:1 1 150px;background:#ea580c;border-color:#ea580c">${icon('book','ic-sm')}<span>খরচ খাতা</span></button>
    </div>
    <div class="field no-print" style="margin-bottom:12px">
      <label style="position:relative;display:block">
        <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#6b8577">${icon('search','ic-sm')}</span>
        <input data-fexp-search value="${esc(S.ui.expCatSearch||'')}" placeholder="ক্যাটাগরি খুঁজুন..." style="padding-left:36px;min-height:44px">
      </label>
    </div>
    <div class="cat-grid">
      ${shown.map(c=>{
        const fixed=fIsFixedCat(c.name);
        return `<button type="button" class="cat-tile ${fixed?'cat-fixed':''}" data-act="f-new-expense" data-item="${esc(c.name)}" style="align-items:center;gap:9px;min-height:132px">
        ${fCatArt(c.name)}
        <b style="font-size:13.5px">${esc(c.name)}</b>
        <small>${fmtNum(count[c.name]||0)} এন্ট্রি · ${tk(amount[c.name]||0)}</small>
        ${fixed?`<span class="cat-lock" title="ফিক্সড ক্যাটাগরি — মুছা যাবে না">${icon('check','ic-sm')}</span>`
               :`<span class="cat-x" role="button" data-act="f-cat-del" data-item="expense" data-id="${esc(c.id)}" title="মুছুন">×</span>`}
      </button>`;}).join('')}
    </div>
    ${shown.length?'':`<div class="small muted mt12">“${esc(S.ui.expCatSearch||'')}” নামে কোনো ক্যাটাগরি নেই — নতুন ক্যাটাগরি যোগ করুন।</div>`}
    <div class="small muted mt12">মোট ${fmtNum(cats.length)}টি ক্যাটাগরি · ${monthLabel(month)}-এ ${fmtNum(monthList.length)}টি এন্ট্রি · ${tk(sum(monthList,'amount'))}</div>
  </div>`;
  /* ---- ২) মূল খরচ পেজ (KPI, ফিল্টার, তালিকা) — আগের মতোই ---- */
  let html=F_ORIG.renderExpenses();
  html=html.replace(/data-act="add-expense"/g,'data-act="f-new-expense"');
  html=html.split('খরচ যোগ করুন').join('নতুন খরচ');
  /* ক্যাটাগরি অনুযায়ী ফিল্টার চিপ */
  const activeCat=S.ui.expCatFilter||'';
  const chips=`<div class="card no-print" style="padding:10px 12px;margin:-4px 0 0"><div class="chips">
      <button type="button" class="chip ${activeCat?'':'active'}" data-act="f-exp-cat" data-item="">সব ক্যাটাগরি</button>
      ${cats.map(c=>`<button type="button" class="chip ${activeCat===c.name?'active':''}" data-act="f-exp-cat" data-item="${esc(c.name)}">${esc(c.name)}</button>`).join('')}
    </div></div>`;
  /* তালিকা ফিল্টার করা নাম বসানো */
  if(activeCat){
    html=html.replace(/(<div class="table-wrap"><table class="tbl">)/, `$1`);
  }
  return html.replace('<div class="stack">','<div class="stack">'+catScreen+chips);
}
/* খরচ খাতা — ক্যাটাগরি/তারিখ অনুযায়ী পূর্ণ তালিকা */
function fOpenExpenseBook(){
  const month=S.ui.expMonth||todayISO().slice(0,7);
  const list=vals(DATA.expenses).filter(x=>!S.loc||x.locationId===S.loc).filter(x=>!month||monthKey(x.date)===month)
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const byCat={};
  for(const x of list){
    const k=x.catName||expenseCatName(x.category)||'অন্যান্য';

      <button class="btn btn-sm" type="button" data-act="csv" data-csv="expenses">${icon('download','ic-sm')} CSV</button>
      <button class="btn btn-sm btn-primary" type="button" data-act="f-new-expense" data-item="">${icon('plus','ic-sm')} নতুন খরচ</button>
    </div>
    ${Object.keys(byCat).length?Object.entries(byCat).sort((a,b)=>b[1].amount-a[1].amount).map(([k,v])=>`
      <div class="sec"><div class="sec-head amber">${icon('wallet')}<div><b>${esc(k)}</b><span>${fmtNum(v.count)}টি এন্ট্রি · ${tk(v.amount)}</span></div></div>
        <div class="sec-body" style="padding:0">
          <div class="table-wrap" style="border:0;border-radius:0">
            <table class="tbl compact"><thead><tr>${th('তারিখ')}${th('বিবরণ')}${th('প্রদানকারী')}${th('পরিমাণ','num')}${th('অবস্থা')}</tr></thead>
              <tbody>${v.rows.map(x=>`<tr><td class="nowrap small">${fmtDate(x.date)}</td><td class="t-main">${esc(x.description)}</td>

              <tfoot><tr><td colspan="3">মোট</td><td class="num">${tk(v.amount)}</td><td></td></tr></tfoot>
            </table>
          </div>
        </div></div>`).join(''):emptyState('এই মাসে কোনো খরচ নেই','wallet')}`});
}

async function fSyncMfsPending(){
  await fFlushPendingWrites(false);
  render();
  if(!fPendingWrites().length) toast('সব এন্ট্রি Firebase-এ সিঙ্ক হয়েছে','good');
}
/* ---------- MFS: অপারেটর ↔ অ্যাকাউন্ট মিলিয়ে রাখা ---------- */
function fMfsSyncProvider(root){
  if(!root) return;
  const pSel=root.querySelector('select[name=provider]');
  const aSel=root.querySelector('select[name=account]');
  if(!pSel||!aSel) return;
  const accts=fMfsAccounts();
  const p=pSel.value;
  const mine=accts.filter(a=>a.provider===p);
  const keep=aSel.value;
  aSel.innerHTML=optionList(mine.map(a=>[a.id,`${fMfsProviderName(a.provider)} — ${a.number}${a.holder?' · '+a.holder:''}`]),mine.some(a=>a.id===keep)?keep:(mine[0]?mine[0].id:''),
    mine.length?'':`${fMfsProviderName(p)} নম্বর যোগ করুন`);
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches&&t.matches('select[name=provider]')){
    fMfsSyncProvider(t.closest('.card')||t.closest('form')||document);
  }
  if(t.matches&&t.matches('select[name=account]')){
    const a=(DATA.settings?.mfsAccounts||{})[t.value];
    const pSel=(t.closest('.card')||t.closest('form')||document).querySelector('select[name=provider]');
    if(a&&pSel&&pSel.value!==a.provider){pSel.value=a.provider;}
  }
},true);
function fPostRender(){
  try{
    if(S.page==='expenses'){
      const cat=S.ui.expCatFilter||'';
      if(cat){
        document.querySelectorAll('.content table.tbl tbody tr').forEach(tr=>{
          const txt=tr.innerText||'';
          tr.style.display=txt.includes(cat)?'':'none';
        });
      }
    }
    if(S.page==='sales'){
      document.querySelectorAll('.content table.tbl tbody tr').forEach(tr=>{
        const tds=tr.querySelectorAll('td');
        if(tds.length!==9) return;
        const last=tds[tds.length-1];
        if(last.querySelector('[data-act="f-print"]')) return;
        const id=tr.getAttribute('data-sid');
        const key=(last.querySelector('[data-id]')||{}).dataset?.id;
        const btn=document.createElement('button');
        btn.className='btn btn-xs';
        btn.setAttribute('data-act','f-print');
        btn.setAttribute('data-kind','sale');
        btn.title='রসিদ প্রিন্ট';
        btn.innerHTML=icon('print','ic-sm');

        if(!box){box=document.createElement('div');box.className='actions';last.textContent='';last.appendChild(box);}

}

      <button type="button" class="hub-card" data-act="f-rules-guide"><span class="hub-ic teal">${icon('toggle')}</span><span class="hub-txt"><b>Firebase Rules বসান</b><span>লাল সতর্কতা এলে ধাপে ধাপে নিয়ম বসানোর গাইড</span></span></button>
    </div></div>`;
  {
    const G='<div class="grid g2">';
    let at=html.indexOf('ব্যবহারকারী ও অনুমতি');
    let pos=-1;
    if(at>=0) pos=html.indexOf(G,at);
    if(pos<0){ const f=html.indexOf(G); pos=f>=0?html.indexOf(G,f+1):-1; }
    if(pos>=0) html=html.slice(0,pos)+hub+html.slice(pos);
    else html=html.replace('<div class="card theme-settings-card">',hub+'<div class="card theme-settings-card">');
  }
  html=html.replace(/data-act="add-product"/g,'data-act="f-new-product"');
  html=html.replace(/data-act="edit-product"/g,'data-act="f-edit-product"');
  html=html.replace(/data-act="add-item"/g,'data-act="f-new-item"');
  html=html.replace(/data-act="edit-item"/g,'data-act="f-edit-item"');
  return html;
}
