<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3d27">
<title>আইডিয়া প্রিন্টিং প্রেস — স্টক, সেলস ও হিসাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f1;--panel:#ffffff;--ink:#15241c;--muted:#6b7b71;--line:#e1e7e0;
  --brand:#14603a;--brand-2:#0f3d27;--brand-soft:#e7f2ea;--brand-line:#c8e2d1;
  --gold:#b7791f;--gold-soft:#fdf5e6;--danger:#b42318;--danger-soft:#fdeceb;
  --warn:#b45309;--warn-soft:#fff4e5;--info:#1d4ed8;--info-soft:#eef2ff;
  --radius:16px;--radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 30px rgba(16,24,40,.05);
  --font:'Hind Siliguri','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.b{font-weight:600}
.strong{font-weight:700}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}
.mono{font-family:'Inter',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb0{margin-bottom:0}
.divider{height:1px;background:var(--line);margin:16px 0}
.shell{min-height:100vh;display:grid;grid-template-columns:256px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#0f3d27 0%,#0b2f1e 100%);color:#e9f3ec;padding:22px 14px 18px;display:flex;flex-direction:column;z-index:60;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand-mark{width:44px;height:44px;border-radius:13px;background:#f7fbf8;color:#0f3d27;display:grid;place-items:center;font-weight:700;font-size:22px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.brand-txt strong{display:block;font-size:15.5px;line-height:1.25;font-weight:700;letter-spacing:.1px}
.brand-txt span{display:block;font-size:11px;color:#a9c9b6;margin-top:2px;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#89ab98;padding:16px 12px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#d7e8dd;font-size:14px;font-weight:500;transition:.15s;position:relative}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:#eaf5ee;color:#0f3d27;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.nav a.active .ic{color:#14603a}
.nav a .ic{width:18px;height:18px;color:#a9c9b6}
.nav-badge{margin-left:auto;background:#f0b54a;color:#2c1c02;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#8fb09d;line-height:1.6}
.side-foot b{color:#d8e9df;display:block;font-weight:600;font-size:12px}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;background:rgba(243,245,241,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px}
.menu-btn{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;place-items:center}
.page-head{min-width:0}
.page-head h1{font-size:19px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.2px}
.page-head p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.loc-select{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12.5px;color:#37473e}
.loc-select .ic{width:15px;height:15px;color:var(--muted)}
.loc-select select{border:0;background:transparent;outline:0;font-size:12.5px;font-weight:600;max-width:145px;padding:1px 2px}
.role-pill,.conn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:#33443a;white-space:nowrap}
.role-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.conn .dot{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
.conn.demo .dot{background:#b7791f;box-shadow:0 0 0 3px rgba(183,121,31,.14)}
.conn.err .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(180,35,24,.12)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;display:grid;place-items:center;color:#405147}
.icon-btn:hover{background:#f7faf7;border-color:#ced9cf}
.content{padding:24px 26px 40px;max-width:1560px;width:100%;margin:0 auto}
.foot{padding:18px 26px 30px;color:#88958c;font-size:11.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1560px;margin:0 auto;width:100%}
.page-enter{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h2{font-size:15px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.card-head h2 .ic{width:17px;height:17px;color:var(--brand)}
.card-head p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.card-body{padding:18px 20px}
.card.flush .card-head{padding:16px 20px 0;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:76px;height:76px;border-radius:50%;background:var(--brand-soft);opacity:.6}
.stat-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);margin-bottom:12px;position:relative;z-index:1}
.stat-label{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.2px;position:relative;z-index:1}
.stat-value{font-size:25px;line-height:1.25;font-weight:700;letter-spacing:-.5px;margin-top:2px;position:relative;z-index:1}
.stat-sub{font-size:11.5px;color:var(--muted);margin-top:4px;position:relative;z-index:1}
.stat-sub.up{color:var(--brand)}
.stat-sub.warn{color:var(--warn)}
.stat.gold .stat-icon{background:var(--gold-soft);color:var(--gold)}
.stat.gold::after{background:var(--gold-soft)}
.stat.blue .stat-icon{background:var(--info-soft);color:var(--info)}
.stat.blue::after{background:var(--info-soft)}
.stat.red .stat-icon{background:var(--danger-soft);color:var(--danger)}
.stat.red::after{background:var(--danger-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;color:#2e4036;transition:.15s;white-space:nowrap}
.btn:hover{background:#f7faf7;border-color:#cbd8cd}
.btn .ic{width:16px;height:16px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:#0f4d2e;border-color:#0f4d2e}
.btn-dark{background:#22342a;border-color:#22342a;color:#fff}
.btn-dark:hover{background:#16251d}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-gold:hover{background:#9c6517}
.btn-danger{background:#fff;border-color:#f1c7c3;color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn-xs{padding:3px 8px;font-size:11.5px;border-radius:7px}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link-btn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;font-size:12.5px}
.link-btn.danger{color:var(--danger)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:4px;background:#eaeee9;padding:4px;border-radius:11px;flex-wrap:wrap;width:fit-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:#5b6b61}
.tabs button.active{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:600;color:#546459}
.chip.active,.chip:hover{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f1f4f0;color:#546459;white-space:nowrap;line-height:1.7}
.badge.green{background:var(--brand-soft);color:#14603a}
.badge.gold{background:var(--gold-soft);color:#8a5a11}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.badge.blue{background:var(--info-soft);color:#1e40af}
.badge.gray{background:#eef1ed;color:#5d6b62}
.badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid #f0d9a8;background:#fffaf0;border-radius:12px;padding:11px 13px;font-size:12.5px;color:#7a4d0a}
.alert .ic{width:17px;height:17px;margin-top:1px}
.alert.red{border-color:#f2c9c5;background:#fff6f5;color:#8f2b21}
.alert.green{border-color:var(--brand-line);background:#f1f8f3;color:#14603a}
.alert.blue{border-color:#cfd9fb;background:#f6f8ff;color:#2743a3}
.stack-alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
table.tbl th{background:#f7f9f6;text-align:left;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#78867d;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.tbl td{padding:9px 12px;border-bottom:1px solid #edf1ec;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:#fafcf9}
table.tbl tfoot td{background:#f7f9f6;font-weight:700;border-top:1px solid var(--line);border-bottom:0}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl .sub{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
table.tbl.compact td{padding:7px 10px}
table.tbl.compact th{padding:7px 10px}
.t-main{font-weight:600;color:#24352b}
.t-sub{font-size:10.5px;color:var(--muted)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:12.5px}
.empty .ic{width:30px;height:30px;margin:0 auto 8px;color:#9eada3}
.table-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0 0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;font-weight:600;color:#53645a}
.field .hint{font-size:10.5px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid #d7e0d8;background:#fff;border-radius:9px;padding:8px 10px;font-size:13px;outline:0;transition:.15s;min-height:38px}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#73b28c;box-shadow:0 0 0 3px rgba(20,96,58,.09)}
.field input:disabled,.field select:disabled{background:#f4f6f3;color:#7c8a81}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form-grid .span2{grid-column:span 2}
.form-grid .span3{grid-column:1/-1}
.form-note{font-size:11.5px;color:var(--muted);line-height:1.55}
.inline-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.inline-form .field{flex:1;min-width:120px}
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-backdrop{position:absolute;inset:0;background:rgba(9,24,16,.52);backdrop-filter:blur(3px)}
.modal{position:relative;background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.25);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease}
.modal.wide{max-width:860px}
@keyframes pop{from{opacity:0;transform:scale(.98) translateY(6px)}to{opacity:1;transform:none}}
.modal-head{padding:18px 20px 13px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.modal-head h3{margin:0;font-size:16px;font-weight:700}
.modal-head p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.modal-head .icon-btn{margin-left:auto;flex:none;width:32px;height:32px;border:0;background:#f2f5f1}
/* মডাল হেডার স্ট্যাট চিপ (বিক্রয় ফর্ম: মজুদ + Total টাকা + ক্রয়/মুনাফা) */
.mh-stat{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto;margin-right:10px;justify-content:flex-end;flex:1;min-width:0}
.mh-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:#eafaf0;border:1px solid #bfe7d2;color:#0f5132;font-size:11.5px;font-weight:600;line-height:1.25;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mh-chip b{font-weight:700;color:#0b6b45}
.mh-total{background:#12432e;border-color:#12432e;color:#eafaf0}
.mh-total b{color:#9ff0c2}
.mh-total .v{font-size:13px;font-weight:800;letter-spacing:.2px}
.mh-cost{background:#eef3fd;border-color:#cfe0fb;color:#1d4ed8}
.mh-cost b{color:#123a8f}
body.theme-glass .mh-chip{background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.22);color:#1e3a8a}
body.theme-glass .mh-chip b{color:#12306e}
body.theme-glass .mh-total{background:#0f172a;border-color:#0f172a;color:#e8eefb}
body.theme-glass .mh-total b{color:#9ff0c2}
body.theme-glass .mh-cost{background:rgba(30,58,138,.07);border-color:rgba(30,58,138,.18);color:#1e3a8a}
body.theme-glass .mh-cost b{color:#12306e}
.mh-chip.mh-cost.neg{background:#fdecec;border-color:#f7c6c6;color:#b91c1c}
.mh-chip.mh-cost.neg b{color:#991b1b}
.mh-chip.mh-cost.neg .v{color:#b91c1c}
.f-auto-hint{display:none}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:8px;background:#fbfcfa}
.modal-foot .left{margin-right:auto;font-size:11.5px;color:var(--muted)}
.cam-box{position:relative;background:#0c1711;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;color:#c9dbd0}
.cam-box video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-box .cam-hint{position:absolute;inset:auto 10px 10px;background:rgba(6,18,11,.72);color:#e4f1e8;font-size:11.5px;border-radius:8px;padding:6px 9px;text-align:center}
.cam-box .cam-empty{padding:24px;text-align:center;font-size:12px;color:#a9c4b4}
.cam-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.face-result{border:1px solid var(--brand-line);background:#f3faf5;border-radius:12px;padding:12px;display:flex;gap:11px;align-items:center;margin-top:10px}
.face-avatar{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:inline-grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.avatar.gold{background:var(--gold-soft);color:#8a5a11}
.avatar.blue{background:var(--info-soft);color:#1e40af}
.avatar.red{background:var(--danger-soft);color:var(--danger)}
.avatar.gray{background:#eef1ed;color:#5d6b62}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:12px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:34px;background:linear-gradient(180deg,#2f8a5b,#14603a);border-radius:6px 6px 2px 2px;min-height:2px;position:relative;transition:.2s}
.bar:hover{filter:brightness(1.1)}
.bar-val{font-size:9.5px;color:var(--muted);white-space:nowrap}
.bar-x{font-size:9.5px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}
.progress{height:7px;background:#edf1ec;border-radius:99px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--brand);border-radius:99px}
.progress.gold > i{background:var(--gold)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:12.5px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right}
.loc-card{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.loc-card:last-child{border-bottom:0;padding-bottom:0}
.loc-icon{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.loc-card strong{display:block;font-size:13px}
.loc-card span{display:block;font-size:11px;color:var(--muted)}
.amount-pos{color:var(--brand);font-weight:600}
.amount-neg{color:var(--danger);font-weight:600}
.att-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.att-cell{border-radius:6px;text-align:center;font-size:10px;padding:4px 2px;background:#f2f5f1;color:#6e7d73;min-height:28px}
.att-cell.p{background:#dff1e5;color:#14603a;font-weight:600}
.att-cell.l{background:#fdf1d9;color:#8a5a11;font-weight:600}
.att-cell.a{background:#fdeceb;color:#b42318}
.code{background:#0f2419;color:#d8f0e2;border-radius:11px;padding:13px 15px;font-family:'Inter',ui-monospace,monospace;font-size:11px;line-height:1.65;overflow:auto;max-height:260px;white-space:pre;position:relative}
.code-box{position:relative}
.code-box .copy{position:absolute;right:8px;top:8px;background:#274a37;color:#dcf1e4;border:0;border-radius:7px;padding:4px 8px;font-size:10.5px}
.steps{counter-reset:step;display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:12px;position:relative}
.step-n{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;counter-increment:step}
.step-n::before{content:counter(step)}
.step strong{display:block;font-size:12.5px;margin-bottom:2px}
.step p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.6}
.step code{background:#f1f4f0;border-radius:4px;padding:0 4px;font-size:10.5px}
.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-main{min-width:0;flex:1}
.list-main strong{display:block;font-size:12.5px;line-height:1.35}
.list-main span{display:block;font-size:10.5px;color:var(--muted)}
.list-val{font-size:12.5px;font-weight:600;white-space:nowrap;text-align:right}
.list-val small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.tab-content{display:flex;flex-direction:column;gap:16px}
.scroll-x{overflow-x:auto}
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(360px,90vw)}
.toast{background:#1d3327;color:#eaf5ee;border-radius:11px;padding:10px 14px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:slide .2s ease;display:flex;gap:8px;align-items:flex-start}
.toast.good{background:#14532d}
.toast.bad{background:#8f2b21}
.toast.info{background:#1e3a8a}
.toast .ic{width:16px;height:16px;margin-top:1px}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.banner{background:linear-gradient(120deg,#0f3d27,#1d6b45);color:#f0f8f3;border-radius:18px;padding:22px 24px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(15,61,39,.18)}
.banner::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06)}
.banner::before{content:"";position:absolute;right:90px;bottom:-110px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.05)}
.banner h2{margin:0;font-size:20px;letter-spacing:-.3px}
.banner p{margin:5px 0 0;color:#c8e0d1;font-size:12px;max-width:640px}
.banner .row{margin-top:14px;position:relative;z-index:1}
.banner .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.banner .btn:hover{background:rgba(255,255,255,.2)}
.banner .btn-primary{background:#fff;border-color:#fff;color:#0f3d27}
.banner .btn-primary:hover{background:#eef6f0}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.quick-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:11.5px;font-weight:600;color:#33443a;text-align:left;transition:.15s;min-height:83px}
.quick-btn:hover{border-color:var(--brand-line);background:#f6fbf7;transform:translateY(-1px)}
.quick-btn .ic{width:18px;height:18px;color:var(--brand)}
.quick-btn span{line-height:1.35}
.overlay{display:none}
.searchbox{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:#fff;min-width:170px}
.searchbox input{border:0;outline:0;background:none;font-size:12px;width:100%;min-width:70px}
.searchbox .ic{width:14px;height:14px;color:#8a978e}
.filter-bar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.filter-bar .field{min-width:120px}
.filter-bar .field.grow{min-width:180px}
.stat-mini{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff}
.stat-mini .ic{width:17px;height:17px;color:var(--brand)}
.stat-mini b{display:block;font-size:13px;line-height:1.2}
.stat-mini span{display:block;font-size:10px;color:var(--muted)}
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .setup-grid{grid-template-columns:1fr}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:266px;transform:translateX(-104%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .sidebar.open{transform:none}
  .overlay{display:block;position:fixed;inset:0;background:rgba(8,20,13,.4);z-index:50;opacity:0;pointer-events:none;transition:.2s}
  .overlay.show{opacity:1;pointer-events:auto}
  .menu-btn{display:grid}
  .content{padding:18px 16px 34px}
  .topbar{padding:10px 14px;flex-wrap:wrap}
  .page-head h1{font-size:16px}
  .page-head p{display:none}
  .top-actions .loc-select{display:none}
  .top-actions{gap:6px}
  .role-pill,.conn{font-size:10.5px;padding:5px 9px}
  .icon-btn{width:34px;height:34px}
  .banner{padding:18px}
  .banner h2{font-size:17px}
  .form-grid{grid-template-columns:1fr}
  .form-grid .span2,.form-grid .span3{grid-column:auto}
  .g2{grid-template-columns:1fr}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat-value{font-size:21px}
  .modal-wrap{padding:8px;align-items:flex-end}
  .modal{max-height:94vh;border-radius:16px 16px 10px 10px}
  .att-grid{gap:3px}
  .att-cell{font-size:9px}
}
@media (max-width:560px){
  .g4,.g3{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content{padding:14px 12px 30px}
  .card{padding:14px}
  .card-body{padding:14px}
  .card.flush .card-head{padding:14px 14px 0}
  .table-wrap{border-radius:10px}
  table.tbl{font-size:11.5px}
  table.tbl th,table.tbl td{padding:7px 9px}
  .stat{padding:13px}
  .stat-value{font-size:19px}
  .top-actions .role-label{display:none}
  .banner .row .btn{flex:1}
  .modal-head,.modal-body,.modal-foot{padding-left:14px;padding-right:14px}
}
.auth-screen{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:radial-gradient(1200px 700px at 8% 0%,#1b6b45 0%,#0f3d27 46%,#0a2b1b 100%)}
.auth-aside{color:#e8f5ec;padding:54px 52px;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:640px}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.auth-brand .brand-mark{width:46px;height:46px;border-radius:13px;background:#fff;color:var(--brand-2);display:grid;place-items:center;font-weight:700;font-size:22px}
.auth-brand strong{display:block;font-size:16px;line-height:1.2}
.auth-brand span{display:block;font-size:11.5px;opacity:.75;letter-spacing:.04em}
.auth-aside h2{font-size:30px;line-height:1.25;margin:8px 0 0;font-weight:700}
.auth-aside p{margin:0;color:#bfdccb;font-size:14px;max-width:460px}
.auth-points{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.auth-points div{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:#d7ebde}
.auth-points .ic{width:17px;height:17px;margin-top:2px;color:#8fd0aa}
.auth-panel{display:grid;place-items:center;padding:28px 20px;background:rgba(243,245,241,.06)}
.auth-card{width:100%;max-width:430px;background:#fff;border-radius:18px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.auth-card h3{margin:6px 0 4px;font-size:22px}
.auth-badge{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600}
.auth-card .field{margin-top:12px}
.auth-card form .btn{width:100%;justify-content:center;margin-top:16px}
.auth-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.auth-actions .btn{flex:1;justify-content:center;min-width:120px}
.auth-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.auth-uid{font-family:'Inter',ui-monospace,monospace;font-size:11px;background:#f3f5f1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all;margin-top:8px}
.auth-alert{display:flex;gap:9px;align-items:flex-start;background:var(--warn-soft);border:1px solid #f3d9b0;color:#7a4a0b;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:12px}
.auth-alert .ic{width:17px;height:17px;margin-top:1px;flex:none}
.auth-alert.red{background:var(--danger-soft);border-color:#f3c7c3;color:#8f231a}
.auth-alert.blue{background:var(--info-soft);border-color:#cdd8fb;color:#1d3a8a}
@media (max-width:900px){.auth-screen{grid-template-columns:1fr}.auth-aside{display:none}.auth-panel{background:transparent;padding:18px 14px;align-items:center}.auth-card{padding:22px}}
@media print{
  .sidebar,.topbar,.foot,.no-print,.toast-wrap,.modal-wrap{display:none!important}
  .content{padding:0;max-width:none}
  body{background:#fff;font-size:11px}
  .card,.stat{box-shadow:none;border:1px solid #ccc;break-inside:avoid;border-radius:6px}
  .shell{display:block}
  .print-title{display:block!important;margin:0 0 14px}
  table.tbl th{position:static}
  .table-wrap{overflow:visible}
  table.tbl{min-width:0}
  a{color:#000}
}
.print-title{display:none}

/* ===== Blue ERP dashboard refresh ===== */
:root{
  --bg:#f2f6fc;--panel:#fff;--ink:#172b4d;--muted:#71809a;--line:#e1e9f4;
  --brand:#1456c0;--brand-2:#0b347d;--brand-soft:#eaf2ff;--brand-line:#c9dcff;
  --info:#1769e0;--info-soft:#eaf2ff;--gold:#c17b13;--gold-soft:#fff5df;
  --danger:#c73545;--danger-soft:#fff0f1;--warn:#b76b13;--warn-soft:#fff5e8;
  --radius:13px;--radius-sm:9px;
  --shadow:0 3px 14px rgba(31,70,130,.07),0 1px 3px rgba(31,70,130,.04);
}
body{background:var(--bg);color:var(--ink)}
.shell{grid-template-columns:226px minmax(0,1fr)}
.sidebar{background:linear-gradient(180deg,#092f78 0%,#08265f 100%);padding:18px 12px 16px}
.brand{padding:0 8px 17px}
.brand-mark{border-radius:10px;color:#0b347d;background:#fff}
.nav-label{color:#9db9e9}
.nav a{color:#dce8ff;border-radius:8px;padding:9px 11px}
.nav a .ic{color:#a9c6f5}
.nav a.active{background:#fff;color:#10479f;box-shadow:0 3px 12px rgba(0,0,0,.13)}
.nav a.active .ic{color:#1456c0}
.nav a:hover{background:rgba(255,255,255,.11);color:#fff}
.side-foot{color:#9db9e9}
.side-foot b{color:#fff}
.topbar{background:rgba(255,255,255,.94);border-bottom-color:#e3eaf5;padding:10px 22px}
.content{padding:20px 22px 36px;max-width:1680px}
.page-head h1{color:#173b78}
.card,.stat{border-color:#e4ebf5;box-shadow:var(--shadow)}
.card{border-radius:13px}
.card-head h2{color:#163d80}
.card-head h2 .ic{color:#1769e0}
.btn-primary{background:#1456c0;border-color:#1456c0}
.btn-primary:hover{background:#0d449f;border-color:#0d449f}
.btn-dark{background:#123b82;border-color:#123b82}
.tabs{background:#edf3fc}
.tabs button.active{color:#1456c0}
.badge.green{background:#e8f8ef;color:#12804a}
.stat{border-radius:12px;padding:14px 15px}
.stat::after{background:#eaf2ff}
.stat-icon{background:#eaf2ff;color:#1456c0}
.stat.gold .stat-icon{background:#fff3d9;color:#b8780d}
.stat.gold::after{background:#fff3d9}
.stat.blue .stat-icon{background:#e8f1ff;color:#1769e0}
.stat.blue::after{background:#e8f1ff}
.stat.red .stat-icon{background:#fff0f1;color:#c73545}
.stat.red::after{background:#fff0f1}
.stat-value{font-size:23px;color:#163d80}
.stat-label{color:#687b99}
.stat-sub.up{color:#15945b}
.bar{background:linear-gradient(180deg,#3c8bf2,#1557c4);border-radius:5px 5px 2px 2px}
.bar-chart{height:150px}
.quick-btn{border-color:#e1eaf7;border-radius:10px;background:#fbfdff}
.quick-btn .ic{color:#1769e0}
.quick-btn:hover{background:#f0f6ff;border-color:#b9d2fb}
.table-wrap{border-color:#e3eaf5}
table.tbl th{background:#f3f7fd;color:#687c9c}
table.tbl tbody tr:hover{background:#f7faff}
.banner{background:linear-gradient(115deg,#0b347d,#1769d5);box-shadow:0 12px 28px rgba(20,86,192,.18)}
.banner p{color:#d5e5ff}
.stat-mini{border-color:#e4ebf5;background:#fbfdff}
.stat-mini .ic{color:#1769e0}
.erp-shortcuts{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-left:auto}
.erp-shortcuts .btn{padding:6px 10px;font-size:11.5px;border-radius:8px}
.erp-shortcuts .btn .ic{width:14px;height:14px}
.dash-welcome{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dash-date{font-size:11px;color:#6c7e99;background:#f2f6fd;border:1px solid #e1eaf7;border-radius:8px;padding:5px 9px}
.dash-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.dash-kpi{background:#fff;border:1px solid #e4ebf5;border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.dash-kpi:after{content:"";position:absolute;right:-17px;top:-19px;width:68px;height:68px;border-radius:50%;background:var(--kpi-soft,#eaf2ff)}
.dash-kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.dash-kpi-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--kpi-soft,#eaf2ff);color:var(--kpi-color,#1456c0)}
.dash-kpi-icon .ic{width:18px;height:18px}
.dash-kpi-label{font-size:11px;color:#6c7e99;font-weight:600}
.dash-kpi-value{font-size:21px;font-weight:700;color:#153d83;line-height:1.25;margin-top:8px;position:relative;z-index:1;overflow-wrap:anywhere}
.dash-kpi-note{font-size:10.5px;color:#8090a8;margin-top:3px;position:relative;z-index:1}
.dash-charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.dash-chart-card{background:#fff;border:1px solid #e4ebf5;border-radius:13px;padding:14px 15px;box-shadow:var(--shadow);min-width:0}
.dash-chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.dash-chart-head strong{display:block;color:#163d80;font-size:13px}
.dash-chart-head span{font-size:10.5px;color:#8090a8}
.dash-chart{width:100%;height:150px;display:block;overflow:visible}
.dash-chart text{font-family:var(--font);font-size:9px;fill:#8190a7}
.dash-legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:10px;color:#71809a;margin-top:4px}
.dash-legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px}
.dash-lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px}
.dash-balance-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf1f7;font-size:12px}
.dash-balance-row:last-child{border-bottom:0}
.dash-balance-row b{color:#183d7b}
.dash-activity-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#1769e0;margin-right:7px}
@media(max-width:1180px){
 .dash-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .dash-charts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
 .shell{grid-template-columns:1fr}
 .erp-shortcuts{order:3;width:100%;margin:0;overflow-x:auto;flex-wrap:nowrap}
 .erp-shortcuts .btn{flex:none}
}
@media(max-width:650px){
 .dash-charts,.dash-lower{grid-template-columns:1fr}
 .dash-kpi-value{font-size:19px}
 .content{padding:14px 12px 28px}
}

<style id="responsive-autofit-fix">
/* ===== Auto-fit / responsive fix =====
   আগের ২-কলাম গ্রিড (!important) ছোট স্ক্রীনেও জোর করে ছিল, তাই কন্টেন্ট ২২২px-এ আটকে যেত।
   এখানে সেটা সব স্ক্রীন সাইজের জন্য ঠিক করা হয়েছে। এই ব্লকটি সবার শেষে থাকতে হবে। */
html,body{max-width:100%;overflow-x:hidden}
.main,.content{min-width:0}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
img,svg,canvas,video{max-width:100%}
.dash-chart{width:100%;height:auto;min-height:110px}
.ref-kpi-value,.ref-color-tile b,.ref-people b{overflow-wrap:anywhere}

/* ল্যাপটপ / ছোট ডেস্কটপ */
@media(max-width:1180px){
  .ref-kpi-five{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .ref-chart-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .ref-lower{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .ref-lower>:last-child{grid-column:1/-1}
}

/* ট্যাবলেট ও অর্ধেক স্ক্রীন: সাইডবার হয় ড্রয়ার (☰ বাটনে খোলে) */
@media(max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)!important}
  .sidebar{position:fixed!important;top:0;bottom:0;left:0!important;height:100dvh;width:min(290px,86vw)!important;
    transform:translateX(-105%);transition:transform .22s ease;z-index:90;box-shadow:none}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .overlay{display:block;position:fixed;inset:0;background:rgba(4,20,12,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
  .overlay.show{opacity:1;pointer-events:auto}
  .menu-btn{display:grid!important;flex:none;width:40px;height:40px;border:1px solid rgba(255,255,255,.22)!important;background:#104a30!important;border-radius:10px;color:#fff}
  .main{width:100%}
  .topbar{flex-wrap:wrap;padding:8px 12px!important;gap:8px}
  .page-head{flex:1 1 140px}
  .page-head h1{font-size:20px}
  .page-head p{display:none}
  .erp-shortcuts{order:3;flex:1 1 100%;width:100%;margin:0;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .erp-shortcuts .btn{flex:none}
  .top-actions{margin-left:auto;flex-wrap:wrap;gap:6px}
  .top-actions .loc-select{display:flex!important}
  .loc-select select{max-width:120px}
  .role-pill,.conn{font-size:13px;padding:6px 10px}
  .content{padding:14px 12px 30px!important}
  .foot{padding:14px 12px 24px}
  .ref-kpi-five{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .ref-color-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .quick-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .form-grid{grid-template-columns:1fr}
  .form-grid .span2,.form-grid .span3{grid-column:auto}
  .g2{grid-template-columns:1fr}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
  .modal-wrap{padding:8px}
}

/* বড় ফোন / ছোট উইন্ডো */
@media(max-width:700px){
  body{font-size:15.5px}
  .dashboard-hero{padding:18px 16px!important;border-radius:14px}
  .dashboard-hero h2{font-size:19px!important}
  .dashboard-hero-actions .btn{flex:1 1 140px;justify-content:center}
  .ref-kpi-five{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .ref-chart-grid,.ref-lower{grid-template-columns:1fr!important}
  .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g4,.g3{grid-template-columns:1fr}
  .card{padding:14px}
  .top-actions .role-label{display:none}
  table.tbl{font-size:13px}
}

/* ছোট ফোন */
@media(max-width:420px){
  .ref-kpi-five,.ref-color-row,.ref-people-row{grid-template-columns:1fr!important}
  .top-actions .loc-select{flex:1 1 100%}
  .loc-select select{max-width:none;width:100%}
}
</style>

<style id="green-theme-readability-fix">
/* ===== Default green theme: readable text on white surfaces =====
   সমস্যা: গাঢ় সবুজ থিমে --ink/--muted হালকা রং করা ছিল (গাঢ় ব্যাকগ্রাউন্ডের জন্য),
   কিন্তু কার্ড/টেবিল/মডাল সাদা। ফলে সাদা কার্ডের ভেতরের লেখা প্রায় দেখা যেত না।
   সমাধান: শুধু সাদা সারফেসের ভেতরে গাঢ় টেক্সট রং সেট করা হলো।
   গাঢ় সবুজ ব্যাকগ্রাউন্ডের লেখা (সাইডবার, টপবার, পেজ টাইটেল) আগের মতোই হালকা থাকবে।
   Liquid Glass থিম অপরিবর্তিত। */
body:not(.theme-glass):not(.theme-white) .card,
body:not(.theme-glass):not(.theme-white) .stat,
body:not(.theme-glass):not(.theme-white) .stat-mini,
body:not(.theme-glass):not(.theme-white) .quick-btn,
body:not(.theme-glass):not(.theme-white) .ref-kpi,
body:not(.theme-glass):not(.theme-white) .ref-chart-card,
body:not(.theme-glass):not(.theme-white) .dash-kpi,
body:not(.theme-glass):not(.theme-white) .dash-chart-card,
body:not(.theme-glass):not(.theme-white) .table-wrap,
body:not(.theme-glass):not(.theme-white) .modal,
body:not(.theme-glass):not(.theme-white) .auth-card,
body:not(.theme-glass):not(.theme-white) .searchbox,
body:not(.theme-glass):not(.theme-white) .loc-card{
  --ink:#12301f;
  --muted:#4f6a5b;
  --line:#d3e2d7;
  --brand:#14613b;
  color:#12301f;
}
/* সাদা সারফেসের ভেতরের হালকা/ফ্যাকাশে লেখাগুলো আরও গাঢ় ও স্পষ্ট */
body:not(.theme-glass):not(.theme-white) .card .muted,
body:not(.theme-glass):not(.theme-white) .modal .muted,
body:not(.theme-glass):not(.theme-white) .table-wrap .muted{color:#4f6a5b!important}
body:not(.theme-glass):not(.theme-white) .card-head p,
body:not(.theme-glass):not(.theme-white) .stat-label,
body:not(.theme-glass):not(.theme-white) .stat-sub,
body:not(.theme-glass):not(.theme-white) .t-sub,
body:not(.theme-glass):not(.theme-white) table.tbl .sub,
body:not(.theme-glass):not(.theme-white) .kv .k,
body:not(.theme-glass):not(.theme-white) .form-note,
body:not(.theme-glass):not(.theme-white) .field .hint,
body:not(.theme-glass):not(.theme-white) .empty,
body:not(.theme-glass):not(.theme-white) .list-main span,
body:not(.theme-glass):not(.theme-white) .list-val small,
body:not(.theme-glass):not(.theme-white) .loc-card span,
body:not(.theme-glass):not(.theme-white) .stat-mini span,
body:not(.theme-glass):not(.theme-white) .step p,
body:not(.theme-glass):not(.theme-white) .modal-head p,
body:not(.theme-glass):not(.theme-white) .modal-foot .left{color:#4f6a5b!important}
body:not(.theme-glass):not(.theme-white) .card-head h2,
body:not(.theme-glass):not(.theme-white) .kv .v,
body:not(.theme-glass):not(.theme-white) .t-main,
body:not(.theme-glass):not(.theme-white) .list-main strong,
body:not(.theme-glass):not(.theme-white) .field label,
body:not(.theme-glass):not(.theme-white) .theme-settings-card .theme-choice-row label{color:#12301f!important}
body:not(.theme-glass):not(.theme-white) .card .small,
body:not(.theme-glass):not(.theme-white) .card .tiny{color:inherit}
body:not(.theme-glass):not(.theme-white) .t-sub,
body:not(.theme-glass):not(.theme-white) .tiny{font-size:13px}
body:not(.theme-glass):not(.theme-white) .kv .k{font-size:14.5px}
body:not(.theme-glass):not(.theme-white) .kv .v{font-weight:600}
/* ইনপুট, সিলেক্ট ও টেক্সটএরিয়া: গাঢ় লেখা + স্পষ্ট বর্ডার */
body:not(.theme-glass):not(.theme-white) .field input,
body:not(.theme-glass):not(.theme-white) .field select,
body:not(.theme-glass):not(.theme-white) .field textarea,
body:not(.theme-glass):not(.theme-white) .searchbox input,
body:not(.theme-glass):not(.theme-white) .theme-settings-card .theme-choice{
  color:#12301f!important;background:#fff;border-color:#b9cfc0;
}
body:not(.theme-glass):not(.theme-white) input::placeholder,
body:not(.theme-glass):not(.theme-white) textarea::placeholder{color:#7a8f82;opacity:1}
body:not(.theme-glass):not(.theme-white) select option{color:#12301f;background:#fff}
/* টেবিলের হেডার */
body:not(.theme-glass):not(.theme-white) table.tbl th{color:#3e5a4a!important;background:#eaf3ec;font-weight:700}
body:not(.theme-glass):not(.theme-white) table.tbl td{color:#1c3a2a}
/* ব্যাজ/চিপ */
body:not(.theme-glass):not(.theme-white) .badge,
body:not(.theme-glass):not(.theme-white) .chip{color:#1f4130}
/* বাটন (সাদা) */
body:not(.theme-glass):not(.theme-white) .btn:not(.btn-primary):not(.btn-dark):not(.btn-danger):not(.hero-primary):not(.hero-secondary){color:#17402a}
/* গাঢ় সবুজ ব্যাকগ্রাউন্ডে সরাসরি থাকা লেখা হালকা থাকবে */
body:not(.theme-glass):not(.theme-white) .content>.muted,
body:not(.theme-glass):not(.theme-white) .content>.small,
body:not(.theme-glass):not(.theme-white) .content>.empty{color:#cfe3d6!important}
</style>

<style id="nav-hover-and-glass-hero">
/* 1) Default green theme: সাইডবার মেনুতে Liquid Glass-এর মতো hover অ্যানিমেশন
      (স্বচ্ছ গ্লাস ব্যাকগ্রাউন্ড + হালকা বর্ডার + সাদা লেখা, মসৃণ ট্রানজিশন) */
body:not(.theme-glass):not(.theme-white) .nav a{transition:background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease}
body:not(.theme-glass):not(.theme-white) .nav a:hover:not(.active){
  background:rgba(255,255,255,.15)!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.22);
}
/* 2) শুধু কালো Liquid Glass থিমে ড্যাশবোর্ড হিরো সেকশন: রক্ত-লাল
      (গ্রিন থিমের রং অপরিবর্তিত) */
body.theme-glass .dashboard-hero{
  background:linear-gradient(112deg,#5c0610 0%,#8f0b17 52%,#b3101f 100%)!important;
  border:1px solid rgba(255,255,255,.18)!important;
  box-shadow:0 10px 30px rgba(120,6,16,.45),inset 0 1px 0 rgba(255,255,255,.14)!important;
  color:#fff!important;
}
body.theme-glass .dashboard-hero:before,
body.theme-glass .dashboard-hero:after{background:rgba(255,255,255,.07)!important}
body.theme-glass .dashboard-hero h2{color:#fff!important}
body.theme-glass .dashboard-hero p{color:rgba(255,255,255,.82)!important}
/* glass-এ সাইডবার/টপবার ব্লার বন্ধ — ট্রান্সলুসেন্ট হলেও অনেক হালকা */
body.theme-glass .sidebar,body.theme-glass .topbar,body.theme-glass .modal-head{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
}
body.theme-glass .topbar{background:rgba(9,13,20,.92)!important}
body.theme-glass .sidebar{background:rgba(13,17,25,.92)!important}
</style>




<style id="f-feature-kit">
/* ============================================================
   EKhisaB স্টাইল কিট — নতুন যোগ করা অপশনগুলোর জন্য
   (সব রং থিম ভেরিয়েবল অনুসরণ করে, তাই গ্রিন ও Glass দুটোতেই কাজ করবে)
   ============================================================ */
:root{
  --f-green:#16a34a;--f-green-soft:#e8f8ee;--f-amber:#f59e0b;--f-amber-soft:#fff7e6;
  --f-red:#ef4444;--f-red-soft:#feecec;--f-violet:#8b5cf6;--f-violet-soft:#f2eeff;
  --f-blue:#3b82f6;--f-blue-soft:#eaf1ff;--f-teal:#0d9488;--f-teal-soft:#e3f7f4;
}
/* ---------- টগল সুইচ ---------- */
.tgl{display:flex;align-items:center;gap:14px;justify-content:space-between;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;min-height:58px}
.tgl-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tgl b{font-size:13px;color:#12301f;font-weight:700;line-height:1.35}
.tgl span{font-size:11.5px;color:#5d7b69;line-height:1.4}
.tgl input{position:absolute;opacity:0;width:0;height:0}
.tgl i{flex:none;width:46px;height:26px;border-radius:999px;background:#dfe7e2;position:relative;transition:.18s;cursor:pointer;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tgl input:checked+i{background:#16a34a!important}
.tgl input:checked+i::after{left:23px!important}

.tgl.on{border-color:var(--brand-line);background:linear-gradient(180deg,#f5fcf7,#fff)}
.tgl:has(input:checked){border-color:#bfe3cb;background:linear-gradient(180deg,#f3fbf5,#fff)}
.tgl:has(input:checked) i{background:#16a34a!important}
.tgl:has(input:checked) i::after{left:23px}
/* ---------- সেকশন কার্ড (সেটিংস মডাল) ---------- */
.sec{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;margin-bottom:14px}
.sec:last-child{margin-bottom:0}
.sec-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:linear-gradient(90deg,#14603a,#1c7a4c);color:#fff}
.sec-head .ic{width:17px;height:17px;color:#fff}
.sec-head b{font-size:13.5px;font-weight:700;line-height:1.3}
.sec-head span{display:block;font-size:11px;opacity:.85;font-weight:500;margin-top:1px}
.sec-head.amber{background:linear-gradient(90deg,#b45309,#d97706)}
.sec-head.blue{background:linear-gradient(90deg,#1d4ed8,#2563eb)}
.sec-head.violet{background:linear-gradient(90deg,#6d28d9,#7c3aed)}
.sec-head.teal{background:linear-gradient(90deg,#0f766e,#0d9488)}
.sec-body{display:flex;flex-direction:column;gap:9px;padding:12px 13px}
/* ---------- খরচ ক্যাটাগরি টাইল ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.cat-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px 10px 13px;text-align:center;transition:.16s;min-height:112px;overflow:hidden}
.cat-tile>svg{flex:none;display:block;max-width:100%;height:auto}
.cat-tile>svg text{font-family:'Inter','Hind Siliguri',Arial,sans-serif;letter-spacing:.2px}
.cat-tile>b{position:relative;z-index:2;background:transparent}
.cat-tile>small{position:relative;z-index:2}
.cat-tile:hover{border-color:var(--f-green);background:#f7fdf9;transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,96,58,.09)}
.cat-tile .cat-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--f-green-soft);color:var(--f-green)}
.cat-tile .cat-ic .ic{width:23px;height:23px}
.cat-tile b{font-size:12.5px;color:#12301f;font-weight:700;line-height:1.3}
.cat-tile small{font-size:10.5px;color:#6b8577}
.cat-tile .cat-x{position:absolute;top:6px;right:6px;width:22px;height:22px;border:0;border-radius:50%;background:#fdeaea;color:#c02626;font-size:14px;line-height:1;display:grid;place-items:center;opacity:0;transition:.15s}
.cat-tile:hover .cat-x{opacity:1}
/* ---------- একক চিপ ---------- */
.unit-group{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfdfb}
.unit-group-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.unit-group-h b{font-size:12px;color:#12301f}
.unit-chips{display:flex;flex-wrap:wrap;gap:6px}
.unit-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 9px;font-size:12px;font-weight:600;color:#25453a}
.unit-chip small{font-size:10px;color:#7c9488;font-weight:500}
.unit-chip button{border:0;background:none;color:#c02626;font-size:13px;line-height:1;padding:0 1px}
.unit-chip.sel{border-color:var(--f-green);background:var(--f-green-soft);color:#0f5132}
/* ---------- সেটিংস হাব কার্ড ---------- */
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.hub-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;transition:.16s;min-height:78px}
.hub-card:hover{border-color:var(--brand-line);box-shadow:0 8px 20px rgba(20,96,58,.10);transform:translateY(-1px)}
.hub-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--f-green-soft);color:var(--f-green)}
.hub-ic .ic{width:22px;height:22px}
.hub-ic.blue{background:var(--f-blue-soft);color:var(--f-blue)}
.hub-ic.amber{background:var(--f-amber-soft);color:var(--f-amber)}
.hub-ic.violet{background:var(--f-violet-soft);color:var(--f-violet)}
.hub-ic.teal{background:var(--f-teal-soft);color:var(--f-teal)}
.hub-ic.red{background:var(--f-red-soft);color:var(--f-red)}
.hub-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.hub-txt b{font-size:13.5px;color:#12301f;font-weight:700}
.hub-txt span{font-size:11.5px;color:#5d7b69;line-height:1.4}
.hub-txt em{font-style:normal;font-size:10.5px;color:#0f5132;font-weight:700;margin-top:3px}
/* ---------- পণ্য ফর্ম ---------- */
.ftabs{display:flex;gap:6px;background:#eef3ee;padding:4px;border-radius:11px;margin-bottom:14px}
.ftabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 10px;font-size:13px;font-weight:700;color:#5b6b61}
.ftabs button.active{background:#14603a;color:#fff;box-shadow:0 2px 8px rgba(20,96,58,.28)}
.img-up{border:1.5px dashed #9dd0b0;border-radius:14px;background:linear-gradient(180deg,#f4fcf7,#fff);padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.img-up:hover{border-color:var(--f-green);background:#f0fbf4}
.img-up .up-ic{width:46px;height:46px;border-radius:50%;background:var(--f-green);color:#fff;display:grid;place-items:center}
.img-up b{font-size:13px;color:#12301f}
.img-up span{font-size:11px;color:#5d7b69;line-height:1.5}
.img-prev{width:86px;height:86px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.bc-row{display:flex;gap:8px;align-items:stretch}
.bc-row input{flex:1}
.bc-btn{flex:none;width:46px;border:1px solid var(--line);background:#eef7f0;border-radius:9px;display:grid;place-items:center;color:#14603a}
/* ---------- অর্ডার ---------- */
.ord-no{font-family:'Inter',monospace;font-size:11.5px;color:#4a6a58;font-weight:600}
.mfs-head{background:linear-gradient(120deg,#0f766e,#0d9488);color:#fff;border-radius:14px 14px 0 0;padding:16px 18px}

function planConsume(kind,key,locationId,qty){
  const map={raw:'rawLots',semi:'semiLots',fg:'fgLots'};
  const coll=map[kind];
  const lots=vals(DATA[coll]).filter(l=>n(l.remaining)>0&&l.locationId===locationId&&(kind==='fg'?l.productId===key:l.itemId===key)).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id).localeCompare(String(b.id)));
  let left=round3(qty),cost=0;const updates=[],lines=[];
  for(const lot of lots){
    if(left<=0.0001) break;
    const take=Math.min(n(lot.remaining),left);
    const unit=kind==='raw'?lotRate(lot):n(lot.unitCost);
    cost+=take*unit;left=round3(left-take);
    updates.push({path:`${coll}/${lot.id}`,value:{...lot,remaining:round3(n(lot.remaining)-take)}});
    lines.push({lotId:lot.id,date:lot.date,itemId:lot.itemId,productId:lot.productId,qty:take,unitCost:round2(unit),cost:round2(take*unit),lot});
  }
  return {updates,cost:round2(cost),consumed:round3(n(qty)-left),lines,short:round3(left)};
}

const LS_PENDING='ips_pending_writes_v1';
function fPendingWrites(){try{return JSON.parse(localStorage.getItem(LS_PENDING)||'[]')||[];}catch(e){return [];}}
function fSetPendingWrites(arr){try{localStorage.setItem(LS_PENDING,JSON.stringify(arr||[]));}catch(e){}}
function fQueueWrite(obj){
  const arr=fPendingWrites();
  arr.push({at:Date.now(),obj});
  if(arr.length>80) arr.splice(0,arr.length-80);
  fSetPendingWrites(arr);
}
async function fFlushPendingWrites(quiet=true){
  if(S.mode!=='firebase'||!FB.db||!FB.mods) return;
  const arr=fPendingWrites();
  if(!arr.length) return;
  const keep=[];
  for(const item of arr){
    try{ await FB.mods.update(FB.mods.ref(FB.db,'ips'),item.obj); }
    catch(e){ keep.push(item); }
  }
  fSetPendingWrites(keep);
  if(keep.length){
    if(!quiet) toast('অনলাইন সিঙ্ক হয়নি — '+keep.length+'টি এন্ট্রি অপেক্ষায় আছে','bad');
  }else{
    S._lastWriteErr='';
    if(!quiet) toast('অপেক্ষমাণ এন্ট্রি সিঙ্ক হয়েছে','good');
  }
}
async function batch(updates){
  const list=(updates||[]).filter(Boolean);
  if(!list.length) return;
  const firebaseMode=(S.mode==='firebase'&&FB.db&&FB.mods);
  /* আগে লোকাল ডেটাতে বসানো — UI সাথে সাথে আপডেট হবে */
  if(firebaseMode){
    for(const u of list){
      if(u.value===null) delPath(DATA,u.path);
      else setPath(DATA,u.path,structuredClone(u.value));
    }
    DATA=normalizeData(DATA);
    render();
    const obj={};
    for(const u of list){obj[u.path]=u.value;}
    try{
      await FB.mods.update(FB.mods.ref(FB.db,'ips'),obj);
      S._lastWriteErr='';
      try{ await fFlushPendingWrites(true); }catch(e){}
    }catch(e){
      const msg=(e&&(e.code||e.message))?String(e.code||e.message):'unknown';
      S._lastWriteErr=msg;
      fQueueWrite(obj);
      console.warn('firebase write failed:',e);
      const why=/PERMISSION|permission/i.test(msg)
        ? 'Firebase Rules লেখার অনুমতি দিচ্ছে না — সেটআপ → Firebase Rules দেখুন'
        : /network|offline|unavailable|-6|timeout/i.test(msg)
        ? 'ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না'
        : 'কারণ: '+msg;
      toast('Firebase-এ এখনই সেভ হয়নি — '+why+'. অ্যাপে সংরক্ষিত আছে, পরে স্বয়ংক্রিয়ভাবে সিঙ্ক হবে।','bad');
    }
    return;
  }
  for(const u of list){
    if(u.value===null) delPath(DATA,u.path);
    else setPath(DATA,u.path,structuredClone(u.value));
  }
  DATA=normalizeData(DATA);
  persistDemo();
  render();
}

async function connectFirebase(cfg){
  const [appMod,dbMod,authMod]=await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-database.js`),
    import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-auth.js`)
  ]);
  if(authUnsub){try{authUnsub();}catch(e){}authUnsub=null;}
  detachData();
  if(FB.app){try{await appMod.deleteApp(FB.app);}catch(e){}}
  FB.app=appMod.initializeApp(cfg,'ips-app');
  FB.cfg=cfg;FB.appMod=appMod;FB.authMod=authMod;
  FB.db=dbMod.getDatabase(FB.app);
  FB.mods={ref:dbMod.ref,onValue:dbMod.onValue,set:dbMod.set,update:dbMod.update,get:dbMod.get,remove:dbMod.remove};
  FB.ready=false;
  S.mode='firebase';S.conn='connecting';S.user=null;S.userProfile=null;S.users=null;S.usersError='';S.authError='';
  localStorage.setItem(LS_CFG,JSON.stringify(cfg));
  localStorage.removeItem(LS_FORCE_DEMO);
  FB.auth=authMod.getAuth(FB.app);
  authUnsub=authMod.onAuthStateChanged(FB.auth,user=>{
    handleAuthState(user).catch(err=>{
      console.error(err);
      S.conn='auth-error';S.authError=err?.message||'লগইন অবস্থা পড়া যায়নি';render();
    });
  });
  render();
}

async function handleAuthState(user){
  if(user&&user.isAnonymous){
    try{await FB.authMod.signOut(FB.auth);}catch(e){}
    return;
  }
  if(!user){
    detachData();
    S.user=null;S.userProfile=null;S.users=null;S.usersError='';S.authError='';
    S.mode='firebase';S.conn='signed-out';FB.ready=false;
    render();
    return;
  }
  S.user={uid:user.uid,email:user.email||''};
  S.mode='firebase';S.conn='connecting';S.authError='';
  render();
  let prof=null;
  try{
    const snap=await FB.mods.get(FB.mods.ref(FB.db,'users/'+user.uid));
    prof=snap.val();
  }catch(err){
    S.conn='auth-error';
    S.authError='ব্যবহারকারীর প্রোফাইল পড়া যায়নি: '+authErrorText(err);
    FB.ready=false;detachData();
    render();
    return;
  }
  if(!prof||prof.active===false){
    S.userProfile=prof||null;
    S.conn='no-profile';
    FB.ready=false;detachData();
    render();
    return;
  }
  S.userProfile={...prof,uid:user.uid,email:prof.email||user.email||''};
  S.role=ROLE_NAMES[prof.role]?prof.role:'operator';
  savePref();
  attachData();
}

function attachData(){
  detachData();
  if(!FB.db||!FB.mods) return;
  S.conn='connecting';
  dataUnsub=FB.mods.onValue(FB.mods.ref(FB.db,'ips'),snap=>{
    const v=snap.val();
    setData(v||emptyData());
    S.mode='firebase';FB.ready=true;
    S.conn=v?'firebase':'firebase-empty';
    render();
    setTimeout(()=>{fFlushPendingWrites(true).catch(()=>{});},1200);
  },err=>{
    S.conn='error';S.authError='ডেটা পড়া যায়নি: '+err.message;FB.ready=false;
    render();
  });
}

function detachData(){
  if(dataUnsub){try{dataUnsub();}catch(e){}dataUnsub=null;}
  FB.ready=false;
}

async function loadUsers(force=false){
  if(S.mode!=='firebase'||!FB.db||!FB.mods||!S.userProfile||S.userProfile.role!=='admin') return;
  if(S.usersLoading) return;
  if(S.users&&!force) return;
  S.usersLoading=true;S.usersError='';
  try{
    const snap=await FB.mods.get(FB.mods.ref(FB.db,'users'));
    S.users=snap.val()||{};
  }catch(err){
    S.usersError='ব্যবহারকারী তালিকা পড়া যায়নি: '+authErrorText(err);
  }
  S.usersLoading=false;
  if(S.page==='setup') render();
}

async function provisionAuthUser(email,password){
  if(!FB.appMod||!FB.authMod||!FB.cfg) throw new Error('Firebase সংযোগ নেই');
  const name='ips-provision-'+Date.now();
  const app2=FB.appMod.initializeApp(FB.cfg,name);
  try{
    const a2=FB.authMod.getAuth(app2);
    const cred=await FB.authMod.createUserWithEmailAndPassword(a2,email,password);
    const uid=cred.user.uid;
    await FB.authMod.signOut(a2);
    return uid;
  }catch(err){
    throw new Error(authErrorText(err));
  }finally{
    try{await FB.appMod.deleteApp(app2);}catch(e){}
  }
}

function disconnectFirebase(){
  detachData();

function assetDep(asset,asOf=todayISO()){
  const start=new Date(asset.purchaseDate+'T12:00:00');
  const end=new Date(asOf+'T12:00:00');
  if(isNaN(start)||isNaN(end)||end<start) return {total:0,monthly:0,schedule:[],nbv:round2(n(asset.cost))};
  const months=(end.getFullYear()-start.getFullYear())*12+(end.getMonth()-start.getMonth())+1;
  const cost=n(asset.cost),salvage=n(asset.salvage),cap=Math.max(0,cost-salvage);
  let total=0,opening=cost;const schedule=[];
  for(let i=0;i<months&&i<600;i++){
    let amount=asset.method==='declining'?opening*n(asset.rate||10)/100/12:(cap/Math.max(1,n(asset.lifeYears||5))/12);
    amount=round2(Math.min(amount,cap-total));
    if(amount<=0) break;
    const dt=new Date(start.getFullYear(),start.getMonth()+i+1,0);
    let d=isoOf(dt);if(d>asOf) d=asOf;
    schedule.push({date:d,amount});
    total=round2(total+amount);opening=round2(opening-amount);
  }
  return {total,monthly:schedule.length?schedule[schedule.length-1].amount:0,schedule,nbv:round2(cost-total)};
}

function countUnitCost(c){
  if(n(c.unitCost)) return n(c.unitCost);
  if(c.kind==='point'||c.kind==='fg') return avgCost('fg',c.productId||c.refId,c.locationId);
  return avgCost(c.kind,c.refId||c.itemId,c.locationId);
}
function buildJournal(){
  const entries=[];
  const add=(date,code,debit,credit,desc,refType='',refId='')=>{
    debit=round2(debit);credit=round2(credit);
    if(!date||(debit===0&&credit===0)) return;
    entries.push({date:String(date).slice(0,10),code,debit,credit,desc,refType,refId});
  };
  const op=DATA.settings.opening||{};
  const oa=n(op.cash)+n(op.bank)+n(op.inventory)+n(op.fixedAssets);
  const ol=n(op.liabilities);
  if(oa||ol){
    const date=DATA.settings.openingDate||'2000-01-01';
    add(date,'1000',op.cash,0,'প্রারম্ভিক নগদ');
    add(date,'1010',op.bank,0,'প্রারম্ভিক ব্যাংক');
    add(date,'1200',op.inventory,0,'প্রারম্ভিক স্টক');
    add(date,'1500',op.fixedAssets,0,'প্রারম্ভিক স্থায়ী সম্পদ');
    add(date,'2000',0,ol,'প্রারম্ভিক দায়');
    add(date,'3000',0,Math.max(0,oa-ol),'প্রারম্ভিক মূলধন');
  }
  for(const l of vals(DATA.rawLots)){
    const landed=round2(n(l.qty)*n(l.rate)+n(l.transport)+n(l.loading));
    add(l.date,'1200',landed,0,`মাল ক্রয় — ${itemName(l.itemId)}`,'raw',l.id);
    add(l.date,'2000',0,landed,`মাল ক্রয় বাবদ প্রদেয় — ${itemName(l.itemId)}`,'raw',l.id);
  }
  for(const l of vals(DATA.semiLots)){
    add(l.date,'1210',n(l.qty)*n(l.unitCost),0,`সেমি-ফিনিশড স্টকে স্থানান্তর — ${itemName(l.itemId)}`,'semi',l.id);
    add(l.date,'1200',0,n(l.qty)*n(l.unitCost),`সেমি-ফিনিশডে স্থানান্তর — ${itemName(l.itemId)}`,'semi',l.id);
  }
  for(const i of vals(DATA.issues)){
    add(i.date,'1220',i.cost,0,`প্রোডাকশনে কাঁচামাল — ${itemName(i.itemId)}`,'issue',i.id);
    add(i.date,'1200',0,i.cost,`প্রোডাকশনে ইস্যু — ${itemName(i.itemId)}`,'issue',i.id);
  }
  for(const o of vals(DATA.outputs)){
    const total=round2(n(o.rawCost)+n(o.conversion));
    add(o.date,'1230',total,0,`ফিনিশড উৎপাদন — ${productName(o.productId)}`,'output',o.id);
    add(o.date,'1220',0,o.rawCost,`ডব্লিউআইপি থেকে ফিনিশড — ${productName(o.productId)}`,'output',o.id);
    add(o.date,'1000',0,o.conversion,`রূপান্তর ব্যয় — ${productName(o.productId)}`,'output',o.id);
  }
  for(const s of vals(DATA.sales).filter(v=>v.status!=='rejected')){
    const revenue=n(s.expected),cash=n(s.actual),variance=round2(revenue-cash),cost=n(s.cost);
    const title=s.type==='semi'?itemName(s.itemId):productName(s.productId);
    add(s.date,'1000',cash,0,`বিক্রয় আদায় — ${title}`,'sale',s.id);
    if(variance>0) add(s.date,'5010',variance,0,`বিক্রয় ব্যবধান — ${title}`,'sale',s.id);
    if(variance<0) add(s.date,'5010',0,-variance,`অতিরিক্ত আদায় — ${title}`,'sale',s.id);
    add(s.date,s.type==='semi'?'4010':'4000',0,revenue,`বিক্রয় — ${title}`,'sale',s.id);
    if(cost>0){
      add(s.date,'5000',cost,0,`বিক্রীত পণ্যের ব্যয় — ${title}`,'sale',s.id);
      add(s.date,s.type==='semi'?'1210':'1230',0,cost,`স্টক হ্রাস — ${title}`,'sale',s.id);
    }
  }
  for(const x of vals(DATA.expenses).filter(v=>v.status==='approved')){
    add(x.date,x.category||'6180',x.amount,0,`${expenseCatName(x.category)} — ${x.description}`,'expense',x.id);
    add(x.date,'1000',0,x.amount,`নগদ পরিশোধ — ${x.description}`,'expense',x.id);
  }
  for(const a of vals(DATA.assets)){
    add(a.purchaseDate,'1500',a.cost,0,`সম্পদ ক্রয় — ${a.name}`,'asset',a.id);
    add(a.purchaseDate,'1000',0,a.cost,`সম্পদ ক্রয় — ${a.name}`,'asset',a.id);
    const dep=assetDep(a,todayISO());
    for(const d of dep.schedule){
      add(d.date,'6100',d.amount,0,`অবচয় — ${a.name}`,'depreciation',a.id);
      add(d.date,'1590',0,d.amount,`সঞ্চিত অবচয় — ${a.name}`,'depreciation',a.id);
    }
  }
  for(const c of vals(DATA.counts).filter(v=>v.status==='approved'&&n(v.adjustQty??v.diff)!==0)){
    const q=n(c.adjustQty??c.diff);const unit=countUnitCost(c);const value=round2(Math.abs(q)*unit);
    const inv=inventoryAccount(c.kind);
    const label=c.kind==='point'?`ডেলিভারি পয়েন্ট গরমিল — ${productName(c.productId)}`:c.kind==='fg'?`ফিনিশড স্টক গরমিল — ${productName(c.productId)}`:`স্টক গরমিল — ${itemName(c.itemId||c.refId)}`;
    if(q<0){add(c.date,'5010',value,0,label,'count',c.id);add(c.date,inv,0,value,label,'count',c.id);}
    else{add(c.date,inv,value,0,label,'count',c.id);add(c.date,'5010',0,value,label,'count',c.id);}
  }
  return entries.sort((a,b)=>a.date.localeCompare(b.date));
}
function trialBalance(asOf=todayISO()){
  const entries=buildJournal().filter(e=>e.date<=asOf);
  const map={};
  for(const e of entries){
    map[e.code]=map[e.code]||{code:e.code,debit:0,credit:0};
    map[e.code].debit=round2(map[e.code].debit+e.debit);
    map[e.code].credit=round2(map[e.code].credit+e.credit);
  }
  const rows=Object.values(map).sort((a,b)=>a.code.localeCompare(b.code)).map(r=>({...r,name:accountName(r.code),balance:round2(r.debit-r.credit)}));
  return {rows,debit:round2(sum(rows,'debit')),credit:round2(sum(rows,'credit'))};
}
function incomeStatement(from,to){
  const entries=buildJournal().filter(e=>e.date>=from&&e.date<=to);
  const byCode={};
  for(const e of entries){byCode[e.code]=byCode[e.code]||{debit:0,credit:0};byCode[e.code].debit+=e.debit;byCode[e.code].credit+=e.credit;}
  const revenue=round2((byCode['4000']?.credit||0)+(byCode['4010']?.credit||0)-(byCode['4000']?.debit||0)-(byCode['4010']?.debit||0));
  const cogs=round2((byCode['5000']?.debit||0)-(byCode['5000']?.credit||0));
  const shortage=round2((byCode['5010']?.debit||0)-(byCode['5010']?.credit||0));
  const expenses=[];
  for(const [code,v] of Object.entries(byCode)){
    if(code.startsWith('6')&&code!=='6100'){const amt=round2(v.debit-v.credit);if(amt) expenses.push({code,name:accountName(code),amount:amt});}
  }
  const depreciation=round2((byCode['6100']?.debit||0)-(byCode['6100']?.credit||0));
  const expenseTotal=round2(sum(expenses,'amount')+depreciation);
  const gross=round2(revenue-cogs);
  const net=round2(gross-shortage-expenseTotal);
  return {revenue,cogs,gross,shortage,expenses,depreciation,expenseTotal,net,entries};
}
function balanceSheet(asOf=todayISO()){
  const tb=trialBalance(asOf);
  const get=code=>{const r=tb.rows.find(x=>x.code===code);return r?round2(r.debit-r.credit):0;};
  const assets={cash:get('1000'),bank:get('1010'),receivable:get('1100'),raw:get('1200'),semi:get('1210'),wip:get('1220'),fg:get('1230'),fixed:get('1500'),accumDep:get('1590')};
  assets.total=round2(assets.cash+assets.bank+assets.receivable+assets.raw+assets.semi+assets.wip+assets.fg+assets.fixed+assets.accumDep);
  const liabilities={payable:round2(-get('2000'))};
  liabilities.total=round2(liabilities.payable);
  const capital={owner:round2(-get('3000')),retained:round2(-get('3100'))};
  const profit=incomeStatement('2000-01-01',asOf).net;
  capital.total=round2(capital.owner+capital.retained+profit);
  return {assets,liabilities,capital,profit,balanced:Math.abs(assets.total-liabilities.total-capital.total)<1};
}
function cashBalance(asOf=todayISO()){
  const tb=trialBalance(asOf);
  const row=tb.rows.find(r=>r.code==='1000');

}

/* ড্যাশবোর্ডের ৩ডি হাজিরা বোর্ড — ছবি/নাম/চেক-ইন-আউট/লাইভ লোকেশন */
function fAttBoard(today){
  try{
    const roster=vals(DATA.employees).filter(e=>e.active!==false&&(!S.loc||e.locationId===S.loc));
    const rows=roster.map(e=>{const a=DATA.attendance[e.id]?.[today]||null;return {e,a};});
    const present=rows.filter(r=>r.a?.in).length;
    const out=rows.filter(r=>r.a?.out).length;
    const late=rows.filter(r=>r.a?.late).length;
    const cards=rows.map(({e,a})=>{
      const photo=a?.inPhoto||e.img||e.photo||'';
      const cls=a?.out?'is-out':a?.late?'is-late':a?.in?'is-in':'is-off';
      const dot=a?.out?'out':a?.late?'late':a?.in?'on':'';
      const inT=a?.in?fmtTime(a.in):'—',outT=a?.out?fmtTime(a.out):'—';
      const hrs=a?.in&&a?.out?round2((timeMin(a.out)-timeMin(a.in))/60):0;
      const loc=a?.in?(a.loc||locShort(e.locationId)||'…'):'…';
      const state=a?.out?'চেক আউট':a?.late?'দেরি':a?.in?'উপস্থিত':'অনুপস্থিত';
      return `<button class="f3d-card ${cls}" type="button" data-act="go-att-today" title="${esc(e.name)} — আজকের হাজিরা">
        <div class="f3d-mainrow">
          <span class="f3d-photo">${photo?`<img src="${esc(photo)}" alt="">`:esc(initials(e.name))}<i class="f3d-dot ${dot}"></i></span>
          <div class="f3d-info">
            <div class="f3d-name">${esc(e.name)}</div>
            <div class="f3d-role">${esc(ROLE_NAMES[e.role]||e.role||'')}</div>
            <div class="f3d-times"><span class="f3d-in">ইন ${inT}</span><span class="f3d-out">আউট ${outT}</span></div>
          </div>
        </div>
        <div class="f3d-bottom"><div class="f3d-loc">${icon('pin')}<span>${esc(loc)}</span></div><span class="f3d-pill">${state}</span></div>
      </button>`;
    }).join('');
    return `<div class="f3d-wrap"><section class="f3d-board no-print">
      <div class="f3d-head">
        <div><h2>${icon('users')} আজকের হাজিরা</h2><p>${fmtDate(today)} · ছবি, চেক ইন/আউট ও লাইভ লোকেশন</p></div>
        <div class="row wrap" style="gap:8px;align-items:center">
          <span class="f3d-live"><i></i>লাইভ</span>
          <button class="btn btn-sm f3d-more" type="button" data-act="go" data-page="attendance">${icon('clock')} বিস্তারিত</button>
        </div>
      </div>
      <div class="f3d-grid">${cards||`<div class="f3d-empty">কর্মী যোগ করুন — সেটিংস → কর্মী</div>`}</div>
      <div class="f3d-sum">
        <div><b>${fmtNum(present)}</b><span>উপস্থিত</span></div>
        <div><b>${fmtNum(out)}</b><span>চেক আউট</span></div>
        <div><b>${fmtNum(late)}</b><span>দেরি</span></div>
        <div><b>${fmtNum(Math.max(0,roster.length-present))}</b><span>অনুপস্থিত</span></div>
        <div><b>${fmtNum(roster.length)}</b><span>মোট কর্মী</span></div>

/* আপডেট ৩৭: হাজিরা কার্ডের লোকেশন ৪৫ সেকেন্ডে হালনাগাদ; লুকানো ট্যাব/অন্য পেজে বিরতি। */
let fAttRefreshTimer=null;
function startFAttRefresh(){if(fAttRefreshTimer)clearInterval(fAttRefreshTimer);fAttRefreshTimer=setInterval(()=>{if(document.hidden||S.page!=='dashboard'||document.querySelector('.modal-backdrop,.modal.open'))return;const grid=document.querySelector('.f3d-grid');if(grid){const tmp=document.createElement('div');tmp.innerHTML=fAttBoard(todayISO());const fresh=tmp.querySelector('.f3d-grid');if(fresh)grid.replaceWith(fresh)}},45000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.page==='dashboard')startFAttRefresh()});
function renderDashboard(){
  startFAttRefresh();
  const today=todayISO(),from=monthStart(today),year=today.slice(0,4);
  const monthSales=salesInRange(from,today,S.loc);
  const monthRaw=vals(DATA.rawLots).filter(x=>x.date>=from&&x.date<=today&&(!S.loc||x.locationId===S.loc));
  const monthExpenses=vals(DATA.expenses).filter(x=>x.date>=from&&x.date<=today&&(!S.loc||x.locationId===S.loc));
  const purchaseTotal=sum(monthRaw,x=>n(x.qty)*n(x.rate)+n(x.transport)+n(x.loading));
  const expenseTotal=sum(monthExpenses,'amount');
  const receivable=balanceSheet(today).assets.receivable;
  const payable=balanceSheet(today).liabilities.payable;
  const stockTotal=stockValueRaw(S.loc)+stockValueSemi(S.loc)+stockValueFG(S.loc)+wipValue(S.loc);
  const cash=cashBalance(today),bank=round2(trialBalance(today).rows.find(r=>r.code==='1010')?.debit-trialBalance(today).rows.find(r=>r.code==='1010')?.credit||0);
  const suppliers=new Set(vals(DATA.rawLots).map(x=>String(x.supplier||'').trim()).filter(Boolean));
  const customers=new Set(vals(DATA.sales).map(x=>String(x.customer||x.customerName||'').trim()).filter(Boolean));
  const pending=pendingTotalCount(),low=lowStockItems();
  const alerts=[];
  if(S.conn==='firebase-empty')alerts.push(`<div class="alert">${icon('warn')}<div><b>Firebase সংযুক্ত, কিন্তু ডেটা খালি।</b> সেটআপ পেজ থেকে ডেটা যোগ করুন।</div></div>`);
  /* সতর্কতা কার্ড বাদ — সব সতর্কতা এখন নোটিফিকেশন আইকনে */

  const monthRows=Array.from({length:12},(_,i)=>{
    const key=`${year}-${String(i+1).padStart(2,'0')}`,last=isoOf(new Date(Number(year),i+1,0));
    const ss=salesInRange(key+'-01',last,S.loc);
    const pp=vals(DATA.rawLots).filter(x=>String(x.date||'').slice(0,7)===key&&(!S.loc||x.locationId===S.loc));
    const ee=vals(DATA.expenses).filter(x=>String(x.date||'').slice(0,7)===key&&(!S.loc||x.locationId===S.loc));
    return {label:MONTHS_SHORT[i],sales:sum(ss,'actual'),purchase:sum(pp,x=>n(x.qty)*n(x.rate)+n(x.transport)+n(x.loading)),expense:sum(ee,'amount')};
  });
  const chartSvg=(series,keys,kind='line')=>{
    const W=330,H=128,L=34,R=8,T=8,B=20,plotW=W-L-R,plotH=H-T-B;
    const maxV=Math.max(1,...series.flatMap(s=>s.values));
    const grid=[0,.5,1].map(k=>`<line x1="${L}" y1="${T+plotH*k}" x2="${W-R}" y2="${T+plotH*k}" stroke="#edf1f7" stroke-width="1"/>`).join('');
    let shapes='';
    if(kind==='bars'){
      const step=plotW/keys.length,bw=Math.max(3,Math.min(11,step*.48));
      shapes=series.map((s,si)=>s.values.map((v,i)=>{
        const x=L+step*i+step/2+(si-(series.length-1)/2)*(bw+2)-bw/2;
        const h=(v/maxV)*plotH;
        return `<rect x="${x.toFixed(1)}" y="${(T+plotH-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="2" fill="${s.color}"/>`;
      }).join('')).join('');
    }else{
      shapes=series.map(s=>{
        const pts=s.values.map((v,i)=>`${(L+(plotW/Math.max(1,s.values.length-1))*i).toFixed(1)},${(T+plotH-(v/maxV)*plotH).toFixed(1)}`).join(' ');
        return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`+
          s.values.map((v,i)=>`<circle cx="${(L+(plotW/Math.max(1,s.values.length-1))*i).toFixed(1)}" cy="${(T+plotH-(v/maxV)*plotH).toFixed(1)}" r="2" fill="${s.color}"/>`).join('');
      }).join('');
    }
    const labels=keys.map((k,i)=>`<text x="${L+(plotW/Math.max(1,keys.length-1))*i}" y="${H-4}" text-anchor="middle">${k}</text>`).join('');
    return `<svg class="dash-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="লেনদেনের চার্ট">${grid}${shapes}${labels}</svg>`;
  };
  const yearlySales=chartSvg([{values:monthRows.map(x=>x.sales),color:'#1769e0'}],monthRows.map(x=>x.label),'bars');
  const monthlyCompare=chartSvg([{values:monthRows.map(x=>x.sales),color:'#1769e0'},{values:monthRows.map(x=>x.purchase),color:'#18a47c'}],monthRows.map(x=>x.label));
  const annualCompare=chartSvg([{values:monthRows.map(x=>x.purchase),color:'#18a47c'},{values:monthRows.map(x=>x.expense),color:'#1769e0'}],monthRows.map(x=>x.label));
  const recent=[];

  recent.sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  const top=(label,value,note,ic,tone,soft)=>`<div class="ref-kpi" style="--tone:${tone};--soft:${soft}"><div class="ref-kpi-head"><span class="ref-kpi-label">${label}</span><span class="ref-kpi-icon">${icon(ic)}</span></div><div class="ref-kpi-value">${value}</div><div class="ref-kpi-note">${note}</div></div>`;

        <p>${fmtDate(today)} · ${DAYS_BN[new Date(today+'T00:00:00').getDay()]} — ${esc(S.loc?locShort(S.loc):'সব লোকেশন')}। স্টক, প্রোডাকশন, বিক্রয় ও হিসাব এক জায়গায় পরিচালনা করুন।</p>
        <div class="dashboard-hero-actions">
          <button class="btn hero-primary" data-act="add-raw">${icon('plus')} মাল ক্রয়</button>
          <button class="btn hero-secondary" data-act="add-sale">${icon('cart')} বিক্রয় এন্ট্রি</button>
          <button class="btn hero-secondary" data-act="add-issue">${icon('factory')} প্রোডাকশন আউটপুট</button>
        </div>
      </div>
    </section>
    ${alerts.length?`<div class="stack-alerts">${alerts.slice(0,2).join('')}</div>`:''}
    <div class="ref-color-row">
      ${tile('মোট পাওনা (Receivable)',tk(receivable),'book','purple')}

      ${tile('মোট স্টক মূল্য',tk(stockTotal),'box','blue')}
      ${tile('মোট খরচ (Expense)',tk(expenseTotal),'wallet','green')}
    </div>
    <div class="ref-people-row">
      <div class="ref-people">${icon('users')}<div><span>মোট সাপ্লায়ার</span><b>${fmtNum(suppliers.size)}</b></div></div>
      <div class="ref-people red">${icon('users')}<div><span>মোট কাস্টমার</span><b>${fmtNum(customers.size)}</b></div></div>

function daysDiff(a,b=todayISO()){return Math.max(0,Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000));}
function tabButton(label,active,tab,value){return `<button type="button" class="${active?'active':''}" data-act="tab" data-tab="${tab}" data-value="${value}">${esc(label)}</button>`;}
function countKindLabel(kind){return {raw:'কাঁচামাল',semi:'সেমি-ফিনিশড',fg:'ফিনিশড গুডস',point:'ডেলিভারি পয়েন্ট'}[kind]||kind;}
function countRefName(c){return c.kind==='point'||c.kind==='fg'?productName(c.productId||c.refId):itemName(c.itemId||c.refId);}
function decisionButton(kind,id){if(!canApprove()) return '';return `<button class="btn btn-xs btn-primary" data-act="decision" data-kind="${kind}" data-id="${esc(id)}">সিদ্ধান্ত</button>`;}

    return {item:i,qty,val,min:n(i.minQty),low:n(i.minQty)>0&&qty<n(i.minQty)};
  }).sort((a,b)=>a.item.name.localeCompare(b.item.name,'bn'));
  const rawTotal=sum(rawItems,'val');
  const semiItems=vals(DATA.items).map(i=>{
    const lots=semiStock(i.id,S.loc);

  const semiTotal=sum(semiItems,'val');

function dispatchStats(d){
  const ss=vals(DATA.sales).filter(s=>s.dispatchId===d.id&&s.status!=='rejected');
  const sold=sum(ss,'qtySold'),returned=sum(ss,'qtyReturned');
  return {sold,returned,balance:round3(n(d.qty)-sold),sales:ss};
}

function ensureFaceApi(){
  return new Promise(async(resolve,reject)=>{
    try{
      if(!window.faceapi){
        await loadScript(FACE_SCRIPT);
      }

async function startCamera(videoId='cam-video'){
  S.camWant=true;

  if(!video) throw new Error('ক্যামেরা ভিউ পাওয়া যায়নি');

  stopCamera();

  S.cam=stream;S.camTarget=videoId;

function snapVideo(videoId='cam-video'){
  const video=document.getElementById(videoId);

  const w=360,h=Math.round(video.videoHeight/video.videoWidth*360);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,w,h);
  return c.toDataURL('image/jpeg',0.55);
}

function distance(a,b){
  if(!a||!b||a.length!==b.length) return 99;
  let s=0;for(let i=0;i<a.length;i++){const d=n(a[i])-n(b[i]);s+=d*d;}
  return Math.sqrt(s);
}
function faceMatchEmployee(desc){
  let best=null;
  for(const emp of vals(DATA.employees)){
    if(!emp.active||!emp.faceDescriptor?.length) continue;
    const d=distance(desc,emp.faceDescriptor);
    if(!best||d<best.distance) best={employee:emp,distance:d};
  }
  return best&&best.distance<=0.58?best:null;
}

async function punchEmployee(empId,method='pin',photo=null){

    /* Legacy হাজিরা থাকলে সেটিকে প্রথম সেশন হিসেবে ধরে সর্বোচ্চ ৩টি ইন/আউট জোড়া */
    const sessions=Array.isArray(day?.sessions)?day.sessions.map(x=>({...x})):(day?.in?[{in:day.in,out:day.out||null,method:day.method||'pin',inPhoto:day.inPhoto||null,outPhoto:day.outPhoto||null}]:[]);

      else{const l=await fGrabLocation();if(l)locPatch={loc:l.name,lat:l.lat,lon:l.lon,locAt:time,locLive:true};}
      sessions.push({in:time,out:null,method:'face',inPhoto:photo||null});

  if(checkedOut){fStopTrack(empId);fTrackSet(empId,false);}
