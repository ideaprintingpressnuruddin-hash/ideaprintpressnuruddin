<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3d27">
<title>আইডিয়া প্রিন্টিং প্রেস — স্টক, সেলস ও হিসাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f1;--panel:#ffffff;--ink:#15241c;--muted:#6b7b71;--line:#e1e7e0;
  --brand:#14603a;--brand-2:#0f3d27;--brand-soft:#e7f2ea;--brand-line:#c8e2d1;
  --gold:#b7791f;--gold-soft:#fdf5e6;--danger:#b42318;--danger-soft:#fdeceb;
  --warn:#b45309;--warn-soft:#fff4e5;--info:#1d4ed8;--info-soft:#eef2ff;
  --radius:16px;--radius-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 30px rgba(16,24,40,.05);
  --font:'Hind Siliguri','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
a{color:var(--brand);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.b{font-weight:600}
.strong{font-weight:700}
.right{text-align:right}
.center{text-align:center}
.nowrap{white-space:nowrap}
.mono{font-family:'Inter',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb0{margin-bottom:0}
.divider{height:1px;background:var(--line);margin:16px 0}
.shell{min-height:100vh;display:grid;grid-template-columns:256px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#0f3d27 0%,#0b2f1e 100%);color:#e9f3ec;padding:22px 14px 18px;display:flex;flex-direction:column;z-index:60;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand-mark{width:44px;height:44px;border-radius:13px;background:#f7fbf8;color:#0f3d27;display:grid;place-items:center;font-weight:700;font-size:22px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.brand-txt strong{display:block;font-size:15.5px;line-height:1.25;font-weight:700;letter-spacing:.1px}
.brand-txt span{display:block;font-size:11px;color:#a9c9b6;margin-top:2px;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#89ab98;padding:16px 12px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#d7e8dd;font-size:14px;font-weight:500;transition:.15s;position:relative}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:#eaf5ee;color:#0f3d27;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.nav a.active .ic{color:#14603a}
.nav a .ic{width:18px;height:18px;color:#a9c9b6}
.nav-badge{margin-left:auto;background:#f0b54a;color:#2c1c02;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#8fb09d;line-height:1.6}
.side-foot b{color:#d8e9df;display:block;font-weight:600;font-size:12px}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;background:rgba(243,245,241,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px}
.menu-btn{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;place-items:center}
.page-head{min-width:0}
.page-head h1{font-size:19px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.2px}
.page-head p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.loc-select{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12.5px;color:#37473e}
.loc-select .ic{width:15px;height:15px;color:var(--muted)}
.loc-select select{border:0;background:transparent;outline:0;font-size:12.5px;font-weight:600;max-width:145px;padding:1px 2px}
.role-pill,.conn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:#33443a;white-space:nowrap}
.role-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.conn .dot{width:7px;height:7px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.12)}
.conn.demo .dot{background:#b7791f;box-shadow:0 0 0 3px rgba(183,121,31,.14)}
.conn.err .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(180,35,24,.12)}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;display:grid;place-items:center;color:#405147}
.icon-btn:hover{background:#f7faf7;border-color:#ced9cf}
.content{padding:24px 26px 40px;max-width:1560px;width:100%;margin:0 auto}
.foot{padding:18px 26px 30px;color:#88958c;font-size:11.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1560px;margin:0 auto;width:100%}
.page-enter{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h2{font-size:15px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.card-head h2 .ic{width:17px;height:17px;color:var(--brand)}
.card-head p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.card-body{padding:18px 20px}
.card.flush .card-head{padding:16px 20px 0;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:76px;height:76px;border-radius:50%;background:var(--brand-soft);opacity:.6}
.stat-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);margin-bottom:12px;position:relative;z-index:1}
.stat-label{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.2px;position:relative;z-index:1}
.stat-value{font-size:25px;line-height:1.25;font-weight:700;letter-spacing:-.5px;margin-top:2px;position:relative;z-index:1}
.stat-sub{font-size:11.5px;color:var(--muted);margin-top:4px;position:relative;z-index:1}
.stat-sub.up{color:var(--brand)}
.stat-sub.warn{color:var(--warn)}
.stat.gold .stat-icon{background:var(--gold-soft);color:var(--gold)}
.stat.gold::after{background:var(--gold-soft)}
.stat.blue .stat-icon{background:var(--info-soft);color:var(--info)}
.stat.blue::after{background:var(--info-soft)}
.stat.red .stat-icon{background:var(--danger-soft);color:var(--danger)}
.stat.red::after{background:var(--danger-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;color:#2e4036;transition:.15s;white-space:nowrap}
.btn:hover{background:#f7faf7;border-color:#cbd8cd}
.btn .ic{width:16px;height:16px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:#0f4d2e;border-color:#0f4d2e}
.btn-dark{background:#22342a;border-color:#22342a;color:#fff}
.btn-dark:hover{background:#16251d}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn-gold:hover{background:#9c6517}
.btn-danger{background:#fff;border-color:#f1c7c3;color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn-xs{padding:3px 8px;font-size:11.5px;border-radius:7px}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link-btn{border:0;background:none;padding:0;color:var(--brand);font-weight:600;font-size:12.5px}
.link-btn.danger{color:var(--danger)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;gap:4px;background:#eaeee9;padding:4px;border-radius:11px;flex-wrap:wrap;width:fit-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:#5b6b61}
.tabs button.active{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:600;color:#546459}
.chip.active,.chip:hover{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f1f4f0;color:#546459;white-space:nowrap;line-height:1.7}
.badge.green{background:var(--brand-soft);color:#14603a}
.badge.gold{background:var(--gold-soft);color:#8a5a11}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.badge.blue{background:var(--info-soft);color:#1e40af}
.badge.gray{background:#eef1ed;color:#5d6b62}
.badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid #f0d9a8;background:#fffaf0;border-radius:12px;padding:11px 13px;font-size:12.5px;color:#7a4d0a}
.alert .ic{width:17px;height:17px;margin-top:1px}
.alert.red{border-color:#f2c9c5;background:#fff6f5;color:#8f2b21}
.alert.green{border-color:var(--brand-line);background:#f1f8f3;color:#14603a}
.alert.blue{border-color:#cfd9fb;background:#f6f8ff;color:#2743a3}
.stack-alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
table.tbl th{background:#f7f9f6;text-align:left;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#78867d;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.tbl td{padding:9px 12px;border-bottom:1px solid #edf1ec;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:#fafcf9}
table.tbl tfoot td{background:#f7f9f6;font-weight:700;border-top:1px solid var(--line);border-bottom:0}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl .sub{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
table.tbl.compact td{padding:7px 10px}
table.tbl.compact th{padding:7px 10px}
.t-main{font-weight:600;color:#24352b}
.t-sub{font-size:10.5px;color:var(--muted)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:12.5px}
.empty .ic{width:30px;height:30px;margin:0 auto 8px;color:#9eada3}
.table-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0 0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;font-weight:600;color:#53645a}
.field .hint{font-size:10.5px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid #d7e0d8;background:#fff;border-radius:9px;padding:8px 10px;font-size:13px;outline:0;transition:.15s;min-height:38px}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#73b28c;box-shadow:0 0 0 3px rgba(20,96,58,.09)}
.field input:disabled,.field select:disabled{background:#f4f6f3;color:#7c8a81}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form-grid .span2{grid-column:span 2}
.form-grid .span3{grid-column:1/-1}
.form-note{font-size:11.5px;color:var(--muted);line-height:1.55}
.inline-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.inline-form .field{flex:1;min-width:120px}
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-backdrop{position:absolute;inset:0;background:rgba(9,24,16,.52);backdrop-filter:blur(3px)}
.modal{position:relative;background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.25);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease}
.modal.wide{max-width:860px}
@keyframes pop{from{opacity:0;transform:scale(.98) translateY(6px)}to{opacity:1;transform:none}}
.modal-head{padding:18px 20px 13px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.modal-head h3{margin:0;font-size:16px;font-weight:700}
.modal-head p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.modal-head .icon-btn{margin-left:auto;flex:none;width:32px;height:32px;border:0;background:#f2f5f1}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:8px;background:#fbfcfa}
.modal-foot .left{margin-right:auto;font-size:11.5px;color:var(--muted)}
.cam-box{position:relative;background:#0c1711;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;color:#c9dbd0}
.cam-box video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-box .cam-hint{position:absolute;inset:auto 10px 10px;background:rgba(6,18,11,.72);color:#e4f1e8;font-size:11.5px;border-radius:8px;padding:6px 9px;text-align:center}
.cam-box .cam-empty{padding:24px;text-align:center;font-size:12px;color:#a9c4b4}
.cam-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.face-result{border:1px solid var(--brand-line);background:#f3faf5;border-radius:12px;padding:12px;display:flex;gap:11px;align-items:center;margin-top:10px}
.face-avatar{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:inline-grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.avatar.gold{background:var(--gold-soft);color:#8a5a11}
.avatar.blue{background:var(--info-soft);color:#1e40af}
.avatar.red{background:var(--danger-soft);color:var(--danger)}
.avatar.gray{background:#eef1ed;color:#5d6b62}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:12px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:34px;background:linear-gradient(180deg,#2f8a5b,#14603a);border-radius:6px 6px 2px 2px;min-height:2px;position:relative;transition:.2s}
.bar:hover{filter:brightness(1.1)}
.bar-val{font-size:9.5px;color:var(--muted);white-space:nowrap}
.bar-x{font-size:9.5px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}
.progress{height:7px;background:#edf1ec;border-radius:99px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--brand);border-radius:99px}
.progress.gold > i{background:var(--gold)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:12.5px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right}
.loc-card{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.loc-card:last-child{border-bottom:0;padding-bottom:0}
.loc-icon{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.loc-card strong{display:block;font-size:13px}
.loc-card span{display:block;font-size:11px;color:var(--muted)}
.amount-pos{color:var(--brand);font-weight:600}
.amount-neg{color:var(--danger);font-weight:600}
.att-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.att-cell{border-radius:6px;text-align:center;font-size:10px;padding:4px 2px;background:#f2f5f1;color:#6e7d73;min-height:28px}
.att-cell.p{background:#dff1e5;color:#14603a;font-weight:600}
.att-cell.l{background:#fdf1d9;color:#8a5a11;font-weight:600}
.att-cell.a{background:#fdeceb;color:#b42318}
.code{background:#0f2419;color:#d8f0e2;border-radius:11px;padding:13px 15px;font-family:'Inter',ui-monospace,monospace;font-size:11px;line-height:1.65;overflow:auto;max-height:260px;white-space:pre;position:relative}
.code-box{position:relative}
.code-box .copy{position:absolute;right:8px;top:8px;background:#274a37;color:#dcf1e4;border:0;border-radius:7px;padding:4px 8px;font-size:10.5px}
.steps{counter-reset:step;display:flex;flex-direction:column;gap:14px}
.step{display:flex;gap:12px;position:relative}
.step-n{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;counter-increment:step}
.step-n::before{content:counter(step)}
.step strong{display:block;font-size:12.5px;margin-bottom:2px}
.step p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.6}
.step code{background:#f1f4f0;border-radius:4px;padding:0 4px;font-size:10.5px}
.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-main{min-width:0;flex:1}
.list-main strong{display:block;font-size:12.5px;line-height:1.35}
.list-main span{display:block;font-size:10.5px;color:var(--muted)}
.list-val{font-size:12.5px;font-weight:600;white-space:nowrap;text-align:right}
.list-val small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.tab-content{display:flex;flex-direction:column;gap:16px}
.scroll-x{overflow-x:auto}
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(360px,90vw)}
.toast{background:#1d3327;color:#eaf5ee;border-radius:11px;padding:10px 14px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:slide .2s ease;display:flex;gap:8px;align-items:flex-start}
.toast.good{background:#14532d}
.toast.bad{background:#8f2b21}
.toast.info{background:#1e3a8a}
.toast .ic{width:16px;height:16px;margin-top:1px}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.banner{background:linear-gradient(120deg,#0f3d27,#1d6b45);color:#f0f8f3;border-radius:18px;padding:22px 24px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(15,61,39,.18)}
.banner::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06)}
.banner::before{content:"";position:absolute;right:90px;bottom:-110px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.05)}
.banner h2{margin:0;font-size:20px;letter-spacing:-.3px}
.banner p{margin:5px 0 0;color:#c8e0d1;font-size:12px;max-width:640px}
.banner .row{margin-top:14px;position:relative;z-index:1}
.banner .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.banner .btn:hover{background:rgba(255,255,255,.2)}
.banner .btn-primary{background:#fff;border-color:#fff;color:#0f3d27}
.banner .btn-primary:hover{background:#eef6f0}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.quick-btn{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:11.5px;font-weight:600;color:#33443a;text-align:left;transition:.15s;min-height:83px}
.quick-btn:hover{border-color:var(--brand-line);background:#f6fbf7;transform:translateY(-1px)}
.quick-btn .ic{width:18px;height:18px;color:var(--brand)}
.quick-btn span{line-height:1.35}
.overlay{display:none}
.searchbox{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:#fff;min-width:170px}
.searchbox input{border:0;outline:0;background:none;font-size:12px;width:100%;min-width:70px}
.searchbox .ic{width:14px;height:14px;color:#8a978e}
.filter-bar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.filter-bar .field{min-width:120px}
.filter-bar .field.grow{min-width:180px}
.stat-mini{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff}
.stat-mini .ic{width:17px;height:17px;color:var(--brand)}
.stat-mini b{display:block;font-size:13px;line-height:1.2}
.stat-mini span{display:block;font-size:10px;color:var(--muted)}
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .setup-grid{grid-template-columns:1fr}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:266px;transform:translateX(-104%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .sidebar.open{transform:none}
  .overlay{display:block;position:fixed;inset:0;background:rgba(8,20,13,.4);z-index:50;opacity:0;pointer-events:none;transition:.2s}
  .overlay.show{opacity:1;pointer-events:auto}
  .menu-btn{display:grid}
  .content{padding:18px 16px 34px}
  .topbar{padding:10px 14px;flex-wrap:wrap}
  .page-head h1{font-size:16px}
  .page-head p{display:none}
  .top-actions .loc-select{display:none}
  .top-actions{gap:6px}
  .role-pill,.conn{font-size:10.5px;padding:5px 9px}
  .icon-btn{width:34px;height:34px}
  .banner{padding:18px}
  .banner h2{font-size:17px}
  .form-grid{grid-template-columns:1fr}
  .form-grid .span2,.form-grid .span3{grid-column:auto}
  .g2{grid-template-columns:1fr}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat-value{font-size:21px}
  .modal-wrap{padding:8px;align-items:flex-end}
  .modal{max-height:94vh;border-radius:16px 16px 10px 10px}
  .att-grid{gap:3px}
  .att-cell{font-size:9px}
}
@media (max-width:560px){
  .g4,.g3{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content{padding:14px 12px 30px}
  .card{padding:14px}
  .card-body{padding:14px}
  .card.flush .card-head{padding:14px 14px 0}
  .table-wrap{border-radius:10px}
  table.tbl{font-size:11.5px}
  table.tbl th,table.tbl td{padding:7px 9px}
  .stat{padding:13px}
  .stat-value{font-size:19px}
  .top-actions .role-label{display:none}
  .banner .row .btn{flex:1}
  .modal-head,.modal-body,.modal-foot{padding-left:14px;padding-right:14px}
}
.auth-screen{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:radial-gradient(1200px 700px at 8% 0%,#1b6b45 0%,#0f3d27 46%,#0a2b1b 100%)}
.auth-aside{color:#e8f5ec;padding:54px 52px;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:640px}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.auth-brand .brand-mark{width:46px;height:46px;border-radius:13px;background:#fff;color:var(--brand-2);display:grid;place-items:center;font-weight:700;font-size:22px}
.auth-brand strong{display:block;font-size:16px;line-height:1.2}
.auth-brand span{display:block;font-size:11.5px;opacity:.75;letter-spacing:.04em}
.auth-aside h2{font-size:30px;line-height:1.25;margin:8px 0 0;font-weight:700}
.auth-aside p{margin:0;color:#bfdccb;font-size:14px;max-width:460px}
.auth-points{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.auth-points div{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:#d7ebde}
.auth-points .ic{width:17px;height:17px;margin-top:2px;color:#8fd0aa}
.auth-panel{display:grid;place-items:center;padding:28px 20px;background:rgba(243,245,241,.06)}
.auth-card{width:100%;max-width:430px;background:#fff;border-radius:18px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.auth-card h3{margin:6px 0 4px;font-size:22px}
.auth-badge{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-line);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600}
.auth-card .field{margin-top:12px}
.auth-card form .btn{width:100%;justify-content:center;margin-top:16px}
.auth-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.auth-actions .btn{flex:1;justify-content:center;min-width:120px}
.auth-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.auth-uid{font-family:'Inter',ui-monospace,monospace;font-size:11px;background:#f3f5f1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all;margin-top:8px}
.auth-alert{display:flex;gap:9px;align-items:flex-start;background:var(--warn-soft);border:1px solid #f3d9b0;color:#7a4a0b;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:12px}
.auth-alert .ic{width:17px;height:17px;margin-top:1px;flex:none}
.auth-alert.red{background:var(--danger-soft);border-color:#f3c7c3;color:#8f231a}
.auth-alert.blue{background:var(--info-soft);border-color:#cdd8fb;color:#1d3a8a}
@media (max-width:900px){.auth-screen{grid-template-columns:1fr}.auth-aside{display:none}.auth-panel{background:transparent;padding:18px 14px;align-items:center}.auth-card{padding:22px}}
@media print{
  .sidebar,.topbar,.foot,.no-print,.toast-wrap,.modal-wrap{display:none!important}
  .content{padding:0;max-width:none}
  body{background:#fff;font-size:11px}
  .card,.stat{box-shadow:none;border:1px solid #ccc;break-inside:avoid;border-radius:6px}
  .shell{display:block}
  .print-title{display:block!important;margin:0 0 14px}
  table.tbl th{position:static}
  .table-wrap{overflow:visible}
  table.tbl{min-width:0}
  a{color:#000}

function planConsume(kind,key,locationId,qty){
  const map={raw:'rawLots',semi:'semiLots',fg:'fgLots'};
  const coll=map[kind];
  const lots=vals(DATA[coll]).filter(l=>n(l.remaining)>0&&l.locationId===locationId&&(kind==='fg'?l.productId===key:l.itemId===key)).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id).localeCompare(String(b.id)));
  let left=round3(qty),cost=0;const updates=[],lines=[];
  for(const lot of lots){
    if(left<=0.0001) break;
    const take=Math.min(n(lot.remaining),left);
    const unit=kind==='raw'?lotRate(lot):n(lot.unitCost);
    cost+=take*unit;left=round3(left-take);
    updates.push({path:`${coll}/${lot.id}`,value:{...lot,remaining:round3(n(lot.remaining)-take)}});
    lines.push({lotId:lot.id,date:lot.date,itemId:lot.itemId,productId:lot.productId,qty:take,unitCost:round2(unit),cost:round2(take*unit),lot});
  }
  return {updates,cost:round2(cost),consumed:round3(n(qty)-left),lines,short:round3(left)};
}

  try{localStorage.setItem(LS_DEMO,JSON.stringify(seed));}catch(e){}
  return seed;
}
function persistDemo(){
  try{localStorage.setItem(LS_DEMO,JSON.stringify(DATA));}
  catch(e){
    try{
      const copy=structuredClone(DATA);
      for(const emp of Object.values(copy.attendance||{})){
        for(const day of Object.values(emp||{})){delete day.inPhoto;delete day.outPhoto;}

      localStorage.setItem(LS_DEMO,JSON.stringify(copy));

  }
}

function setData(raw){
  DATA=normalizeData(raw);
  if(S.loc&&!DATA.locations[S.loc]) S.loc='';
}
async function batch(updates){
  const list=(updates||[]).filter(Boolean);
  if(!list.length) return;
  if(S.mode==='firebase'&&FB.db){
    const obj={};
    for(const u of list){obj[u.path]=u.value;}
    await FB.mods.update(FB.mods.ref(FB.db,'ips'),obj);
  }else{
    for(const u of list){
      if(u.value===null) delPath(DATA,u.path);
      else setPath(DATA,u.path,structuredClone(u.value));
    }
    DATA=normalizeData(DATA);
    persistDemo();
    render();
  }
}
async function replaceData(raw){
  if(S.mode==='firebase'&&FB.db){
    await FB.mods.set(FB.mods.ref(FB.db,'ips'),raw);
  }else{
    DATA=normalizeData(raw);persistDemo();render();
  }
}
async function connectFirebase(cfg){
  const [appMod,dbMod,authMod]=await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-database.js`),
    import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-auth.js`)
  ]);
  if(authUnsub){try{authUnsub();}catch(e){}authUnsub=null;}
  detachData();
  if(FB.app){try{await appMod.deleteApp(FB.app);}catch(e){}}
  FB.app=appMod.initializeApp(cfg,'ips-app');
  FB.cfg=cfg;FB.appMod=appMod;FB.authMod=authMod;
  FB.db=dbMod.getDatabase(FB.app);
  FB.mods={ref:dbMod.ref,onValue:dbMod.onValue,set:dbMod.set,update:dbMod.update,get:dbMod.get,remove:dbMod.remove};
  FB.ready=false;
  S.mode='firebase';S.conn='connecting';S.user=null;S.userProfile=null;S.users=null;S.usersError='';S.authError='';
  localStorage.setItem(LS_CFG,JSON.stringify(cfg));
  localStorage.removeItem(LS_FORCE_DEMO);
  FB.auth=authMod.getAuth(FB.app);
  authUnsub=authMod.onAuthStateChanged(FB.auth,user=>{
    handleAuthState(user).catch(err=>{
      console.error(err);
      S.conn='auth-error';S.authError=err?.message||'লগইন অবস্থা পড়া যায়নি';render();
    });
  });
  render();
}

async function handleAuthState(user){
  if(user&&user.isAnonymous){
    try{await FB.authMod.signOut(FB.auth);}catch(e){}
    return;
  }
  if(!user){
    detachData();
    S.user=null;S.userProfile=null;S.users=null;S.usersError='';S.authError='';
    S.mode='firebase';S.conn='signed-out';FB.ready=false;
    render();
    return;
  }
  S.user={uid:user.uid,email:user.email||''};
  S.mode='firebase';S.conn='connecting';S.authError='';
  render();
  let prof=null;
  try{
    const snap=await FB.mods.get(FB.mods.ref(FB.db,'users/'+user.uid));
    prof=snap.val();
  }catch(err){
    S.conn='auth-error';
    S.authError='ব্যবহারকারীর প্রোফাইল পড়া যায়নি: '+authErrorText(err);
    FB.ready=false;detachData();
    render();
    return;
  }
  if(!prof||prof.active===false){
    S.userProfile=prof||null;
    S.conn='no-profile';
    FB.ready=false;detachData();
    render();
    return;
  }
  S.userProfile={...prof,uid:user.uid,email:prof.email||user.email||''};
  S.role=ROLE_NAMES[prof.role]?prof.role:'operator';
  savePref();
  attachData();
}

function attachData(){
  detachData();
  if(!FB.db||!FB.mods) return;
  S.conn='connecting';
  dataUnsub=FB.mods.onValue(FB.mods.ref(FB.db,'ips'),snap=>{
    const v=snap.val();
    setData(v||emptyData());
    S.mode='firebase';FB.ready=true;
    S.conn=v?'firebase':'firebase-empty';
    render();
  },err=>{
    S.conn='error';S.authError='ডেটা পড়া যায়নি: '+err.message;FB.ready=false;
    render();
  });
}

function detachData(){
  if(dataUnsub){try{dataUnsub();}catch(e){}dataUnsub=null;}
  FB.ready=false;
}

async function loadUsers(force=false){
  if(S.mode!=='firebase'||!FB.db||!FB.mods||!S.userProfile||S.userProfile.role!=='admin') return;
  if(S.usersLoading) return;
  if(S.users&&!force) return;
  S.usersLoading=true;S.usersError='';
  try{
    const snap=await FB.mods.get(FB.mods.ref(FB.db,'users'));
    S.users=snap.val()||{};
  }catch(err){
    S.usersError='ব্যবহারকারী তালিকা পড়া যায়নি: '+authErrorText(err);
  }
  S.usersLoading=false;
  if(S.page==='setup') render();
}

async function provisionAuthUser(email,password){
  if(!FB.appMod||!FB.authMod||!FB.cfg) throw new Error('Firebase সংযোগ নেই');
  const name='ips-provision-'+Date.now();
  const app2=FB.appMod.initializeApp(FB.cfg,name);
  try{
    const a2=FB.authMod.getAuth(app2);
    const cred=await FB.authMod.createUserWithEmailAndPassword(a2,email,password);
    const uid=cred.user.uid;
    await FB.authMod.signOut(a2);
    return uid;
  }catch(err){
    throw new Error(authErrorText(err));
  }finally{
    try{await FB.appMod.deleteApp(app2);}catch(e){}
  }
}

function disconnectFirebase(){
  detachData();
  if(authUnsub){try{authUnsub();}catch(e){}authUnsub=null;}
  if(FB.auth&&FB.authMod){try{FB.authMod.signOut(FB.auth);}catch(e){}}
  FB.ready=false;FB.cfg=null;
  S.user=null;S.userProfile=null;S.users=null;S.usersError='';S.authError='';
  S.mode='demo';S.conn='demo';
  localStorage.removeItem(LS_CFG);
  localStorage.setItem(LS_FORCE_DEMO,'1');
  DATA=loadDemo();render();
}

function leaveDays(l){
  if(!l?.from||!l?.to) return 0;
  const a=new Date(l.from+'T12:00:00'),b=new Date(l.to+'T12:00:00');
  if(isNaN(a)||isNaN(b)||b<a) return 0;
  return Math.round((b-a)/86400000)+1;
}

function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('কপি হয়েছে','good')).catch(()=>toast('কপি করা যায়নি','bad'));
  }else{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('কপি হয়েছে','good');}catch(e){toast('কপি করা যায়নি','bad');}
    ta.remove();
  }
}

  if(a>=100000) return `৳${fmtNum(x/100000,1)} লাখ`;

function assetDep(asset,asOf=todayISO()){
  const start=new Date(asset.purchaseDate+'T12:00:00');
  const end=new Date(asOf+'T12:00:00');
  if(isNaN(start)||isNaN(end)||end<start) return {total:0,monthly:0,schedule:[],nbv:round2(n(asset.cost))};
  const months=(end.getFullYear()-start.getFullYear())*12+(end.getMonth()-start.getMonth())+1;
  const cost=n(asset.cost),salvage=n(asset.salvage),cap=Math.max(0,cost-salvage);
  let total=0,opening=cost;const schedule=[];
  for(let i=0;i<months&&i<600;i++){
    let amount=asset.method==='declining'?opening*n(asset.rate||10)/100/12:(cap/Math.max(1,n(asset.lifeYears||5))/12);
    amount=round2(Math.min(amount,cap-total));
    if(amount<=0) break;
    const dt=new Date(start.getFullYear(),start.getMonth()+i+1,0);
    let d=isoOf(dt);if(d>asOf) d=asOf;
    schedule.push({date:d,amount});
    total=round2(total+amount);opening=round2(opening-amount);
  }
  return {total,monthly:schedule.length?schedule[schedule.length-1].amount:0,schedule,nbv:round2(cost-total)};
}

function buildJournal(){
  const entries=[];
  const add=(date,code,debit,credit,desc,refType='',refId='')=>{
    debit=round2(debit);credit=round2(credit);
    if(!date||(debit===0&&credit===0)) return;
    entries.push({date:String(date).slice(0,10),code,debit,credit,desc,refType,refId});
  };
  const op=DATA.settings.opening||{};
  const oa=n(op.cash)+n(op.bank)+n(op.inventory)+n(op.fixedAssets);
  const ol=n(op.liabilities);
  if(oa||ol){
    const date=DATA.settings.openingDate||'2000-01-01';
    add(date,'1000',op.cash,0,'প্রারম্ভিক নগদ');
    add(date,'1010',op.bank,0,'প্রারম্ভিক ব্যাংক');
    add(date,'1200',op.inventory,0,'প্রারম্ভিক স্টক');
    add(date,'1500',op.fixedAssets,0,'প্রারম্ভিক স্থায়ী সম্পদ');
    add(date,'2000',0,ol,'প্রারম্ভিক দায়');
    add(date,'3000',0,Math.max(0,oa-ol),'প্রারম্ভিক মূলধন');
  }
  for(const l of vals(DATA.rawLots)){
    const landed=round2(n(l.qty)*n(l.rate)+n(l.transport)+n(l.loading));
    add(l.date,'1200',landed,0,`মাল ক্রয় — ${itemName(l.itemId)}`,'raw',l.id);
    add(l.date,'2000',0,landed,`মাল ক্রয় বাবদ প্রদেয় — ${itemName(l.itemId)}`,'raw',l.id);
  }

function trialBalance(asOf=todayISO()){
  const entries=buildJournal().filter(e=>e.date<=asOf);
  const map={};
  for(const e of entries){
    map[e.code]=map[e.code]||{code:e.code,debit:0,credit:0};
    map[e.code].debit=round2(map[e.code].debit+e.debit);
    map[e.code].credit=round2(map[e.code].credit+e.credit);
  }
  const rows=Object.values(map).sort((a,b)=>a.code.localeCompare(b.code)).map(r=>({...r,name:accountName(r.code),balance:round2(r.debit-r.credit)}));
  return {rows,debit:round2(sum(rows,'debit')),credit:round2(sum(rows,'credit'))};
}
function incomeStatement(from,to){
  const entries=buildJournal().filter(e=>e.date>=from&&e.date<=to);
  const byCode={};
  for(const e of entries){byCode[e.code]=byCode[e.code]||{debit:0,credit:0};byCode[e.code].debit+=e.debit;byCode[e.code].credit+=e.credit;}
  const revenue=round2((byCode['4000']?.credit||0)+(byCode['4010']?.credit||0)-(byCode['4000']?.debit||0)-(byCode['4010']?.debit||0));
  const cogs=round2((byCode['5000']?.debit||0)-(byCode['5000']?.credit||0));
  const shortage=round2((byCode['5010']?.debit||0)-(byCode['5010']?.credit||0));
  const expenses=[];
  for(const [code,v] of Object.entries(byCode)){
    if(code.startsWith('6')&&code!=='6100'){const amt=round2(v.debit-v.credit);if(amt) expenses.push({code,name:accountName(code),amount:amt});}
  }
  const depreciation=round2((byCode['6100']?.debit||0)-(byCode['6100']?.credit||0));
  const expenseTotal=round2(sum(expenses,'amount')+depreciation);
  const gross=round2(revenue-cogs);
  const net=round2(gross-shortage-expenseTotal);
  return {revenue,cogs,gross,shortage,expenses,depreciation,expenseTotal,net,entries};
}
function balanceSheet(asOf=todayISO()){
  const tb=trialBalance(asOf);
  const get=code=>{const r=tb.rows.find(x=>x.code===code);return r?round2(r.debit-r.credit):0;};
  const assets={cash:get('1000'),bank:get('1010'),receivable:get('1100'),raw:get('1200'),semi:get('1210'),wip:get('1220'),fg:get('1230'),fixed:get('1500'),accumDep:get('1590')};
  assets.total=round2(assets.cash+assets.bank+assets.receivable+assets.raw+assets.semi+assets.wip+assets.fg+assets.fixed+assets.accumDep);
  const liabilities={payable:round2(-get('2000'))};
  liabilities.total=round2(liabilities.payable);
  const capital={owner:round2(-get('3000')),retained:round2(-get('3100'))};
  const profit=incomeStatement('2000-01-01',asOf).net;
  capital.total=round2(capital.owner+capital.retained+profit);
  return {assets,liabilities,capital,profit,balanced:Math.abs(assets.total-liabilities.total-capital.total)<1};
}
function cashBalance(asOf=todayISO()){
  const tb=trialBalance(asOf);
  const row=tb.rows.find(r=>r.code==='1000');
  return row?round2(row.debit-row.credit):0;
}

function daysDiff(a,b=todayISO()){return Math.max(0,Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000));}
function tabButton(label,active,tab,value){return `<button type="button" class="${active?'active':''}" data-act="tab" data-tab="${tab}" data-value="${value}">${esc(label)}</button>`;}
function countKindLabel(kind){return {raw:'কাঁচামাল',semi:'সেমি-ফিনিশড',fg:'ফিনিশড গুডস',point:'ডেলিভারি পয়েন্ট'}[kind]||kind;}
function countRefName(c){return c.kind==='point'||c.kind==='fg'?productName(c.productId||c.refId):itemName(c.itemId||c.refId);}
function decisionButton(kind,id){if(!canApprove()) return '';return `<button class="btn btn-xs btn-primary" data-act="decision" data-kind="${kind}" data-id="${esc(id)}">সিদ্ধান্ত</button>`;}

function dispatchStats(d){
  const ss=vals(DATA.sales).filter(s=>s.dispatchId===d.id&&s.status!=='rejected');
  const sold=sum(ss,'qtySold'),returned=sum(ss,'qtyReturned');
  return {sold,returned,balance:round3(n(d.qty)-sold),sales:ss};
}
function renderFinished(){
  const tab=S.ui.finTab||'stock';
  const products=vals(DATA.products).map(p=>{
    const lots=fgStock(p.id,S.loc);
    const qty=sum(lots,'remaining'),cost=sum(lots,l=>n(l.remaining)*n(l.unitCost));
    return {p,qty,cost,avg:qty?cost/qty:0,retail:qty*n(p.price),min:n(p.minQty),low:n(p.minQty)>0&&qty<n(p.minQty)};
  }).sort((a,b)=>a.p.name.localeCompare(b.p.name,'bn'));
  const totalCost=sum(products,'cost'),totalRetail=sum(products,'retail');
  const dispatches=vals(DATA.dispatches).filter(d=>!S.loc||d.fromLocationId===S.loc||d.toLocationId===S.loc).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const atPoints=sum(dispatches,d=>dispatchStats(d).balance);
  const counts=vals(DATA.counts).filter(c=>c.kind==='fg'||c.kind==='point').sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const tabs=`<div class="tabs">${tabButton('ফিনিশড স্টক',tab==='stock','finTab','stock')}${tabButton('ডেলিভারি ও আউটলেট',tab==='dispatch','finTab','dispatch')}</div>`;
  registerCSV('fgStock',['পণ্য','একক','মজুদ','গড় ব্যয়','ব্যয় মূল্য','বিক্রয় মূল্য','মোট খুচরা মূল্য','সর্বনিম্ন'],
    products.map(r=>[r.p.name,r.p.unit,r.qty,round2(r.avg),round2(r.cost),r.p.price,round2(r.retail),r.min]));

function renderSales(){
  const tab=S.ui.salesTab||'sales';
  const from=S.ui.salesFrom||monthStart(),to=S.ui.salesTo||todayISO();
  const list=salesInRange(from,to,S.loc).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.createdAt).localeCompare(String(a.createdAt)));
  const allList=vals(DATA.sales).filter(s=>!S.loc||s.locationId===S.loc);
  const today=salesInRange(todayISO(),todayISO(),S.loc);
  const expected=sum(list,'expected'),actual=sum(list,'actual'),variance=round2(expected-actual),cost=sum(list,'cost');
  const daily={},byProduct={},byRep={};
  for(const s of list){
    const d=daily[s.date]||(daily[s.date]={expected:0,actual:0,variance:0,cost:0,count:0});
    d.expected+=n(s.expected);d.actual+=n(s.actual);d.variance+=n(s.variance);d.cost+=n(s.cost);d.count++;
    const pk=(s.type||'fg')+':'+(s.productId||s.itemId);
    const p=byProduct[pk]||(byProduct[pk]={title:saleTitle(s),qty:0,expected:0,actual:0,variance:0,cost:0,unit:saleUnit(s)});
    p.qty+=n(s.qtySold);p.expected+=n(s.expected);p.actual+=n(s.actual);p.variance+=n(s.variance);p.cost+=n(s.cost);
    const rk=s.repId||'none';
    const r=byRep[rk]||(byRep[rk]={qty:0,actual:0,expected:0,count:0});
    r.qty+=n(s.qtySold);r.actual+=n(s.actual);r.expected+=n(s.expected);r.count++;
  }
  registerCSV('salesList',['তারিখ','ধরন','পণ্য/মাল','লোকেশন','সেলস রিপ্রেজেনটেটিভ','পরিমাণ','দর','প্রত্যাশিত','আদায়','ব্যবধান','ব্যয়','অবস্থা'],

  registerCSV('salesDaily',['তারিখ','বিক্রয় সংখ্যা','প্রত্যাশিত','আদায়','ব্যবধান','ব্যয়','গ্রস মার্জিন'],

function ensureFaceApi(){
  return new Promise(async(resolve,reject)=>{
    try{
      if(!window.faceapi){
        await loadScript(FACE_SCRIPT);
      }
      if(!S.faceLoaded){
        await Promise.all([
          window.faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS),
          window.faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS),
          window.faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)
        ]);
        S.faceLoaded=true;
      }
      resolve(window.faceapi);
    }catch(e){reject(e);}
  });
}
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');s.src=src;s.async=true;
    s.onload=()=>resolve();s.onerror=()=>reject(new Error('স্ক্রিপ্ট লোড হয়নি'));
    document.head.appendChild(s);
  });
}
async function startCamera(videoId='cam-video'){
  const video=document.getElementById(videoId);
  if(!video) throw new Error('ক্যামেরা ভিউ পাওয়া যায়নি');
  if(!navigator.mediaDevices?.getUserMedia) throw new Error('এই ব্রাউজারে ক্যামেরা সমর্থিত নয়');
  stopCamera();
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:720}},audio:false});
  S.cam=stream;S.camTarget=videoId;
  video.srcObject=stream;
  try{await video.play();}catch(e){}
  const box=video.closest('.cam-box');
  if(box){const e=box.querySelector('.cam-empty');if(e)e.classList.add('hide');}
  return stream;
}
function stopCamera(){
  if(S.cam){try{S.cam.getTracks().forEach(t=>t.stop());}catch(e){}S.cam=null;}
  const v=document.getElementById(S.camTarget||'');
  if(v){try{v.srcObject=null;}catch(e){}}
  S.camTarget=null;S.lastSnap=null;
}
function snapVideo(videoId='cam-video'){
  const video=document.getElementById(videoId);
  if(!video||!video.videoWidth) return null;
  const w=360,h=Math.round(video.videoHeight/video.videoWidth*360);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');ctx.translate(w,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,w,h);
  return c.toDataURL('image/jpeg',0.55);
}
async function detectFace(videoId='cam-video'){
  const api=await ensureFaceApi();
  const video=document.getElementById(videoId);
  const res=await api.detectSingleFace(video,new api.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:0.45})).withFaceLandmarks().withFaceDescriptor();
  return res;
}
function distance(a,b){
  if(!a||!b||a.length!==b.length) return 99;
  let s=0;for(let i=0;i<a.length;i++){const d=n(a[i])-n(b[i]);s+=d*d;}
  return Math.sqrt(s);
}
function faceMatchEmployee(desc){
  let best=null;
  for(const emp of vals(DATA.employees)){
    if(!emp.active||!emp.faceDescriptor?.length) continue;
    const d=distance(desc,emp.faceDescriptor);
    if(!best||d<best.distance) best={employee:emp,distance:d};
  }
  return best&&best.distance<=0.58?best:null;
}

  const box=document.getElementById('face-result');

    S.faceMatch={id:match.employee.id,distance:match.distance};
    S.lastSnap=snapVideo('cam-video');
    const emp=match.employee;
    if(box) box.innerHTML=`<div class="face-result"><div class="face-avatar">${esc(initials(emp.name))}</div><div class="grow"><b>${esc(emp.name)}</b><div class="small muted">${esc(ROLE_NAMES[emp.role]||emp.role)} · মিল ${(1-match.distance).toFixed(2)} · ${esc(locShort(emp.locationId))}</div></div><button class="btn btn-primary btn-sm" data-act="punch-face">পাঞ্চ করুন</button></div>`;
  }catch(e){
    if(box) box.innerHTML=`<div class="alert red">${icon('warn')}<div><b>ফেস স্ক্যান সম্ভব হয়নি।</b> ${esc(e.message)}। ক্যামেরা বন্ধ থাকলে নতুন ট্যাবে খুলুন অথবা পিন দিয়ে হাজিরা দিন।</div></div>`;
  }
}

  const day=DATA.attendance[empId]?.[date]||null;
  let patch={};
  if(!day||!day.in){patch={...day,in:time,method,late:timeMin(time)>timeMin(DATA.settings.lateAfter||'09:30')||undefined,inPhoto:photo||undefined,createdAt:new Date().toISOString()};toast(`${emp.name} — চেক ইন ${fmtTime(time)}`,'good');}
  else if(!day.out){patch={...day,out:time,outPhoto:photo||undefined,outMethod:method};toast(`${emp.name} — চেক আউট ${fmtTime(time)}`,'good');}

  await batch([{path:`attendance/${empId}/${date}`,value:patch}]);
  S.faceMatch=null;stopCamera();
  if(S.page==='attendance') render();
}
function workingDaysInMonth(month){
  if(!month) return 0;
  const [y,m]=month.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const now=new Date();
  let count=0;
  for(let d=1;d<=last;d++){
    const dt=new Date(y,m-1,d);
    if(dt>now) break;
    if(dt.getDay()!==5) count++;
  }
  return count;
}
function monthAttendance(month){
  const [y,m]=String(month).split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  const today=new Date();
  const rows=vals(DATA.employees).filter(e=>e.active!==false).map(e=>{
    const days=DATA.attendance[e.id]||{};
    let present=0,late=0,hours=0,lastIn='';
    for(let d=1;d<=last;d++){
      const key=`${month}-${String(d).padStart(2,'0')}`;
      const dt=new Date(y,m-1,d);if(dt>today) break;
      const a=days[key];
      if(a?.in){present++;if(a.late)late++;lastIn=a.in;if(a.out)hours+=Math.max(0,timeMin(a.out)-timeMin(a.in));}
    }
    const wd=workingDaysInMonth(month);
    return {e,present,late,absent:Math.max(0,wd-present),hours,avgIn:lastIn,rate:wd?present/wd*100:0};
  });
  return rows;
}

function renderExpenses(){
  const month=S.ui.expMonth||todayISO().slice(0,7);
  const statusFilter=S.ui.expStatus||'all';
  let list=vals(DATA.expenses).filter(x=>!S.loc||x.locationId===S.loc);
  if(month) list=list.filter(x=>monthKey(x.date)===month);
  if(statusFilter!=='all') list=list.filter(x=>x.status===statusFilter);
  list.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const approved=list.filter(x=>x.status==='approved');
  const pending=list.filter(x=>x.status==='pending');
  const rejected=list.filter(x=>x.status==='rejected');
  const total=sum(approved,'amount');
  const byCat={};
  for(const x of approved) byCat[x.category]=(byCat[x.category]||0)+n(x.amount);
  const maxCat=Math.max(...Object.values(byCat),1);
  const allMonth=vals(DATA.expenses).filter(x=>!month||monthKey(x.date)===month);
  registerCSV('expenses',['তারিখ','খরচের ধরন','বিবরণ','লোকেশন','প্রদানকারী','পরিমাণ','অবস্থা','অনুমোদনকারী','নোট'],
    list.map(x=>[fmtDate(x.date),expenseCatName(x.category),x.description,locShort(x.locationId),x.paidBy||'',x.amount,x.status==='approved'?'অনুমোদিত':x.status==='pending'?'অপেক্ষমাণ':'বাতিল',x.approvedBy||'',x.note||'']));
  registerCSV('expenseCats',['খরচের ধরন','পরিমাণ','শতাংশ'],
    Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[expenseCatName(k),v,round2(v/Math.max(1,total)*100)]));
  return `<div class="stack">
    <div class="grid g4">
      ${statCard('অনুমোদিত খরচ',tk(total),month?monthLabel(month):'সব সময়','wallet','green','up')}
      ${statCard('অপেক্ষমাণ',tk(sum(pending,'amount')),`${fmtNum(pending.length)}টি অনুমোদন বাকি`,'clock','gold')}
      ${statCard('বাতিল',tk(sum(rejected,'amount')),`${fmtNum(rejected.length)}টি এন্ট্রি`,'x','red')}
      ${statCard('মোট এন্ট্রি',fmtNum(list.length),`${fmtNum(allMonth.length)}টি এই মাসে`,'book')}
    </div>
    <div class="row between wrap no-print">
      <div class="tabs">${tabButton('খরচের তালিকা',true,'x','x')}</div>
      <div class="row wrap">${btn('খরচ যোগ করুন',{act:'add-expense',cls:'btn-primary',ic:'plus'})}${csvBtn('expenses')}</div>
    </div>
    <div class="card">
      <div class="card-head"><div><h2>${icon('wallet')} খরচের তালিকা</h2><p>যে খরচ করবে সে এন্ট্রি দেবে; অনুমোদনের পর তা হিসাবে যুক্ত হবে</p></div>${csvBtn('expenses')}</div>
      <div class="filter-bar no-print" style="margin-bottom:12px">
        <div class="field"><label>মাস</label><input type="month" data-filter="expMonth" value="${month}"></div>
        <div class="field"><label>অবস্থা</label><select data-filter="expStatus"><option value="all" ${statusFilter==='all'?'selected':''}>সব</option><option value="pending" ${statusFilter==='pending'?'selected':''}>অপেক্ষমাণ</option><option value="approved" ${statusFilter==='approved'?'selected':''}>অনুমোদিত</option><option value="rejected" ${statusFilter==='rejected'?'selected':''}>বাতিল</option></select></div>
        <div class="field"><label>লোকেশন</label><select data-loc>${locOptions(S.loc)}</select></div>
        <button class="btn btn-sm" type="button" data-act="exp-all">সব মাস</button>
      </div>
      ${list.length?`<div class="table-wrap"><table class="tbl">
        <thead><tr>${th('তারিখ')}${th('খরচ')}${th('লোকেশন / প্রদানকারী')}${th('পরিমাণ','num')}${th('অবস্থা')}${th('অনুমোদন')}${th('','num')}</tr></thead>
        <tbody>${list.map(x=>`<tr>
          <td class="nowrap">${fmtDate(x.date)}</td>
          <td><span class="t-main">${esc(x.description)}</span><span class="t-sub">${esc(expenseCatName(x.category))}</span></td>
          <td><span class="small">${esc(locShort(x.locationId))}</span><span class="t-sub">${esc(x.paidBy||'—')}</span></td>
          <td class="num b">${tk(x.amount)}</td><td>${statusBadge(x.status)}</td>
          <td>${x.approvedBy?`<span class="small">${esc(x.approvedBy)}</span>`:`<span class="small muted">—</span>`}</td>
          <td class="num no-print">${x.status==='pending'?decisionButton('expense',x.id):''}</td>
        </tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="3">অনুমোদিত মোট</td><td class="num">${tk(total)}</td><td colspan="3"></td></tr></tfoot>
      </table></div>`:emptyState('এই মাসে কোনো খরচ নেই','wallet')}
    </div>
    <div class="grid g2">
      <div class="card">
        <div class="card-head"><div><h2>${icon('chart')} খরচের বিভাজন</h2><p>${month?monthLabel(month):'সব সময়'} · অনুমোদিত</p></div>${csvBtn('expenseCats')}</div>
        ${Object.keys(byCat).length?Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="mt12"><div class="between small"><span>${esc(expenseCatName(k))}</span><b>${tk(v)}</b></div><div class="progress mt8"><i style="width:${Math.round(v/maxCat*100)}%"></i></div></div>`).join(''):emptyState('খরচের তথ্য নেই')}
      </div>
      <div class="card">
        <div class="card-head"><div><h2>${icon('check')} অনুমোদনের নিয়ম</h2><p>সিস্টেমের নিয়ন্ত্রণ</p></div></div>
        <div class="list">
          <div class="list-item"><div class="avatar blue">${icon('wallet','ic-sm')}</div><div class="list-main"><strong>এন্ট্রি যে কেউ দিতে পারে</strong><span>তারিখ, ধরন, রসিদ ও পরিমাণ</span></div><span class="badge green">অনুমোদনহীন</span></div>
          <div class="list-item"><div class="avatar gold">${icon('clock','ic-sm')}</div><div class="list-main"><strong>অনুমোদনকারী যাচাই করবেন</strong><span>রসিদ ও প্রয়োজনীয়তা দেখে সিদ্ধান্ত</span></div><span class="badge gold">অপেক্ষমাণ</span></div>
          <div class="list-item"><div class="avatar green">${icon('check','ic-sm')}</div><div class="list-main"><strong>অনুমোদনের পর হিসাবে যাবে</strong><span>ট্রায়াল ব্যালেন্স ও লাভ-ক্ষতিতে যুক্ত</span></div><span class="badge green">স্বয়ংক্রিয়</span></div>
        </div>
        <div class="alert mt12">${icon('warn')}<div>বেতন দেওয়ার আগে পেন্ডিং খরচ ও অনুমোদন রিপোর্ট দেখুন। বাতিল খরচ কোনো হিসাবে যাবে না।</div></div>
      </div>
    </div>
  </div>`;
}

function renderAssets(){

function ledgerRows(code,from,to){
  const all=buildJournal().filter(e=>e.code===code).sort((a,b)=>a.date.localeCompare(b.date));
  const before=all.filter(e=>e.date<from);
  let bal=round2(sum(before,e=>e.debit-e.credit));
  const rows=all.filter(e=>e.date>=from&&e.date<=to).map(e=>{
    bal=round2(bal+e.debit-e.credit);
    return {...e,balance:bal};
  });
  return {opening:round2(sum(before,e=>e.debit-e.credit)),rows,closing:bal,all};
}

const FIREBASE_RULES = `{
  "rules": {
    "users": {
      ".read": "auth != null && root.child('users').child(auth.uid).child('role').val() === 'admin'",
      "$uid": {
        ".read": "auth != null && auth.uid === $uid",
        ".write": "auth != null && (root.child('users').child(auth.uid).child('role').val() === 'admin' || (auth.uid === $uid && !root.child('users').child(auth.uid).exists() && root.child('users').numChildren() === 0 && newData.child('role').val() === 'admin'))",
        ".validate": "newData.hasChildren(['email','role','active']) && newData.child('active').isBoolean() && (newData.child('role').val() === 'admin' || newData.child('role').val() === 'authority' || newData.child('role').val() === 'manager' || newData.child('role').val() === 'operator' || newData.child('role').val() === 'sales' || newData.child('role').val() === 'accounts')"
      }
    },
    "ips": {
      ".read": "auth != null && root.child('users').child(auth.uid).child('active').val() === true",
      ".write": "auth != null && root.child('users').child(auth.uid).child('active').val() === true"
    }
  }
}`;

function renderReports(){
  const from=S.ui.reportFrom||monthStart(),to=S.ui.reportTo||todayISO();
  const loc=S.loc;
  const sales=salesInRange(from,to,loc);
  const expected=sum(sales,'expected'),actual=sum(sales,'actual'),variance=round2(expected-actual),cost=sum(sales,'cost');
  const pnl=incomeStatement(from,to);
  const expenses=vals(DATA.expenses).filter(x=>x.status==='approved'&&x.date>=from&&x.date<=to&&(!loc||x.locationId===loc));
  const outputs=vals(DATA.outputs).filter(o=>o.date>=from&&o.date<=to&&(!loc||o.locationId===loc));
  const daily={};
  for(const s of sales){
    const d=daily[s.date]||(daily[s.date]={count:0,expected:0,actual:0,variance:0,cost:0});
    d.count++;d.expected+=n(s.expected);d.actual+=n(s.actual);d.variance+=n(s.variance);d.cost+=n(s.cost);
  }
  const byProduct={};
  for(const s of sales){
    const key=(s.type||'fg')+':'+(s.productId||s.itemId);
    const p=byProduct[key]||(byProduct[key]={title:saleTitle(s),unit:saleUnit(s),qty:0,expected:0,actual:0,cost:0});
    p.qty+=n(s.qtySold);p.expected+=n(s.expected);p.actual+=n(s.actual);p.cost+=n(s.cost);
  }
  const stockLocations=vals(DATA.locations).filter(l=>!loc||l.id===loc).map(l=>({l,raw:stockValueRaw(l.id),semi:stockValueSemi(l.id),wip:wipValue(l.id),fg:stockValueFG(l.id),retail:retailValueFG(l.id)}));
  const expCats={};
  for(const x of expenses) expCats[x.category]=(expCats[x.category]||0)+n(x.amount);
  const days=Object.keys(daily).sort();
  const chartDays=days.slice(-14);
  const chartMax=Math.max(...chartDays.map(d=>daily[d].actual),1);
  const totalStock=sum(stockLocations,x=>x.raw+x.semi+x.wip+x.fg);
  registerCSV('reportDaily',['তারিখ','বিক্রয় সংখ্যা','প্রত্যাশিত','আদায়','ব্যবধান','ব্যয়','গ্রস মার্জিন'],days.map(d=>[fmtDate(d),daily[d].count,daily[d].expected,daily[d].actual,daily[d].variance,daily[d].cost,round2(daily[d].expected-daily[d].cost)]));
  registerCSV('reportProducts',['পণ্য','একক','পরিমাণ','প্রত্যাশিত','আদায়','ব্যয়','গ্রস মার্জিন'],Object.values(byProduct).map(p=>[p.title,p.unit,p.qty,p.expected,p.actual,p.cost,round2(p.expected-p.cost)]));
  registerCSV('reportStock',['লোকেশন','কাঁচামাল','সেমি','WIP','ফিনিশড ব্যয়','ফিনিশড খুচরা'],stockLocations.map(x=>[x.l.name,x.raw,x.semi,x.wip,x.fg,x.retail]));
  registerCSV('reportExpenses',['খরচের ধরন','পরিমাণ','শতাংশ'],Object.entries(expCats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[expenseCatName(k),v,round2(v/Math.max(1,sum(Object.values(expCats)))*100)]));
  registerCSV('reportProduction',['তারিখ','ব্যাচ','পণ্য','পরিমাণ','কাঁচামাল ব্যয়','রূপান্তর','মোট ব্যয়'],outputs.map(o=>[fmtDate(o.date),o.batch||'',productName(o.productId),o.qty,o.rawCost,o.conversion,round2(n(o.rawCost)+n(o.conversion))]));
  return `<div class="stack">
    <div class="card no-print">
      <div class="filter-bar">
        <div class="field"><label>শুরুর তারিখ</label><input type="date" data-filter="reportFrom" value="${from}"></div>
        <div class="field"><label>শেষ তারিখ</label><input type="date" data-filter="reportTo" value="${to}"></div>
        <div class="field"><label>লোকেশন</label><select data-loc>${locOptions(S.loc)}</select></div>
        <div class="field"><label>দ্রুত সময়</label><div class="chips"><button class="chip" data-act="range" data-target="report" data-days="3">৩ দিন</button><button class="chip" data-act="range" data-target="report" data-days="7">৭ দিন</button><button class="chip" data-act="range" data-target="report" data-days="30">৩০ দিন</button><button class="chip" data-act="range" data-target="report" data-days="month">এই মাস</button><button class="chip" data-act="range" data-target="report" data-days="fiscal">অর্থবছর</button></div></div>
        <div class="grow"></div>
        <button class="btn btn-primary" data-act="print">${icon('print')}<span>প্রিন্ট</span></button>
        <button class="btn" data-act="backup">${icon('download')}<span>ব্যাকআপ</span></button>
      </div>
    </div>
    <div class="print-title"><h2>${esc(DATA.settings.company)}</h2><div class="small">ম্যানেজমেন্ট রিপোর্ট · ${fmtDate(from)} — ${fmtDate(to)}</div></div>
    <div class="grid g4">
      ${statCard('বিক্রয় আয়',tk(expected),`${fmtNum(sales.length)}টি লেনদেন`,'cart')}
      ${statCard('প্রকৃত আদায়',tk(actual),`আদায় ব্যবধান ${tk(variance)}`,'wallet','green','up')}
      ${statCard('গ্রস মুনাফা',tk(pnl.gross),`মার্জিন ${pnl.revenue?pct(pnl.gross/pnl.revenue*100):'—'}`,'chart','gold')}
      ${statCard('নিট মুনাফা',tk(pnl.net),`খরচ ${tk(pnl.expenseTotal)}`,'check',pnl.net>=0?'green':'red')}
    </div>
    <div class="grid g4">
      ${statCard('মোট স্টক মূল্য',tk(totalStock),'কাঁচামাল + সেমি + WIP + ফিনিশড','box','blue')}
      ${statCard('ফিনিশড খুচরা মূল্য',tk(sum(stockLocations,'retail')),'সম্ভাব্য বিক্রয়মূল্য','bag')}
      ${statCard('এই সময়ের উৎপাদন',fmtNum(sum(outputs,'qty')),`${fmtNum(outputs.length)}টি আউটপুট`,'factory','gold')}
      ${statCard('নগদ ব্যালেন্স',tk(cashBalance(to)),'হিসাব অনুযায়ী','wallet',cashBalance(to)<0?'red':'')}
    </div>
    <div class="grid g23">
      <div class="card">
        <div class="card-head"><div><h2>${icon('chart')} দৈনিক বিক্রয় ও আদায়</h2><p>সর্বশেষ ১৪ দিনের প্রবণতা</p></div>${csvBtn('reportDaily')}</div>
        ${chartDays.length?`<div class="bar-chart">
          ${chartDays.map(d=>`<div class="bar-col" title="${fmtDate(d)} — ${tk(daily[d].actual)}"><span class="bar-val">${daily[d].actual?fmtNum(daily[d].actual/1000,0)+'k':''}</span><div class="bar" style="height:${Math.max(3,Math.round(daily[d].actual/chartMax*110))}px"></div><span class="bar-x">${fmtDate(d,true)}</span></div>`).join('')}
        </div>`:emptyState('এই সময়ে বিক্রয় নেই','chart')}
      </div>
      <div class="card">
        <div class="card-head"><div><h2>${icon('warn')} ব্যবস্থাপনা পর্যবেক্ষণ</h2><p>যেসব বিষয়ে নজর দরকার</p></div></div>
        <div class="list">
          <div class="list-item"><div class="avatar ${variance>0?'gold':'green'}">${icon('cart','ic-sm')}</div><div class="list-main"><strong>আদায় ব্যবধান</strong><span>প্রত্যাশিত ${tk(expected)} · আদায় ${tk(actual)}</span></div><div class="list-val ${variance>0?'amount-neg':''}">${tk(variance)}</div></div>
          <div class="list-item"><div class="avatar ${pendingTotalCount()?'gold':'green'}">${icon('check','ic-sm')}</div><div class="list-main"><strong>অনুমোদন বাকি</strong><span>খরচ, বিক্রয় ও স্টক</span></div><div class="list-val">${fmtNum(pendingTotalCount())}টি</div></div>
          <div class="list-item"><div class="avatar ${lowStockItems().length?'red':'green'}">${icon('box','ic-sm')}</div><div class="list-main"><strong>লো-স্টক মাল</strong><span>${lowStockItems().length?lowStockItems().map(x=>esc(x.item.name)).slice(0,3).join(', '):'সব স্টক যথেষ্ট'}</span></div><div class="list-val">${fmtNum(lowStockItems().length)}</div></div>
          <div class="list-item"><div class="avatar ${pnl.net>=0?'green':'red'}">${icon('chart','ic-sm')}</div><div class="list-main"><strong>নিট ফলাফল</strong><span>আয় ${tk(pnl.revenue)} · ব্যয় ${tk(pnl.cogs+pnl.expenseTotal)}</span></div><div class="list-val ${pnl.net<0?'amount-neg':'amount-pos'}">${tk(pnl.net)}</div></div>
        </div>
      </div>
    </div>
    <div class="grid g2">
      <div class="card">
        <div class="card-head"><div><h2>${icon('cart')} পণ্য অনুযায়ী বিক্রয়</h2><p>পরিমাণ, আদায় ও গ্রস মার্জিন</p></div>${csvBtn('reportProducts')}</div>

/* ==================== PART 8 — MODAL ও ফর্ম ==================== */
function fld(label,html,span=''){return `<div class="field ${span}"><label>${esc(label)}</label>${html}</div>`;}
function dateIn(name,value,attrs=''){return `<input type="date" name="${esc(name)}" value="${esc(value||todayISO())}" ${attrs}>`;}
function textIn(name,value='',attrs=''){return `<input name="${esc(name)}" value="${esc(value)}" ${attrs}>`;}
function numIn(name,value='',attrs=''){return `<input type="number" name="${esc(name)}" value="${value===''?'':esc(value)}" step="any" min="0" inputmode="decimal" ${attrs}>`;}
function locPick(types,selected,name='locationId',required=true,id=''){
  const list=vals(DATA.locations).filter(l=>!types||types.includes(l.type)).sort((a,b)=>String(a.name).localeCompare(String(b.name),'bn'));
  let pick=selected||S.loc||'';
  if(!list.some(l=>l.id===pick)) pick=list[0]?.id||'';
  return `<select name="${esc(name)}" ${id?`id="${esc(id)}"`:''} ${required?'required':''}>${optionList(list.map(l=>[l.id,l.name]),pick)}</select>`;
}
function itemPick(kind,selected,name='itemId',locationId='',id=''){
  let list=vals(DATA.items);
  if(kind==='semi') list=list.filter(i=>semiQty(i.id,locationId)>0);
  if(kind==='raw') list=list.filter(i=>rawQty(i.id,locationId)>0);
  if(kind==='raw'&&!list.length) list=vals(DATA.items);
  if(kind==='semi'&&!list.length) list=vals(DATA.items);
  list=[...list].sort((a,b)=>String(a.name).localeCompare(String(b.name),'bn'));
  let pick=selected||'';
  if(!list.some(i=>i.id===pick)) pick=list[0]?.id||'';
  return `<select name="${esc(name)}" ${id?`id="${esc(id)}"`:''} required>${optionList(list.map(i=>[i.id,`${i.name} (${i.unit})`]),pick)}</select>`;
}
function productPick(locationId,selected,name='productId',id=''){
  let list=vals(DATA.products);
  if(locationId) list=list.filter(p=>fgQty(p.id,locationId)>0);
  if(!list.length) list=vals(DATA.products);
  list=[...list].sort((a,b)=>String(a.name).localeCompare(String(b.name),'bn'));
  let pick=selected||'';
  if(!list.some(p=>p.id===pick)) pick=list[0]?.id||'';
  return `<select name="${esc(name)}" ${id?`id="${esc(id)}"`:''} required>${optionList(list.map(p=>[p.id,`${p.name} (${p.unit})`]),pick)}</select>`;
}

function openCountModal({kind='raw',id='',item=''}={}){
  const dispatch=kind==='point'?byId('dispatches',id):null;
  const selKind=['raw','semi','fg','point'].includes(kind)?kind:'raw';
  const loc=dispatch?dispatch.toLocationId:(S.loc||'');
  const ref=dispatch?dispatch.id:(selKind==='fg'?item:item);
  let refField='';
  if(selKind==='raw'||selKind==='semi'){
    const list=[...vals(DATA.items)].sort((a,b)=>String(a.name).localeCompare(String(b.name),'bn'));
    const pick=list.some(i=>i.id===ref)?ref:list[0]?.id||'';
    refField=`<select name="refId" id="count-ref" data-live="count" required>${optionList(list.map(i=>[i.id,`${i.name} (${i.unit})`]),pick)}</select>`;
  }else if(selKind==='fg'){

    const ds=vals(DATA.dispatches).filter(d=>dispatchBalance(d)>0).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    refField=`<select name="refId" id="count-ref" data-live="count" required>${optionList(ds.map(d=>[d.id,`${productName(d.productId)} — ${locShort(d.toLocationId)} · অবশিষ্ট ${fmtNum(dispatchBalance(d))}`]),dispatch?.id||ds[0]?.id||'')}</select>`;

      ${fld(selKind==='fg'?'পণ্য':selKind==='point'?'ডেলিভারি':'মাল',refField,'span2')}

function openDecisionModal(kind,id){
  if(!canApprove()){toast('সিদ্ধান্ত নিতে অনুমোদনকারী বা অ্যাডমিন রোলে যান','bad');return;}
  let title='সিদ্ধান্ত',detail='',amount=0;
  if(kind==='expense'){
    const x=byId('expenses',id);if(!x){toast('এন্ট্রি পাওয়া যায়নি','bad');return;}
    title='খরচ অনুমোদন';amount=n(x.amount);
    detail=`<div class="kv">
      <span class="k">তারিখ</span><span class="v">${fmtDate(x.date)}</span>
      <span class="k">ধরন</span><span class="v">${esc(expenseCatName(x.category))}</span>
      <span class="k">বিবরণ</span><span class="v">${esc(x.description)}</span>
      <span class="k">লোকেশন</span><span class="v">${esc(locShort(x.locationId))}</span>
      <span class="k">প্রদানকারী</span><span class="v">${esc(x.paidBy||'—')}</span>
      <span class="k">পরিমাণ</span><span class="v">${tk(x.amount)}</span>
      <span class="k">নোট</span><span class="v">${esc(x.note||'—')}</span>
    </div>`;
  }else if(kind==='sale'){
    const s=byId('sales',id);if(!s){toast('বিক্রয় পাওয়া যায়নি','bad');return;}
    title='বিক্রয় আদায়ের ব্যবধান';amount=n(s.variance);
    detail=`<div class="kv">
      <span class="k">তারিখ</span><span class="v">${fmtDate(s.date)}</span>
      <span class="k">পণ্য</span><span class="v">${esc(saleTitle(s))}</span>
      <span class="k">লোকেশন / রিপ</span><span class="v">${esc(locShort(s.locationId))} · ${esc(empName(s.repId)||'—')}</span>
      <span class="k">পরিমাণ</span><span class="v">${fmtNum(s.qtySold)} ${esc(saleUnit(s))}</span>
      <span class="k">প্রত্যাশিত</span><span class="v">${tk(s.expected)}</span>
      <span class="k">আদায়</span><span class="v">${tk(s.actual)}</span>
      <span class="k">ব্যবধান</span><span class="v amount-neg">${tk(s.variance)}</span>
      <span class="k">কারণ</span><span class="v">${esc(s.note||'—')}</span>
    </div>`;
  }else if(kind==='count'){
    const c=byId('counts',id);if(!c){toast('গণনা পাওয়া যায়নি','bad');return;}
    title='স্টক গরমিলের সিদ্ধান্ত';
    detail=`<div class="kv">
      <span class="k">তারিখ</span><span class="v">${fmtDate(c.date)}</span>
      <span class="k">ধরন</span><span class="v">${esc(countKindLabel(c.kind))}</span>
      <span class="k">আইটেম</span><span class="v">${esc(countRefName(c))}</span>
      <span class="k">লোকেশন</span><span class="v">${esc(locShort(c.locationId))}</span>
      <span class="k">সিস্টেম</span><span class="v">${fmtNum(c.systemQty,1)}</span>
      <span class="k">গণনা</span><span class="v">${fmtNum(c.countedQty,1)}</span>
      <span class="k">পার্থক্য</span><span class="v ${n(c.diff)<0?'amount-neg':'amount-pos'}">${n(c.diff)>0?'+':''}${fmtNum(c.diff,1)}</span>
      <span class="k">কারণ</span><span class="v">${esc(c.note||'—')}</span>
    </div>`;
  }else{
    const l=byId('leaves',id);if(!l){toast('ছুটির আবেদন পাওয়া যায়নি','bad');return;}
    title='ছুটির আবেদন';
    detail=`<div class="kv">
      <span class="k">কর্মী</span><span class="v">${esc(empName(l.employeeId))}</span>
      <span class="k">ধরন</span><span class="v">${esc(l.type||'ছুটি')}</span>
      <span class="k">থেকে</span><span class="v">${fmtDate(l.from)}</span>
      <span class="k">পর্যন্ত</span><span class="v">${fmtDate(l.to)}</span>
      <span class="k">মোট দিন</span><span class="v">${fmtNum(leaveDays(l))}</span>
      <span class="k">কারণ</span><span class="v">${esc(l.reason||'—')}</span>
      <span class="k">অবস্থা</span><span class="v">${statusBadge(l.status)}</span>
    </div>`;
  }
  openModal({title,sub:'অনুমোদন বা বাতিল — সিদ্ধান্তের কারণ সংরক্ষিত হবে',form:'decision',hidden:{kind,id},body:`
    ${detail}
    <div class="divider"></div>
    <div class="form-grid">
      ${fld('সিদ্ধান্ত',`<select name="action"><option value="approve">অনুমোদন করুন</option><option value="reject">বাতিল করুন</option></select>`)}
      ${fld('মন্তব্য / কারণ',textIn('comment',''),'span2')}
    </div>
    <div class="alert ${kind==='expense'?'gold':'red'} mt12">${icon('warn')}<div>${kind==='expense'?'অনুমোদিত খরচ ট্রায়াল ব্যালেন্স ও লাভ-ক্ষতিতে যুক্ত হবে।':kind==='sale'?'বাতিল করলে বিক্রয়টি হিসাব থেকে বাদ যাবে এবং স্টক ফেরত যাবে।':kind==='count'?'অনুমোদিত গণনার পার্থক্য অনুযায়ী স্টক সমন্বয় হবে।':'অনুমোদিত ছুটি হাজিরা রিপোর্টে যুক্ত হবে।'}</div></div>`});
}

    <div class="cam-box">
      <video id="enroll-video" autoplay playsinline muted></video>

function openAssetDetail(id){
  const a=byId('assets',id);

function refreshCountSystem(){
  const out=$('#count-system');
  if(!out) return;
  const kind=$('#count-kind')?.value||'raw';
  const loc=$('#count-loc')?.value||'';
  const ref=$('#count-ref')?.value||'';
  let qty=0,unit='';
  if(kind==='raw'){qty=rawQty(ref,loc);unit=itemUnit(ref);}
  else if(kind==='semi'){qty=semiQty(ref,loc);unit=itemUnit(ref);}
  else if(kind==='fg'){qty=fgQty(ref,loc);unit=productUnit(ref);}
  else{const d=byId('dispatches',ref);qty=dispatchBalance(d);unit=d?productUnit(d.productId):'';}
  out.textContent=`${fmtNum(qty,1)} ${unit}`.trim();
}

function nearestLocation(lat,lng,fallback){
  let best=null;
  for(const l of vals(DATA.locations)){
    if(l.lat==null||l.lng==null) continue;
    const R=6371000,toRad=x=>x*Math.PI/180;
    const dLat=toRad(n(l.lat)-lat),dLng=toRad(n(l.lng)-lng);
    const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat))*Math.cos(toRad(n(l.lat)))*Math.sin(dLng/2)**2;
    const dist=2*R*Math.asin(Math.sqrt(a));
    if(!best||dist<best.dist) best={id:l.id,dist};
  }
  return best&&best.dist<=4000?best.id:fallback;
}

async function saveEntity(coll,id,patch){
  if(id) return batch([planUpdate(coll,id,patch)]);
  return batch([planAdd(coll,patch)]);
}

        S.lastGeo=Date.now();
        const lat=Math.round(pos.coords.latitude*1e6)/1e6;

        const locationId=nearestLocation(lat,lng,emp.locationId);

  try{

    if(!raw||typeof raw!=='object') throw new Error('ফাইলটি বৈধ ব্যাকআপ নয়');
    if(!confirm('রিস্টোর করলে বর্তমান ডেটা প্রতিস্থাপিত হবে। চালিয়ে যাবেন?')){input.value='';return;}
    await replaceData(normalizeData(raw));

  }catch(err){
    toast('রিস্টোর ব্যর্থ: '+err.message,'bad');
  }
  input.value='';
}
